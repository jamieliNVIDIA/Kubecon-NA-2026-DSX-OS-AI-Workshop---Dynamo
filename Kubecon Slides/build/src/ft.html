<meta charset="utf-8">
<title>Dynamo Fault Tolerance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: fixed 1920x1080 stage scaled to the screen. Every slide = header row + body that fills
   the remaining height; diagrams are SVGs whose viewBox matches their box, so SVG px = stage px.
   Light by default, dark via toggle. One color per layer, separate state colors. */
:root {
  color-scheme: light;
  --outer: #dfe6e4; --bg: #eef2f1; --panel: #ffffff; --panel-2: #f3f6f5; --sink: #f1f4f3;
  --line: rgba(16,24,28,.13); --fg: #12191c; --dim: #56636a; --faint: #7a878d;
  --accent: #5e9a00; --accent-ink: #4a7a00; --accent-hi: #76b900; --cyan-hi: #3ec7e0;
  --c-req: #4a74e8; --c-route: #8a5cf0; --c-life: #c27400; --c-state: #1597b3;
  --ok: #5e9a00; --fail: #e0353b; --recover: #b08400; --on-accent: #ffffff;
  --code-bg: #eef3e6; --code-ink: #3d6600;
  --shadow: 0 1px 2px rgba(16,24,28,.06), 0 8px 24px rgba(16,24,28,.08);
  --glow-a: rgba(118,185,0,.12); --glow-b: rgba(62,199,224,.10); --base-a: #f9fbfa; --base-b: #eef2f1;
  --hero-a: rgba(118,185,0,.18); --hero-b: rgba(62,199,224,.16);
  --nav-bg: rgba(255,255,255,.88); --nav-line: rgba(16,24,28,.18);
  --font-display: Inter,-apple-system,Helvetica,Arial,sans-serif;
  --font-body: Inter,-apple-system,Helvetica,Arial,sans-serif;
  --font-mono: JetBrains Mono,ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --outer: #040506; --bg: #07090a; --panel: #11171a; --panel-2: #172025; --sink: #0d1316;
  --line: rgba(255,255,255,.10); --fg: #e8eef0; --dim: #c8d2d6; --faint: #8f9ca3;
  --accent: #76b900; --accent-ink: #76b900; --accent-hi: #76b900; --cyan-hi: #3ec7e0;
  --c-req: #7aa2ff; --c-route: #b48cff; --c-life: #f5a623; --c-state: #3ec7e0;
  --ok: #76b900; --fail: #ff5a5f; --recover: #ffd166; --on-accent: #0a0d0b;
  --code-bg: rgba(118,185,0,.12); --code-ink: #d9f2a8;
  --shadow: 0 2px 4px rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.22);
  --glow-a: rgba(118,185,0,.10); --glow-b: rgba(62,199,224,.08); --base-a: #080b0c; --base-b: #06080a;
  --hero-a: rgba(118,185,0,.14); --hero-b: rgba(62,199,224,.12);
  --nav-bg: rgba(20,28,32,.75); --nav-line: rgba(255,255,255,.16);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: var(--outer); color: var(--fg); font-family: var(--font-body); }

.viewport { position: fixed; inset: 0; overflow: hidden; background: var(--outer); }
.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--s, .5)); background: var(--bg); font-size: 28px; line-height: 1.4; overflow: hidden; }

.slide {
  position: absolute; inset: 0;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 28px;
  padding: 52px 96px 76px;
  opacity: 0; pointer-events: none; visibility: hidden;
  transition: opacity .35s ease, visibility 0s linear .35s;
  background:
    radial-gradient(ellipse at 10% 0%, var(--glow-a), transparent 45%),
    radial-gradient(ellipse at 95% 100%, var(--glow-b), transparent 45%),
    linear-gradient(180deg, var(--base-a), var(--base-b));
}
.slide.active { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity .35s ease, visibility 0s; }
.slide[data-cat="req"] { --cat: var(--c-req); }
.slide[data-cat="route"] { --cat: var(--c-route); }
.slide[data-cat="life"] { --cat: var(--c-life); }
.slide[data-cat="state"] { --cat: var(--c-state); }
.slide[data-cat="all"] { --cat: var(--fg); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* chrome */
.chrome { position: fixed; z-index: 100; display: flex; gap: 8px; align-items: center; }
.chrome.br { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.chrome.bl { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); font: 600 14px var(--font-mono); color: var(--faint); gap: 14px; }
.chrome button { min-width: 40px; height: 38px; padding: 0 12px; border: 1px solid var(--line); background: var(--panel); color: var(--dim); border-radius: 8px; cursor: pointer; font: 600 14px var(--font-body); }
.chrome button:hover, .chrome button:focus-visible { color: var(--fg); border-color: var(--dim); outline: none; }
.chrome .sec { text-transform: uppercase; letter-spacing: .1em; }
.progress { position: fixed; bottom: 0; left: 0; height: 4px; z-index: 100; transition: width .35s ease; }
body.fs .chrome { opacity: 0; transition: opacity .3s; }
body.fs .chrome:hover { opacity: 1; }

/* type */
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -.02em; color: var(--fg); text-wrap: balance; }
h1 { font-size: 104px; font-weight: 800; line-height: 1; }
h2 { font-size: 56px; font-weight: 800; line-height: 1.08; }
h3 { font-size: 32px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.head { display: flex; flex-direction: column; gap: 10px; }
.head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
.eyebrow { font: 600 22px var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--cat); display: flex; gap: 16px; align-items: center; }
.lede { font-size: 34px; color: var(--dim); }
.note { font-size: 24px; color: var(--dim); }
.mono { font-family: var(--font-mono); }
code { font-family: var(--font-mono); font-size: .86em; background: var(--panel-2); border: 1px solid var(--line); padding: 0 .3em; border-radius: 6px; color: var(--fg); white-space: nowrap; }
b { font-weight: 700; color: var(--fg); }

/* body layouts */
.body { min-height: 0; display: grid; gap: 28px; }
.body > * { min-height: 0; min-width: 0; }
.split { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.split-even { grid-template-columns: 1fr 1fr; }
.rows-fa { grid-template-rows: minmax(0, 1fr) auto; }
.rows-af { grid-template-rows: auto minmax(0, 1fr); }
.rows-afa { grid-template-rows: auto minmax(0, 1fr) auto; }
.col { display: flex; flex-direction: column; gap: 22px; min-height: 0; min-width: 0; }
.col.fill > .grow { flex: 1; min-height: 0; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }

svg.dg { width: 100%; height: 100%; display: block; overflow: visible; }
.card-svg { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px; min-height: 0; }

/* components */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.panel p { font-size: 25px; color: var(--dim); }
.panel.kind { border-left: 10px solid var(--k); }
.k-req { --k: var(--c-req); } .k-route { --k: var(--c-route); } .k-life { --k: var(--c-life); } .k-state { --k: var(--c-state); }
.pill { display: inline-flex; align-items: center; font: 600 19px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 4px 14px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
.pill.on { color: var(--ok); } .pill.opt { color: var(--c-req); } .pill.prev { color: var(--recover); } .pill.dev { color: var(--fail); } .pill.ghost { color: var(--dim); }
.chip { font: 600 22px var(--font-body); padding: 8px 16px; border-radius: 10px; border: 2px solid var(--k); color: var(--fg); background: var(--panel); display: flex; align-items: center; gap: 12px; }
.chip::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--k); flex: none; }
.codeblock { font-family: var(--font-mono); font-size: 23px; line-height: 1.55; background: var(--sink); border: 1px solid var(--line); border-radius: 14px; padding: 18px 24px; white-space: pre; color: var(--fg); overflow: hidden; }
.codeblock .c { color: var(--faint); } .codeblock .k { color: var(--c-route); } .codeblock .s { color: var(--c-state); } .codeblock .n { color: var(--c-life); }
table.t { width: 100%; border-collapse: collapse; font-size: 28px; }
table.t th { text-align: left; font: 600 20px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim); padding: 14px 20px; border-bottom: 2px solid var(--line); }
table.t td { padding: 20px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td code { font-size: 24px; }

/* demo controls */
.btn { font: 600 24px var(--font-body); color: var(--fg); background: var(--panel-2); border: 2px solid var(--line); border-radius: 10px; padding: 10px 20px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--dim); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--c-req); outline-offset: 2px; }
.btn.danger { border-color: var(--fail); color: var(--fail); background: var(--panel); }
.btn.go { border-color: var(--ok); color: var(--ok); background: var(--panel); }
.btn.pri { border-color: var(--cat); color: var(--cat); background: var(--panel); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.ctl { display: inline-flex; align-items: center; gap: 12px; font-size: 24px; color: var(--dim); }
.ctl input[type=range] { width: 200px; accent-color: var(--cat); }
.ctl input[type=checkbox] { accent-color: var(--cat); width: 26px; height: 26px; }
.ctl select { background: var(--panel-2); color: var(--fg); border: 2px solid var(--line); border-radius: 8px; padding: 4px 8px; font: 600 24px var(--font-body); }
.ctl output { font: 600 24px var(--font-mono); color: var(--fg); min-width: 3.2ch; }
.log { font-family: var(--font-mono); font-size: 21px; line-height: 1.5; background: var(--sink); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; overflow-y: auto; color: var(--dim); min-height: 120px; }
.log .e-ok { color: var(--ok); } .log .e-fail { color: var(--fail); } .log .e-rec { color: var(--recover); } .log .e-info { color: var(--c-req); } .log .e-route { color: var(--c-route); } .log .e-state { color: var(--c-state); }
.log .ts { color: var(--faint); }
.counters { display: grid; grid-template-columns: repeat(var(--cn, 2), minmax(0, 1fr)); gap: 14px; }
.counter { background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 12px 18px; min-width: 0; }
.counter .v { font: 700 44px var(--font-mono); font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--fg); }
.counter .l { font-size: 21px; color: var(--dim); line-height: 1.25; }
.counter.bad .v { color: var(--fail); } .counter.good .v { color: var(--ok); } .counter.warn .v { color: var(--recover); }
.stream { font-family: var(--font-mono); font-size: 25px; line-height: 1.55; background: var(--sink); border: 1px solid var(--line); border-radius: 12px; padding: 14px 20px; overflow: hidden; color: var(--dim); }
.stream .tA { color: var(--c-req); } .stream .tB { color: var(--c-route); } .stream .tC { color: var(--c-state); }
.stream .cut, .stream .err { color: var(--fail); font-weight: 700; } .stream .mig { color: var(--recover); font-weight: 700; }
.bar { height: 28px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); transition: width .2s, background .25s; }

/* ===== SVG diagram vocabulary ===== */
svg text { font-family: var(--font-body); fill: var(--fg); }
.nd .bx { fill: var(--panel); stroke: var(--line); stroke-width: 2.5; transition: fill .3s, stroke .3s; }
.nd .t { font: 700 26px var(--font-display); fill: var(--fg); }
.nd .s { font: 500 20px var(--font-mono); fill: var(--dim); }
.nd.k-req .bx { stroke: var(--c-req); } .nd.k-route .bx { stroke: var(--c-route); } .nd.k-life .bx { stroke: var(--c-life); } .nd.k-state .bx { stroke: var(--c-state); }
.nd.k-plain .bx { stroke: var(--faint); }
.nd .stripe { fill: var(--k, var(--faint)); }
.nd.st-ok .bx { stroke: var(--ok); stroke-width: 3.5; }
.nd.st-fail .bx { stroke: var(--fail); stroke-width: 4; fill: color-mix(in srgb, var(--fail) 12%, var(--panel)); }
.nd.st-fail .s { fill: var(--fail); }
.nd.st-rec .bx { stroke: var(--recover); stroke-width: 4; fill: color-mix(in srgb, var(--recover) 12%, var(--panel)); }
.nd.st-rec .s { fill: var(--recover); }
.nd.st-idle { opacity: .5; }
.nd.st-hot .bx { stroke-width: 5; }
.nd.click { cursor: pointer; }
.frame { fill: none; stroke: var(--faint); stroke-width: 2; stroke-dasharray: 8 8; }
.frame-fill { fill: color-mix(in srgb, var(--k, var(--faint)) 5%, transparent); stroke: var(--k, var(--faint)); stroke-width: 2; stroke-dasharray: 8 8; }
.flabel { font: 700 20px var(--font-mono); fill: var(--faint); text-transform: uppercase; letter-spacing: .1em; }
.ln { fill: none; stroke: var(--faint); stroke-width: 3; opacity: .75; }
.ln.thin { stroke-width: 2; }
.ln.dash { stroke-dasharray: 10 8; }
.ln.dot { stroke-dasharray: 3 7; stroke-linecap: round; }
.ln.k-req { stroke: var(--c-req); } .ln.k-route { stroke: var(--c-route); } .ln.k-life { stroke: var(--c-life); } .ln.k-state { stroke: var(--c-state); } .ln.k-ok { stroke: var(--ok); } .ln.k-fail { stroke: var(--fail); } .ln.k-rec { stroke: var(--recover); }
.ln.ghost { stroke: transparent; }
.ln.flow { stroke-dasharray: 12 10; animation: dashmove 1s linear infinite; }
@keyframes dashmove { to { stroke-dashoffset: -22; } }
.ah { fill: var(--faint); }
.pk { stroke: var(--panel); stroke-width: 2.5; }
.pk-req { fill: var(--c-req); } .pk-tok { fill: var(--ok); } .pk-fail { fill: var(--fail); } .pk-rec { fill: var(--recover); } .pk-state { fill: var(--c-state); } .pk-route { fill: var(--c-route); } .pk-life { fill: var(--c-life); }
.lbl { font: 600 21px var(--font-body); fill: var(--dim); }
.lbl-b { font: 700 24px var(--font-body); fill: var(--fg); }
.lbl-m { font: 600 20px var(--font-mono); fill: var(--dim); }
.big-l { font: 800 44px var(--font-display); }
.badge rect { stroke-width: 2.5; }
.badge text { font: 700 20px var(--font-mono); }
.badge.b-fail rect { fill: var(--panel); stroke: var(--fail); } .badge.b-fail text { fill: var(--fail); }
.badge.b-rec rect { fill: var(--panel); stroke: var(--recover); } .badge.b-rec text { fill: var(--recover); }
.badge.b-ok rect { fill: var(--panel); stroke: var(--ok); } .badge.b-ok text { fill: var(--ok); }
.badge.b-state rect { fill: var(--panel); stroke: var(--c-state); } .badge.b-state text { fill: var(--c-state); }
.badge.b-req rect { fill: var(--panel); stroke: var(--c-req); } .badge.b-req text { fill: var(--c-req); }
.badge.b-route rect { fill: var(--panel); stroke: var(--c-route); } .badge.b-route text { fill: var(--c-route); }
.mk circle { fill: var(--panel); stroke: var(--k, var(--fail)); stroke-width: 3.5; }
.mk text { font: 800 24px var(--font-display); fill: var(--k, var(--fail)); }
.mk.on circle { fill: var(--k, var(--fail)); } .mk.on text { fill: var(--on-accent); }
.region { stroke-width: 2.5; }
.r-w { fill: color-mix(in srgb, var(--c-life) 16%, var(--panel)); stroke: var(--c-life); }
.r-kv { fill: color-mix(in srgb, var(--c-state) 14%, var(--panel)); stroke: var(--c-state); }
.r-sc { fill: var(--panel-2); stroke: var(--faint); }
.gauge-bg { fill: var(--panel-2); stroke: var(--line); stroke-width: 2; }
.gauge-fill { transition: height .2s, y .2s; }
.thr-l { stroke: var(--fg); stroke-width: 4; }
.axis { stroke: var(--faint); stroke-width: 2; }
.tick { font: 600 20px var(--font-mono); fill: var(--faint); }
.cur-l { stroke: var(--fg); stroke-width: 3; }
.blk { fill: var(--panel-2); stroke: var(--line); stroke-width: 1; transition: fill .25s, opacity .25s; }
.blk.c { fill: var(--c-state); stroke: none; } .blk.p { fill: var(--recover); opacity: .55; stroke: none; } .blk.x { fill: var(--fail); opacity: .4; stroke: none; } .blk.s { fill: var(--ok); stroke: none; }
.tok-sq { transition: fill .2s; }
.tok-sq.pr { fill: var(--faint); } .tok-sq.A { fill: var(--c-req); } .tok-sq.B { fill: var(--c-route); } .tok-sq.C { fill: var(--c-state); } .tok-sq.e { fill: var(--panel-2); }
.barv { transition: width .4s; }

/* slide-specific HTML */
.hero { grid-template-rows: 1fr; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 56px; }
.hero h1 em { font-style: normal; color: var(--c-life); }
.legendrow { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
/* slide 2: failure points grouped by layer */
.chipgrid { display: grid; grid-template-columns: 3fr 2fr 2fr 1fr; gap: 16px; }
.fxg { background: var(--panel); border: 2px solid var(--line); border-top: 8px solid var(--k); border-radius: 12px; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fxg .gl { font: 700 17px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--k); padding-left: 2px; }
.fxg .gi { display: grid; grid-template-columns: repeat(var(--c), minmax(0, 1fr)); gap: 8px; }
.chipgrid .fx { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border: 2px solid transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; transition: border-color .2s, background .2s; min-width: 0; }
.chipgrid .fx .n { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--k); color: var(--k); font: 800 18px var(--font-display); display: grid; place-items: center; }
.chipgrid .fx .tx { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.chipgrid .fx .f { font: 700 19px var(--font-body); color: var(--fg); }
.chipgrid .fx .w { font-size: 16px; color: var(--dim); margin-top: 3px; }
.chipgrid .fx:hover, .chipgrid .fx.on { border-color: var(--k); background: color-mix(in srgb, var(--k) 10%, var(--panel)); }
.chipgrid .fx.on .n { background: var(--k); color: var(--on-accent); }
/* layer tracker shown in the top-right of every content slide */
.ft-track { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 10px; pointer-events: none; transition: opacity .3s; }
.ft-track[hidden] { display: none !important; }
.ft-seg { display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel); font: 600 17px var(--font-body); color: var(--faint); }
.ft-seg .dot { width: 12px; height: 12px; border-radius: 3px; background: var(--k); }
.ft-seg .nums { display: flex; gap: 4px; margin-left: 2px; }
.ft-seg .nm { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--k); color: var(--k); font: 800 14px var(--font-display); display: grid; place-items: center; }
.ft-seg.on { border-color: var(--k); background: color-mix(in srgb, var(--k) 10%, var(--panel)); color: var(--fg); }
.ft-seg .nm.on { background: var(--k); color: var(--on-accent); }
.ft-track.dim .ft-seg:not(.on) { opacity: .5; }
.phases { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.phase { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; transition: border-color .3s, box-shadow .3s, opacity .3s; opacity: .55; }
.phase.on { opacity: 1; border-color: var(--fg); box-shadow: 0 0 0 2px var(--fg); }
.phase h3 { display: flex; align-items: center; gap: 14px; }
.phase h3 .ix { font: 700 22px var(--font-mono); color: var(--faint); }
.phase .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.phase .chip { font-size: 21px; padding: 6px 12px; }
.caption { display: grid; grid-template-columns: auto 1fr auto; gap: 28px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-left: 12px solid var(--capk, var(--fg)); border-radius: 16px; padding: 20px 28px; box-shadow: var(--shadow); }
.caption .stepn { font: 800 64px var(--font-display); color: var(--capk, var(--fg)); line-height: 1; min-width: 1.4ch; }
.caption .ct { font: 800 36px var(--font-display); }
.caption .cd { font-size: 26px; color: var(--dim); }
.dots { display: flex; gap: 8px; } .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--fg); }
.tiles { display: grid; gap: 18px; }

.notes[hidden] { display: none !important; }
.notes-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.notes-k { font: 700 11px var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--faint); white-space: nowrap; }
.notes-t { font: 700 16px var(--font-display); flex: 1; min-width: 0; }
.notes-head button { border: 1px solid var(--line); background: var(--panel-2); color: var(--dim); border-radius: 7px; padding: 4px 10px; font: 600 13px var(--font-body); cursor: pointer; }
.notes-body { overflow-y: auto; padding: 12px 20px 18px; }
.notes-body h4 { font: 700 12px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--notes-k, var(--dim)); margin: 14px 0 6px; }
.notes-body h4:first-child { margin-top: 2px; }
.notes-body p { margin: 0 0 8px; color: var(--dim); }
.notes-body ul { margin: 0 0 8px 18px; color: var(--dim); }
.notes-body li { margin: 3px 0; }
.notes-body b { color: var(--fg); }
.notes-body code { font-size: 13px; white-space: normal; overflow-wrap: anywhere; }
body.fs .chrome { opacity: 0; }

/* ===== ModelExpress + Snapshot look (mx-snapshot.html), Inter titles, layered over the FT tokens ===== */
.slide[data-cat="all"] { --cat: var(--accent); }
.slide.hero {
  background:
    radial-gradient(ellipse at 15% 35%, var(--hero-a), transparent 50%),

}
h1 { font-weight: 800; letter-spacing: -.035em; }

.eyebrow { color: var(--accent-ink); letter-spacing: .16em; }
.lede, .note { color: var(--dim); }
code { background: var(--code-bg); border-color: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--code-ink); }
/* cards: white surface, 1px line border, rounded, soft shadow, thin accent edge */
.card-svg, .fxg, .phase, .caption, .tile, .counter, .ft-seg, .chip, .panel { border-width: 1px; border-color: var(--line); }
.card-svg, .fxg, .phase, .caption, .tile, .counter { box-shadow: var(--shadow); }
.panel.kind { border-left: 5px solid var(--k); }
.fxg { border-top: 4px solid var(--k); border-radius: 14px; }
.caption { border-left: 5px solid var(--capk, var(--accent)); border-radius: 16px; }
.tile, .counter { border-radius: 14px; }
.tile .v, .counter .v, .caption .stepn { font-variant-numeric: tabular-nums; }
.chip { border-color: color-mix(in srgb, var(--k) 55%, transparent); }
.ft-seg { box-shadow: none; }
.ft-seg.on { border-color: var(--k); }
.phase.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
.dots i.on { background: var(--accent); }
.chipgrid .fx { border-width: 1px; }
.pill { border-width: 1px; border-color: color-mix(in srgb, currentColor 45%, transparent); background: color-mix(in srgb, currentColor 8%, transparent); font-weight: 500; }
.codeblock, .log, .stream { border-radius: 14px; }
table.t th { color: var(--accent-ink); letter-spacing: .12em; }
table.t td { font-variant-numeric: tabular-nums; }
/* buttons */
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.pri:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn.go { background: var(--panel); border-color: color-mix(in srgb, var(--ok) 50%, transparent); color: var(--ok); }
.btn.danger { background: var(--panel); border-color: color-mix(in srgb, var(--fail) 45%, transparent); color: var(--fail); }
.btn.danger:hover { background: color-mix(in srgb, var(--fail) 8%, var(--panel)); }
.ctl select { background: var(--panel); border: 1px solid var(--line); }
.ctl input[type=range], .ctl input[type=checkbox] { accent-color: var(--accent); }
/* SVG nodes */
.nd .bx { stroke-width: 2; }

.region { stroke-width: 2; }
/* chrome: frosted round buttons, mono page counter, gradient progress */
.chrome.br { right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.chrome button { height: 40px; border-radius: 10px; border: 1px solid var(--nav-line); background: var(--nav-bg); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: var(--dim); font-weight: 500; }
.chrome button:hover, .chrome button:focus-visible { color: var(--fg); border-color: var(--accent); }
.chrome.bl { left: max(24px, env(safe-area-inset-left, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); font: 500 14px var(--font-mono); color: var(--dim); opacity: .8; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.progress { height: 3px; background: linear-gradient(90deg, var(--accent-hi), var(--cyan-hi)) !important; }
/* notes panel */
.notes { border-top: 4px solid var(--notes-k, var(--accent)); border-radius: 16px; box-shadow: var(--shadow); }
.notes-head button { background: var(--panel); border-radius: 8px; }
.notes-head button:hover { border-color: var(--accent); color: var(--fg); }
.notes-body h4 { color: var(--accent-ink); }
</style>

<div class="viewport"><div class="stage" id="deck"><div class="ft-track" id="ftTrack" hidden></div></div></div>
<div class="chrome bl"><span id="pageNum"></span><span class="sec" id="secName"></span></div>
<div class="chrome br">
  <button type="button" id="notesBtn" aria-label="Toggle developer notes">Notes</button>
  <button type="button" id="themeBtn" aria-label="Toggle dark mode">Dark</button>
  <button type="button" id="fsBtn" aria-label="Full screen">Full screen</button>
  <button type="button" onclick="go(-1)" aria-label="Previous slide">&#9664;</button>
  <button type="button" onclick="go(1)" aria-label="Next slide">&#9654;</button>
</div>
<div class="progress" id="progress"></div>
<aside class="notes" id="notes" hidden aria-label="Developer notes">
  <div class="notes-head"><span class="notes-k">Developer notes</span><span class="notes-t" id="notesTitle"></span><button type="button" id="notesClose" aria-label="Close notes">Close</button></div>
  <div class="notes-body" id="notesBody"></div>
</aside>
<script>
const slides = [
/* 1 Title */
`<section class="slide hero" data-cat="all" data-sec="Intro">
  <div class="col" style="gap:34px">
    <div class="eyebrow">NVIDIA Dynamo · Fault tolerance</div>
    <h1>Keep serving when <em>something breaks</em></h1>
    <p class="lede">How requests reach workers, what fails along the way, and how each Dynamo mechanism keeps tokens flowing.</p>
    <div class="legendrow"><span class="pill on">On by default</span><span class="pill opt">Opt-in</span><span class="pill prev">Preview</span><span class="pill dev">In development</span></div>
  </div>
  <svg class="dg" id="dg-hero"></svg>
</section>`,

/* 2 Request path architecture */
`<section data-ft="all" class="slide" data-cat="all" data-sec="Architecture">
  <div class="head"><div class="eyebrow">How a request reaches the workers</div><h2>Every hop in the request path can fail</h2></div>
  <div class="body" style="grid-template-rows: minmax(0, 1fr) auto auto; gap:20px">
    <svg class="dg" id="dg-arch"></svg>
    <div class="row"><button type="button" class="btn" id="arch-prev">◀ Back</button><button type="button" class="btn pri" id="arch-next">Next failure point ▶</button><span class="note" id="arch-cap" style="margin-left:12px"></span></div>
    <div class="chipgrid" id="arch-chips"></div>
  </div>
</section>`,

/* 3 Detect reroute recover */
`<section data-ft="all" class="slide" data-cat="all" data-sec="Architecture">
  <div class="head"><div class="eyebrow">Architecture view</div><h2>Detect → reroute → recover</h2></div>
  <div class="body" style="grid-template-rows: minmax(0, 1fr) auto auto; gap:20px">
    <svg class="dg" id="dg-drr"></svg>
    <div class="row"><button type="button" class="btn" id="drr-prev">◀ Back</button><button type="button" class="btn pri" id="drr-next">Inject fault ▶</button></div>
    <div class="phases">
      <div class="phase" id="ph-0"><h3><span class="ix">01</span>Detect</h3><div class="chips">
        <span class="chip k-req">Stream error</span><span class="chip k-route">Lease / EndpointSlice</span><span class="chip k-route">Canary probe</span><span class="chip k-route">KV event gap</span></div></div>
      <div class="phase" id="ph-1"><h3><span class="ix">02</span>Reroute</h3><div class="chips">
        <span class="chip k-route">Local inhibition</span><span class="chip k-req">Migration</span><span class="chip k-req">Rejection (529)</span><span class="chip k-req">Cancellation</span></div></div>
      <div class="phase" id="ph-2"><h3><span class="ix">03</span>Recover</h3><div class="chips">
        <span class="chip k-life">Shadow + GMS</span><span class="chip k-life">Snapshot restore</span><span class="chip k-route">Router rebuild</span><span class="chip k-state">KVCR-Guard</span></div></div>
    </div>
  </div>
</section>`,

/* 4 Outcomes */
`<section data-ft="req" class="slide" data-cat="req" data-sec="Request path">
  <div class="head-row"><div class="head"><div class="eyebrow">Request outcomes</div><h2>Three ways a request can end besides success</h2></div>
    <div class="row"><button type="button" class="btn" id="out-prev">◀ Back</button><button type="button" class="btn pri" id="out-next">Show: Reject ▶</button></div></div>
  <div class="body"><svg class="dg" id="dg-out"></svg></div>
</section>`,

/* 5 Migration */
`<section data-ft="req:1" class="slide" data-cat="req" data-sec="Request path">
  <div class="head-row"><div class="head"><div class="eyebrow">Request Migration <span class="pill opt">opt-in</span></div><h2>Kill the worker. The stream continues.</h2></div></div>
  <div class="body split">
    <div class="col fill">
      <svg class="dg grow card-svg" id="dg-mig"></svg>
      <div class="stream" id="mig-stream" style="height:150px">Press "Send request", then kill the worker while it streams.</div>
    </div>
    <div class="col">
      <div class="row"><button type="button" class="btn go" id="mig-start">Send request</button><button type="button" class="btn danger" id="mig-kill">Kill serving worker</button></div>
      <div class="row"><label class="ctl">migration limit <select id="mig-limit"><option>0</option><option>1</option><option>2</option><option selected>3</option></select></label><label class="ctl"><input type="checkbox" id="mig-guided"> JSON schema</label></div>
      <div class="counters">
        <div class="counter"><div class="v" id="mig-c-tok">0</div><div class="l">tokens in Migrator state</div></div>
        <div class="counter warn"><div class="v" id="mig-c-mig">0</div><div class="l">migrations</div></div>
        <div class="counter good"><div class="v" id="mig-c-ok">0</div><div class="l">migrated &amp; finished</div></div>
        <div class="counter bad"><div class="v" id="mig-c-err">0</div><div class="l">client errors</div></div>
      </div>
      <div class="codeblock"><span class="c"># Frontend (default 0 = off)</span>
<span class="k">DYN_MIGRATION_LIMIT</span>=<span class="n">3</span>
<span class="k">DYN_MIGRATION_MAX_SEQ_LEN</span>=<span class="n">32000</span></div>
      <div class="panel kind k-req"><p><b>Not migrated:</b> JSON-schema (guided decoding) and <code>n&gt;1</code> requests return an error instead.</p></div>
    </div>
  </div>
</section>`,

/* 6 Cancellation */
`<section data-ft="req:2" class="slide" data-cat="req" data-sec="Request path">
  <div class="head-row"><div class="head"><div class="eyebrow">Request Cancellation <span class="pill on">built-in</span></div><h2>Cancel once, stop everywhere</h2></div>
    <div class="row"><button type="button" class="btn go" id="can-start">Start request</button><button type="button" class="btn danger" id="can-client">Client disconnects</button><button type="button" class="btn danger" id="can-fe">Frontend crashes</button></div></div>
  <div class="body rows-fa">
    <svg class="dg card-svg" id="dg-can"></svg>
    <div class="body" style="grid-template-columns: 1.1fr 1fr 1fr; gap:24px; height:250px">
      <div class="codeblock"><span class="k">async def</span> generate(self, req, context):
    <span class="k">if</span> context.is_stopped(): <span class="k">return</span>
    <span class="c"># pass context → child is linked</span>
    <span class="k">await</span> self.client.generate(
        req, context=context)</div>
      <div class="col"><label class="ctl"><input type="checkbox" id="can-link" checked> prefill linked as child context</label>
        <div class="counters"><div class="counter good"><div class="v" id="can-saved">0</div><div class="l">GPU steps avoided</div></div><div class="counter bad"><div class="v" id="can-waste">0</div><div class="l">GPU steps wasted</div></div></div></div>
      <div class="log" id="can-log"></div>
    </div>
  </div>
</section>`,

/* 7 Rejection */
`<section data-ft="req:3" class="slide" data-cat="req" data-sec="Request path">
  <div class="head"><div class="eyebrow">Request Rejection <span class="pill opt">opt-in</span></div><h2>Turn away the excess so admitted requests stay fast</h2></div>
  <div class="body split">
    <div class="col fill">
      <div class="row"><label class="ctl">arrivals/s <input type="range" id="rej-rate" min="1" max="14" value="6"><output id="rej-rate-o">6</output></label>
        <label class="ctl">threshold <input type="range" id="rej-thr" min="50" max="100" value="85"><output id="rej-thr-o">0.85</output></label>
        <label class="ctl"><input type="checkbox" id="rej-on" checked> rejection on</label></div>
      <svg class="dg grow card-svg" id="dg-rej"></svg>
    </div>
    <div class="col">
      <div class="counters">
        <div class="counter good"><div class="v" id="rej-acc">0</div><div class="l">accepted</div></div>
        <div class="counter warn"><div class="v" id="rej-529">0</div><div class="l">HTTP 529</div></div>
        <div class="counter bad"><div class="v" id="rej-slow">0</div><div class="l">admitted when full</div></div>
        <div class="counter"><div class="v" id="rej-itl">1.0×</div><div class="l">token latency</div></div>
      </div>
      <div class="panel kind k-req"><p><b>529</b> = busy, retry with backoff.<br><b>503</b> = no service available.</p></div>
      <div class="codeblock">--router-mode <span class="s">kv</span>
--active-decode-blocks-threshold <span class="n">0.85</span>
--router-track-output-blocks</div>
      <p class="note">Slide arrivals to 12, then toggle rejection off.</p>
    </div>
  </div>
</section>`,

/* 8 Detection: inhibition + discovery + canaries */
`<section data-ft="route:4" class="slide" data-cat="route" data-sec="Routing">
  <div class="head"><div class="eyebrow">Inhibition · discovery · canaries <span class="pill on">inhibition + discovery on</span><span class="pill opt">canaries opt-in</span></div><h2>Stop sending traffic to a dead or hung worker</h2></div>
  <div class="body" style="grid-template-rows: minmax(0, 1fr) auto auto; gap:20px">
    <svg class="dg" id="dg-det"></svg>
    <div class="row"><button type="button" class="btn" id="det-prev">◀ Back</button><button type="button" class="btn pri" id="det-next">Crash Worker 2 ▶</button><span class="note" id="det-cap" style="margin-left:12px"></span></div>
    <div class="phases">
      <div class="phase" id="dph-0"><h3><span class="ix">1</span>Local inhibition</h3><p class="note">First failed request → the Frontend skips that worker for 5 s. Instant, no coordination.</p><code style="font-size:19px;align-self:flex-start">DYN_RUNTIME_INHIBITED_DURATION_SECS=5</code></div>
      <div class="phase" id="dph-1"><h3><span class="ix">2</span>Discovery</h3><p class="note">Authoritative removal: Kubernetes EndpointSlice update, or the etcd lease expires when keep-alives stop.</p><code style="font-size:19px;align-self:flex-start">DYN_DISCOVERY_BACKEND=kubernetes | etcd</code></div>
      <div class="phase" id="dph-2"><h3><span class="ix">3</span>Canary health check</h3><p class="note">Idle 10 s → send a tiny real inference request, 3 s timeout. Catches an engine that hangs while its process looks alive.</p><code style="font-size:19px;align-self:flex-start">DYN_HEALTH_CHECK_ENABLED=true</code></div>
    </div>
  </div>
</section>`,

/* 9 Router HA */
`<section data-ft="route:5" class="slide" data-cat="route" data-sec="Routing">
  <div class="head"><div class="eyebrow">Router fault tolerance</div><h2>Routers are disposable. Workers hold the truth.</h2></div>
  <div class="body split">
    <svg class="dg card-svg" id="dg-rt"></svg>
    <div class="col">
      <div class="row"><button type="button" class="btn danger" id="rt-k0">Kill R1</button><button type="button" class="btn danger" id="rt-k1">Kill R2</button><button type="button" class="btn danger" id="rt-k2">Kill R3</button></div>
      <div class="row"><button type="button" class="btn danger" id="rt-w1">Partition W2</button><button type="button" class="btn danger" id="rt-drop">Drop an event</button></div>
      <label class="ctl"><input type="checkbox" id="rt-sync"> <code>--router-replica-sync</code></label>
      <div class="counters"><div class="counter good"><div class="v" id="rt-served">0</div><div class="l">requests routed</div></div><div class="counter bad"><div class="v" id="rt-failed">0</div><div class="l">no router (503)</div></div></div>
      <div class="log" id="rt-log" style="flex:1"></div>
    </div>
  </div>
</section>`,

/* 10 Graceful shutdown */
`<section data-ft="life:6" class="slide" data-cat="life" data-sec="Lifecycle">
  <div class="head-row"><div class="head"><div class="eyebrow">Graceful Shutdown <span class="pill on">on by default</span></div><h2>Unregister, drain, then hand off</h2></div>
    <div class="row"><label class="ctl">pod grace <select id="gs-tgp"><option value="60" selected>60 s</option><option value="180">180 s</option></select></label><label class="ctl"><input type="checkbox" id="gs-mig" checked> migration</label><button type="button" class="btn danger" id="gs-go">kubectl delete pod</button><button type="button" class="btn" id="gs-reset">Reset</button></div></div>
  <div class="body rows-af">
    <svg class="dg card-svg" id="dg-gs" style="height:230px"></svg>
    <div class="body split">
      <svg class="dg card-svg" id="dg-gsr"></svg>
      <div class="col">
        <div class="counters" style="--cn:3"><div class="counter good"><div class="v" id="gs-done">0</div><div class="l">drained</div></div><div class="counter warn"><div class="v" id="gs-moved">0</div><div class="l">migrated</div></div><div class="counter bad"><div class="v" id="gs-err">0</div><div class="l">errors</div></div></div>
        <div class="log" id="gs-log" style="flex:1"></div>
      </div>
    </div>
  </div>
</section>`,

/* 11 GMS */
`<section data-ft="life:7" class="slide" data-cat="life" data-sec="Lifecycle">
  <div class="head"><div class="eyebrow">GPU Memory Service <span class="pill prev">preview</span></div><h2>Weights outlive the engine process</h2></div>
  <div class="body split">
    <svg class="dg" id="dg-gms"></svg>
    <div class="col">
      <div class="tiles">
        <div class="tile" style="border-left:10px solid var(--c-life)"><span class="v" style="color:var(--c-life)">Shared</span><span class="l">Weights: one copy in HBM, owned by GMS, mapped read-only by every engine. Survives crashes.</span></div>
        <div class="tile" style="border-left:10px solid var(--c-state)"><span class="v" style="color:var(--c-state)">Private</span><span class="l">KV cache, scratch, request state: belong to the active engine. Rebuilt on failover.</span></div>
        <div class="tile" style="border-left:10px solid var(--c-route)"><span class="v" style="color:var(--c-route)">Parked</span><span class="l">Shadow engine: graphs captured, NCCL ready, weights mapped. Waits on a lock.</span></div>
      </div>
      <p class="note">Built on the CUDA VMM API. vLLM, SGLang and TensorRT-LLM plug in through a custom PyTorch allocator.</p>
    </div>
  </div>
</section>`,

/* 12 Shadow failover */
`<section data-ft="life:7" class="slide" data-cat="life" data-sec="Lifecycle">
  <div class="head-row"><div class="head"><div class="eyebrow">Shadow Engine failover <span class="pill prev">preview</span></div><h2>Kill the active engine. The shadow takes the lock.</h2></div>
    <div class="row"><label class="ctl"><select id="sh-mode"><option value="shadow" selected>GMS + shadow</option><option value="cold">Cold restart</option></select></label><button type="button" class="btn danger" id="sh-kill">Kill active engine</button><button type="button" class="btn" id="sh-reset">Reset</button></div></div>
  <div class="body split">
    <svg class="dg card-svg" id="dg-sh"></svg>
    <div class="col fill">
      <svg class="dg card-svg grow" id="dg-shres"></svg>
      <div class="log" id="sh-log" style="height:200px"></div>
    </div>
  </div>
</section>`,

/* 13 Snapshot */
`<section data-ft="life:7" class="slide" data-cat="life" data-sec="Lifecycle">
  <div class="head"><div class="eyebrow">Dynamo Snapshot <span class="pill prev">experimental · single-GPU vLLM / SGLang</span></div><h2>Checkpoint a warm worker once, restore it in seconds</h2></div>
  <div class="body rows-af">
    <svg class="dg card-svg" id="dg-snap" style="height:300px"></svg>
    <div class="body split">

<script>
/* Developer notes, one entry per slide (same order as slides[]). Kept in sync with dynamo-fault-tolerance_NOTES.md. */
const NOTES = [
/* 1 */ {
  t: 'Overview', k: 'var(--fg)', h: `
<h4>What this deck covers</h4>
<p>Dynamo's docs split fault tolerance into <b>request fault tolerance</b> (migration, rejection, cancellation) and <b>worker fault tolerance</b> (graceful shutdown, shadow engine failover, health checks, discovery). This deck adds two more lenses that recover on their own clocks: <b>routing state</b> (the KV router's prefix index) and <b>KV cache state</b> (KVCR-Guard, GMS-backed KV).</p>
<h4>Maturity tags</h4>
<ul><li><b>On by default</b>: graceful shutdown, cancellation, discovery, router prefix recovery.</li>
<li><b>Opt-in</b>: migration (<code>--migration-limit</code> defaults to 0), rejection thresholds, canary health checks, router replica sync.</li>
<li><b>Preview / experimental</b>: GMS + shadow engine (vLLM primary, K8s ≥1.34 with DRA), Dynamo Snapshot (single-GPU vLLM/SGLang).</li>
<li><b>In development</b>: KVCR / KVCR-Guard, GMS-managed KV cache.</li></ul>
<h4>Mental model</h4>
<p>Protect three things: the <b>request</b> (finish it or fail it cleanly), <b>serving capacity</b> (get workers back fast), and <b>expensive state</b> (weights, KV cache, routing index).</p>` },

/* 2 */ {
  t: 'How a request reaches the workers', k: 'var(--fg)', h: `
<h4>Request path</h4>
<ul><li><b>Frontend</b> (OpenAI-compatible, port 8000): applies the chat template, tokenizes, validates.</li>
<li><b>KV router / PrefillRouter</b>: scores workers by KV-cache overlap plus load and picks a prefill worker.</li>
<li><b>Prefill</b> computes the prompt's KV cache and returns <code>disaggregated_params</code> (transfer metadata).</li>
<li>The router injects that metadata into the <b>decode</b> request; decode pulls KV GPU-to-GPU over <b>NIXL</b> (NVLink, InfiniBand/UCX or PCIe).</li>
<li>Decode streams tokens back; the Frontend detokenizes and sends SSE to the client.</li></ul>
<h4>Three planes</h4>
<ul><li><b>Discovery</b>: on Kubernetes, <code>DynamoWorkerMetadata</code> + EndpointSlices; on bare metal, etcd with leases that expire when keep-alives stop.</li>
<li><b>Request plane</b>: TCP by default (<code>DYN_REQUEST_PLANE</code>), NATS optional.</li>
<li><b>Event plane</b>: ZMQ by default (<code>DYN_EVENT_PLANE</code>), NATS optional. Carries KV <code>Stored</code>/<code>Removed</code> events and load metrics to routers.</li></ul>
<h4>Reading the numbered points</h4>
<p>Each number is a place a request can break, paired with the mechanism that owns it. The rest of the deck walks these one by one.</p>` },

/* 3 */ {
  t: 'Detect → reroute → recover', k: 'var(--fg)', h: `
<h4>Detect: four signals, four speeds</h4>
<ul><li><b>Request-path error</b>: a stream to the worker fails. Immediate, seen by whoever sent the request.</li>
<li><b>Discovery</b>: the worker's lease expires or its EndpointSlice is removed. Authoritative, but only as fast as the lease / K8s update.</li>
<li><b>Canary health checks</b> (<code>DYN_HEALTH_CHECK_ENABLED=true</code>): after <code>DYN_CANARY_WAIT_TIME</code> (10 s) with no successful traffic, send a minimal real inference request; timeout <code>DYN_HEALTH_CHECK_REQUEST_TIMEOUT</code> (3 s). Catches a hung engine whose process still answers <code>/live</code>.</li>
<li><b>KV event gap</b>: a router sees non-consecutive event IDs from a worker and starts recovery.</li></ul>
<h4>Reroute</h4>
<ul><li><b>Local inhibition</b>: after a request-path failure, each client runtime skips that worker for <code>DYN_RUNTIME_INHIBITED_DURATION_SECS</code> (default 5 s) while discovery catches up. Discovery can restore or remove it earlier.</li>
<li>Migration moves in-flight streams; rejection sheds overflow; cancellation frees work nobody is waiting for.</li></ul>
<h4>Recover</h4>
<p>Shadow engine + GMS (seconds), Snapshot restore (warm start), router prefix rebuild from worker indexers, KVCR-Guard hot start.</p>
<h4>Health endpoints</h4>
<p>Frontend <code>/health</code> returns 503 <code>not_ready</code> as soon as draining starts; <code>/live</code> stays 200 until stopping. Workers expose both only when <code>DYN_SYSTEM_PORT</code> is set.</p>` },

/* 4 */ {
  t: 'Request outcomes', k: 'var(--c-req)', h: `
<h4>Every request ends in one terminal state</h4>
<p>success · reject · migrate (then success or fail) · cancel · fail. Designing clients around these states is what makes the server-side features useful.</p>
<h4>Reject</h4>
<p>Overload returns <b>HTTP 529</b> (retry with exponential backoff + jitter). <b>503</b> means no service path is available and should not be retried as if it were overload. Legacy clients that only understand 503 can set <code>DYN_HTTP_OVERLOAD_STATUS_CODE=503</code>.</p>
<h4>Migrate</h4>
<p>Invisible to the client when it works. Fails to the client when the limit is exhausted, the sequence exceeds <code>--migration-max-seq-len</code>, or the request uses guided decoding or <code>n&gt;1</code>.</p>
<h4>Cancel</h4>
<p>Triggered by the client (closed SSE stream / connection) or a Frontend crash (worker sees TCP drop). The goal is freeing GPU time, not notifying anyone.</p>` },

/* 5 */ {
  t: 'Request Migration', k: 'var(--c-req)', h: `
<h4>Where it lives</h4>
<p>A <b>Migrator</b> operator in the Frontend pipeline, between the Backend operator and the service backend. Configured once on the Frontend; applies to every model it serves.</p>
<h4>How it works</h4>
<ul><li>Every response is intercepted; generated tokens are appended to the request's token sequence and the remaining <code>max_tokens</code> budget is reduced. Stop conditions and sampling params are carried along.</li>
<li><b>new_request</b> migration: the chosen worker is unreachable at stream setup → retry the original request elsewhere.</li>
<li><b>ongoing_request</b> migration: a migratable stream error mid-generation → open a new stream with prompt + generated tokens. The new worker prefills that context and continues; no tokens lost or duplicated.</li></ul>
<h4>Config</h4>
<ul><li><code>DYN_MIGRATION_LIMIT</code> / <code>--migration-limit</code> (default 0 = off; start with 3).</li>
<li><code>DYN_MIGRATION_MAX_SEQ_LEN</code>: once prompt+generated <i>strictly exceeds</i> it, tracking stops and the request is no longer migratable.</li></ul>
<h4>Metrics</h4>
<p><code>dynamo_frontend_model_migration_total</code> (by <code>migration_type</code>), <code>..._migration_duration_seconds</code> (by <code>outcome</code>), <code>..._migration_max_seq_len_exceeded_total</code>.</p>
<h4>Limits and cost</h4>
<p>Not supported for guided decoding (the FSM restarts at the schema root → corrupted JSON) or <code>n&gt;1</code>. The new worker re-prefills the whole context unless the prefix is cached elsewhere, which is where KV-aware routing and KVCR help.</p>` },

/* 6 */ {
  t: 'Request Cancellation', k: 'var(--c-req)', h: `
<h4>AsyncEngineContext</h4>
<p>Every request stream carries a context. <code>stop_generating()</code> (alias <code>stop()</code>) is the graceful, idempotent stop; <code>kill()</code> also asks to skip draining. Check with <code>is_stopped()</code> / <code>is_killed()</code>, or await <code>stopped()</code> / <code>killed()</code>.</p>
<h4>Propagation</h4>
<p><code>link_child(ctx)</code> makes a parent forward stop/kill to children in link order. In disaggregated serving: Frontend root → decode request → remote prefill. In Python, passing <code>context=context</code> to an outgoing <code>client.generate()</code> links it automatically.</p>
<h4>Detection</h4>
<ul><li>Frontend: connection closed before streaming, or SSE stream closed mid-response.</li>
<li>Worker: explicit cancel control message, or the TCP connection from the Frontend drops.</li></ul>
<h4>Your responsibility as a backend author</h4>
<p>The runtime only sets state. The engine must check <code>context.is_stopped()</code> (or await <code>async_killed_or_stopped()</code>) and abort. <code>dynamo_component_cancellation_total</code> counts signals received, not actual aborts.</p>` },

/* 7 */ {
  t: 'Request Rejection', k: 'var(--c-req)', h: `
<h4>Busy detection</h4>
<ul><li><code>--active-decode-blocks-threshold</code>: fraction of KV blocks in use (needs <code>--router-mode kv</code>).</li>
<li><code>--active-prefill-tokens-threshold</code> (absolute) or <code>--active-prefill-tokens-threshold-frac</code> (fraction of <code>max_num_batched_tokens</code>).</li>
<li>OR logic per data-parallel rank; a worker is busy when all ranks are busy; a request is shed only when <b>every</b> eligible worker is busy.</li></ul>
<h4>Gotchas</h4>
<ul><li>Add <code>--router-track-output-blocks</code> for long outputs, otherwise generated tokens fill KV cache without moving the router's load signal.</li>
<li>Thresholds are live-tunable via <code>POST /busy_threshold</code>; disable the admin API with <code>DYN_DISABLE_FRONTEND_ADMIN_API</code>.</li>
<li><code>--router-queue-threshold</code> is different: it <i>defers</i> routing until capacity frees, rather than rejecting.</li></ul>
<h4>Worker-side hard cap</h4>
<p><code>--engine-request-limit N</code> plus overflow queue <code>DYN_DYNAMO_REQUEST_QUEUE_LIMIT</code> (default 16, min 2): beyond N+Q the worker rejects and the Frontend returns 529.</p>
<h4>Demo model</h4>
<p>The latency multiplier is a toy model: once KV usage exceeds 100%, preemption/queueing slows everyone. Real numbers depend on the engine.</p>` },

/* 7b */ {
  t: 'Inhibition, discovery, canaries', k: 'var(--c-route)', h: `
<h4>Three detectors, three clocks</h4>
<ul><li><b>Local inhibition</b> (on): when a routed request to a worker fails, that client runtime (e.g. the Frontend) temporarily removes the worker from its local routing set for <code>DYN_RUNTIME_INHIBITED_DURATION_SECS</code> (default 5 s; 0 disables). Read once when the first client initializes. Direct dispatch bypasses it.</li>
<li><b>Discovery</b> (on, authoritative): on Kubernetes the operator uses <code>DynamoWorkerMetadata</code> + EndpointSlices (<code>DYN_DISCOVERY_BACKEND=kubernetes</code>); on bare metal, etcd leases expire when a process stops sending keep-alives. Clients watch membership; a discovery update can restore or remove a worker before the inhibition window ends.</li>
<li><b>Canary health checks</b> (opt-in, <code>DYN_HEALTH_CHECK_ENABLED=true</code>): if an endpoint has no successful activity for <code>DYN_CANARY_WAIT_TIME</code> (10 s), send a minimal inference payload through the backend's normal path; fail after <code>DYN_HEALTH_CHECK_REQUEST_TIMEOUT</code> (3 s). Override the payload with <code>DYN_HEALTH_CHECK_PAYLOAD</code>.</li></ul>
<h4>Why you need all three</h4>
<p>Inhibition is fast but local and temporary. Discovery is authoritative but only as fast as a lease or K8s update, and it can't see a <b>hung</b> engine whose process is alive. Canaries exercise real inference, so they catch hangs; the Kubernetes liveness probe can then restart the pod (and with a shadow engine, the kernel-released lock triggers failover).</p>
<h4>Health endpoints</h4>
<p>Workers expose <code>/live</code> and <code>/health</code> only when <code>DYN_SYSTEM_PORT</code> is set; both return 503 until endpoints are ready. Frontend <code>/health</code> lists discovered instances and returns 503 while draining.</p>
<h4>Demo</h4>
<p>Timeline lengths for discovery are illustrative: lease TTLs and EndpointSlice propagation depend on your cluster.</p>` },

/* 8 */ {
  t: 'Router fault tolerance', k: 'var(--c-route)', h: `
<h4>Two kinds of router state</h4>
<ul><li><b>Prefix cache state</b> (radix tree of cached blocks per worker): drives cache-overlap scoring. Built from worker KV events; every replica consumes the same events, so no router-to-router sync is needed.</li>
<li><b>Active block state</b> (in-flight load): deliberately ephemeral. A restarted router starts at zero and converges as requests flow.</li></ul>
<h4>Worker local indexer</h4>
<p>Each worker keeps a circular event buffer plus its own radix tree. Routers query it and get <code>Events</code> (replay from an ID) or a full <code>TreeDump</code> snapshot, which replaces that worker rank in one transaction.</p>
<ul><li><b>Router restart</b>: query every worker → TreeDump → full prefix view.</li>
<li><b>Event gap</b> (ZMQ PUB/SUB is lossy): buffer live events, query that worker, apply, drain buffer.</li>
<li><b>Limit</b>: an unreachable worker can't be queried; its blocks return when it does.</li></ul>
<h4>Flags</h4>
<ul><li><code>--router-replica-sync</code>: share active-sequence events across replicas for fleet-wide load.</li>
<li><code>--serve-indexer</code> / <code>--use-remote-indexer</code>: let some routers serve overlap queries for others.</li>
<li><code>--no-router-kv-events</code>: approximate mode, predicts cache from routing decisions with <code>--router-ttl-secs</code>. Not recommended for production.</li></ul>` },

/* 9 */ {
  t: 'Graceful Shutdown', k: 'var(--c-life)', h: `
<h4>Sequence on SIGTERM</h4>
<ol style="margin:0 0 8px 18px;color:var(--dim)"><li>Endpoints unregister from discovery immediately (no new work).</li>
<li>Worker keeps serving for <code>DYN_GRACEFUL_SHUTDOWN_GRACE_PERIOD_SECS</code> (5 s) while routers notice, then endpoints are invalidated.</li>
<li>In-flight requests drain, bounded by <code>DYN_RUNTIME_GRACEFUL_SHUTDOWN_TIMEOUT_SECS</code> (900 s).</li>
<li>Unfinished requests are cancelled; the Frontend migrates them if migration is enabled.</li></ol>
<h4>The Kubernetes deadline</h4>
<p>The operator sets <code>terminationGracePeriodSeconds</code> to 60 s by default; Kubernetes sends SIGKILL after it. Use 120 s+ for long generations and keep every internal timeout below it.</p>
<h4>Frontend side</h4>
<p><code>DYN_HTTP_GRACEFUL_SHUTDOWN_TIMEOUT_SECS</code> (5 s) bounds admitted HTTP/WebSocket requests. During drain <code>/health</code> = 503 (out of the load balancer) and <code>/live</code> = 200 (no restart). New requests get 503.</p>
<h4>Custom workers</h4>
<p><code>serve_endpoint(..., graceful_shutdown=True)</code> waits for in-flight requests; backend workers default to True.</p>` },

/* 10 */ {
  t: 'GPU Memory Service', k: 'var(--c-life)', h: `
<h4>Problem</h4>
<p>GPU memory belongs to the engine's CUDA context, which belongs to the process. When the process dies the driver frees everything, including weights, so a replacement reloads from storage.</p>
<h4>Mechanism</h4>
<ul><li>GMS is a per-GPU sidecar with <b>no CUDA context of its own</b>. It allocates physical pages with the CUDA VMM API, hands out handles, and arbitrates read/write access.</li>
<li>Engines import handles and map pages at their own virtual addresses once at startup; GMS is not on the access path, so reads cost the same as engine-owned memory.</li>
<li>Physical allocations are reference-counted, so weights stay resident while any process (GMS) holds them.</li></ul>
<h4>Integration</h4>
<p>vLLM, SGLang and TensorRT-LLM plug in through a <code>torch.cuda.CUDAPluggableAllocator</code> bound to the weight pool; weights remain ordinary tensors.</p>
<h4>Scope today</h4>
<p>Preview manages <b>weights</b>. GMS-managed KV cache (so a promoted shadow could map the old engine's cache) is in active development. GMS is also how Snapshot splits weights out of the CRIU image.</p>` },

/* 11 */ {
  t: 'Shadow engine failover', k: 'var(--c-life)', h: `
<h4>Why a second engine</h4>
<p>NCCL communicators and CUDA graphs are tied to one process and virtual addresses, so they can't be handed over. The shadow runs full init (import weights from GMS, NCCL/NIXL setup, graph capture, warm-up), then parks with no KV cache.</p>
<h4>Leader election</h4>
<p>A POSIX <code>flock</code> on a shared file. When the active process exits for any reason (including SIGKILL) the kernel releases the lock; the shadow acquires it, wakes, remaps weights, materializes KV cache and re-registers. Hung-but-alive engines are handled by the liveness probe → SIGKILL → same path.</p>
<h4>Measured (GLM-5.2 NVFP4, B200, TP=8, 2 workers)</h4>
<p>7.3 s to serve again (1.7 s detect + 5.6 s promote) vs 283 s cold restart. p50 TTFT after fault 1.3 s vs 23.8 s. The paper reports &lt;7 s across 4 models, 13–29× faster than a warm restart, 4–8 GiB extra per GPU.</p>
<h4>Limits</h4>
<ul><li>Preview; vLLM primary; needs Kubernetes ≥1.34 with DRA and the NVIDIA GPU DRA driver.</li>
<li>Covers process faults, not hardware, node or multi-node failures.</li>
<li>Does not preserve in-flight requests (use migration) or KV cache (small TTFT bump after promotion).</li></ul>` },

/* 12 */ {
  t: 'Dynamo Snapshot', k: 'var(--c-life)', h: `
<h4>Idea</h4>
<p>Checkpoint a fully initialized worker once, then restore it instead of cold-starting. Useful for scale-out and for warming up shadow engines.</p>
<h4>How</h4>
<ul><li><code>cuda-checkpoint</code> dumps GPU state into host memory; <b>CRIU</b> dumps the process tree; the overlay filesystem is captured too.</li>
<li>A privileged <b>snapshot-agent</b> DaemonSet on each node runs checkpoint/restore and writes artifacts to shared storage (PVC), so restore can happen on another node.</li>
<li><b>Quiesce/resume hooks</b>: the worker checkpoints after engine init but before distributed-runtime startup (no live TCP connections), signalled via files.</li></ul>
<h4>Optimizations</h4>
<ul><li>KV cache unmapped before checkpoint (<code>cuMemUnmap</code>/<code>cuMemRelease</code>, VA kept): Qwen3-0.6B artifact ~190 GiB → ~6 GiB.</li>
<li>CRIU parallel memfd restore + Linux AIO: up to 7.9× faster (pending upstream merge).</li>
<li>GMS moves weights out of the CRIU image so weights and process state restore in parallel: gpt-oss-120b &lt;5 s with striped NVMe (proof of concept).</li></ul>
<h4>Status</h4>
<p>Experimental: single-GPU vLLM and SGLang via the non-GMS path. TensorRT-LLM and multi-GPU/multi-node are on the roadmap.</p>` },

/* 13 */ {
  t: 'KV Cache Runner + KVCR-Guard', k: 'var(--c-state)', h: `
<h4>Roles</h4>
<ul><li><b>Framework/engine</b> owns all GPU memory and scheduling.</li>
<li><b>KVCR</b> (in-process library) manages KVCR-owned DRAM, SSD and object storage, reports inventory, and moves blocks over NIXL. Calls never block the engine's hot path.</li>
<li><b>KV router</b> keeps the global <code>BlockKey</code> inventory and sends request-scoped hints (<code>submit_hint(keys, src=node, mode=copy|move)</code>). It is never on the data path.</li></ul>
<h4>KVCR-Guard</h4>
<ul><li>Optional sidecar that <b>owns</b> the DRAM pool (shared memory). The active KVCR attaches once via a socket, then uses the pool directly: no IPC on normal operations.</li>
<li>On engine/GPU failure the Guard <b>fences</b> the failed owner and activates a backup KVCR (own NIXL agent) that can serve committed blocks to peers.</li>
<li>A restarted KVCR attaches, verifies <code>KVLayoutManifest</code>, recovers committed state, resyncs inventory, and takes ownership back via a fenced handoff.</li></ul>
<h4>Not preserved</h4>
<p>Partial writes, in-flight operations, framework-owned GPU or host memory.</p>
<h4>Status</h4>
<p>Under active development (<code>ai-dynamo/kvcr</code>), not for production; public end-to-end depends on an upstream vLLM PR. Known issue: first peer transfer after Guard promotion can be refused (kvcr #51).</p>` },

/* 14 */ {
  t: 'Incident walkthrough', k: 'var(--fg)', h: `
<h4>What each step relies on</h4>
<ul><li><b>Detect</b>: stream errors on the request path (instant). Discovery and canaries confirm later.</li>
<li><b>Inhibition</b>: local 5 s skip per client runtime.</li>
<li><b>Migration</b>: only if <code>DYN_MIGRATION_LIMIT</code> &gt; 0; each migrated stream costs a re-prefill of its full context.</li>
<li><b>KVCR-Guard</b>: would turn that re-prefill into a NIXL fetch. In development.</li>
<li><b>Rejection</b>: survivors absorb ~50% more load; without thresholds they overflow KV cache and slow everyone.</li>
<li><b>Shadow promotion</b>: ~7 s, starts with an empty KV cache.</li>
<li><b>Router catch-up</b>: the promoted engine publishes fresh KV events; routers update prefix state.</li></ul>
<h4>Takeaway for developers</h4>
<p>No single feature is enough. Migration needs capacity (shadow), shadow needs migration (in-flight requests), and both pay a prefill cost that only cache preservation removes.</p>` },

/* 15 */ {
  t: 'Production checklist', k: 'var(--fg)', h: `
<h4>Why each setting</h4>
<ul><li><b>Migration = 3</b>: survives transient loss without retry storms; it's off by default.</li>
<li><b>Decode-blocks threshold 0.75–0.85</b>: start conservative, watch <code>dynamo_frontend_model_rejection_total</code> and latency, then raise.</li>
<li><b>2+ router replicas + replica sync</b>: replicas rebuild prefix state from workers; sync gives each a fleet-wide load view.</li>
<li><b>Canaries</b>: the only detector for a hung engine with a live process.</li>
<li><b>Grace period 120 s+</b>: long generations need time to drain before SIGKILL.</li>
<li><b>Shadow + GMS</b>: preview; see the vLLM <code>agg_failover.yaml</code> example.</li>
<li><b>KVCR-Guard</b>: track the repo; not GA.</li></ul>
<h4>Test it</h4>
<p>The docs' fault-tolerance testing framework covers cancellation, migration, etcd HA failover and hardware fault injection.</p>` },
];

    $('notesBody').innerHTML = n.h;
    panel.style.setProperty('--notes-k', n.k);
    $('notesBody').scrollTop = 0;
  }
  function set(o) {
    open = o; panel.hidden = !o;
    $('notesBtn').textContent = o ? 'Hide notes' : 'Notes';
  }
  window.toggleNotes = () => set(!open);
  window.onSlideChange = render;
  $('notesBtn').addEventListener('click', window.toggleNotes);
  $('notesClose').addEventListener('click', () => set(false));
  render(cur); set(false);
