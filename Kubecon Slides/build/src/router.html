<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamo Router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--outer); }

/* ===== 16:9 stage: designed at 1440×810, scaled to fit the window ===== */
.deck { position: absolute; left: 50%; top: 50%; width: 1440px; height: 810px; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: center center; overflow: hidden; background: var(--surface); }
.slide {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-start;
  padding: 40px 56px 58px; opacity: 0; pointer-events: none; background: var(--bg);
  transition: opacity 0.35s ease; overflow: hidden;
}
.slide.active { opacity: 1; pointer-events: auto; }
.slide:not(.active) * { pointer-events: none; }
.slide.active * { pointer-events: auto; }
.fit { transform-origin: top left; flex-shrink: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; } }
[data-enter] { opacity: 0; }
.slide.active [data-enter] { animation: _enter 0.45s ease forwards; animation-delay: calc(var(--i, 0) * 0.08s); }
@keyframes _enter { to { opacity: 1; } }
.nav { position: fixed; bottom: 12px; left: 14px; display: flex; gap: 6px; z-index: 100; opacity: .35; transition: opacity .2s; }
.nav:hover { opacity: 1; }
.progress { position: fixed; bottom: 0; left: 0; height: 3px; transition: width 0.4s ease; z-index: 100; }
.page-num { position: fixed; bottom: 18px; right: 22px; font-family: var(--mono); z-index: 100; }

/* ===== tokens: NVIDIA light editorial ===== */
:root {
  --outer: #dfe6e4; --bg: #eef2f1; --bg2: #f9fbfa; --surface: #fff; --surface2: #f1f4f3; --border: rgba(16,24,28,.13); --border2: rgba(16,24,28,.22); --rule: #12191c;
  --accent: #76b900; --accent-ink: #4a7a00; --accent-soft: #eef6e0;
  --cyan: #1597b3; --cyan-ink: #0f7890; --cyan-soft: #e3f3f7;
  --amber: #c27400; --amber-ink: #9a6400; --amber-soft: #fdf0dc;
  --red: #e0353b; --red-ink: #c0282e; --red-soft: #fde6e6;
  --violet: #4a74e8; --violet-ink: #2f55c4; --violet-soft: #e9effc;
  --text: #12191c; --text-dim: #56636a; --text-body: #2c373c;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow: 0 1px 2px rgba(16,24,28,.06), 0 8px 24px rgba(16,24,28,.08);
  --slidebg: radial-gradient(ellipse at 10% 0%, rgba(118,185,0,.12), transparent 45%), radial-gradient(ellipse at 95% 100%, rgba(62,199,224,.10), transparent 45%), linear-gradient(180deg, #f9fbfa, #eef2f1);
  --act: var(--accent); --act-ink: var(--accent-ink); --act-soft: var(--accent-soft);
}
html.dark {
  color-scheme: dark;
  --outer: #000; --bg: #07090a; --bg2: #0d1316; --surface: #11171a; --surface2: #172025; --border: rgba(255,255,255,.12); --border2: rgba(255,255,255,.2); --rule: #e8eef0;
  --accent: #76b900; --accent-ink: #9fd44a; --accent-soft: #1f2a10;
  --cyan: #3ec7e0; --cyan-ink: #6fd6ea; --cyan-soft: #0f2a30;
  --amber: #f5a623; --amber-ink: #ffc35c; --amber-soft: #2c2112;
  --red: #ff5a5f; --red-ink: #ff8a8e; --red-soft: #3a1517;
  --violet: #7aa2ff; --violet-ink: #9db8ff; --violet-soft: #18213a;
  --text: #e8eef0; --text-dim: #8f9ca3; --text-body: #c8d2d6;
  --shadow: 0 2px 4px rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.22);
  --slidebg: radial-gradient(ellipse at 10% 0%, rgba(118,185,0,.10), transparent 45%), radial-gradient(ellipse at 95% 100%, rgba(62,199,224,.08), transparent 45%), linear-gradient(180deg, #080b0c, #06080a);
}
html, body { font-family: var(--sans); color: var(--text); }
.slide > * { position: relative; z-index: 1; }
.act1 { --act: var(--accent); --act-ink: var(--accent-ink); --act-soft: var(--accent-soft); }
.act2 { --act: var(--amber); --act-ink: var(--amber-ink); --act-soft: var(--amber-soft); }
.act3 { --act: var(--cyan); --act-ink: var(--cyan-ink); --act-soft: var(--cyan-soft); }
.act4 { --act: var(--violet); --act-ink: var(--violet-ink); --act-soft: var(--violet-soft); }

h1 { font-family: var(--sans); font-weight: 600; letter-spacing: -0.03em; font-size: 72px; line-height: 1.02; }
h2 { font-family: var(--sans); font-weight: 600; letter-spacing: -0.02em; font-size: 38px; line-height: 1.08; margin: 4px 0 14px; }
h3 { font-weight: 600; font-size: 18px; margin-bottom: 0.4em; letter-spacing: -0.01em; }
p, li { font-size: 15.5px; line-height: 1.45; color: var(--text-body); }
.lede { color: var(--text-body); font-size: 17px; max-width: 82ch; margin-bottom: 16px; line-height: 1.4; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 10px; height: 10px; background: var(--act); flex: none; }
.eyebrow .step { color: var(--text-dim); }
.actbar { display: flex; gap: 4px; margin-bottom: 12px; }
.actbar span { height: 4px; flex: 1; background: var(--surface2); }
.actbar span.on { background: var(--act); }
.dim { color: var(--text-dim); }
.hl { color: var(--accent-ink); } .hl-c { color: var(--cyan-ink); } .hl-a { color: var(--amber-ink); } .hl-r { color: var(--red-ink); } .hl-v { color: var(--violet-ink); }
code { font-family: var(--mono); font-size: 0.86em; background: var(--surface2); padding: 0.08em 0.38em; border-radius: 3px; color: var(--text); }
ul.clean { list-style: none; display: grid; gap: 0.4em; }
ul.clean li { padding-left: 1.2em; position: relative; }
ul.clean li::before { content: ""; position: absolute; left: 0; top: 0.5em; width: 7px; height: 7px; background: var(--act); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 0; padding: 14px 16px; }
.card.c-green { border-top: 6px solid var(--accent); } .card.c-cyan { border-top: 6px solid var(--cyan); } .card.c-amber { border-top: 6px solid var(--amber); }
.card.c-red { border-top: 6px solid var(--red); } .card.c-violet { border-top: 6px solid var(--violet); }
.warn-box, .info-box, .err-box { padding: 0.6em 0.95em; font-size: 14.5px; line-height: 1.45; color: var(--text); }
.warn-box { background: var(--amber-soft); border-left: 6px solid var(--amber); }
.info-box { background: var(--cyan-soft); border-left: 6px solid var(--cyan); }
.err-box { background: var(--red-soft); border-left: 6px solid var(--red); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-content: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-content: start; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; align-content: start; }
.split { display: grid; grid-template-columns: 1.05fr 1fr; gap: 28px; align-items: start; }
.split-wide { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; align-items: start; }
.stack { display: grid; gap: 12px; align-content: start; min-width: 0; }

.code { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--surface2); border: 1px solid var(--border); border-left: 4px solid var(--act); padding: 12px 15px; white-space: pre; overflow: hidden; color: var(--text-body); }
.code .k { color: var(--violet-ink); } .code .s { color: var(--accent-ink); } .code .c { color: var(--text-dim); font-style: italic; } .code .n { color: var(--amber-ink); } .code .f { color: var(--violet-ink); } .code .t { color: var(--cyan-ink); }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--surface); border-top: 2px solid var(--rule); }
table.t th { text-align: left; font-family: var(--mono); font-size: 0.82em; font-weight: normal; color: var(--text-dim); letter-spacing: 0.05em; text-transform: uppercase; padding: 0.55em 0.8em; border-bottom: 1px solid var(--border); }
table.t td { padding: 0.5em 0.8em; border-bottom: 1px solid var(--border); vertical-align: top; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 0.2em 0.6em; letter-spacing: 0.05em; border: 1px solid; }
.tag-green { color: var(--accent-ink); background: var(--accent-soft); border-color: color-mix(in srgb,var(--accent) 50%,transparent); }
.tag-amber { color: var(--amber-ink); background: var(--amber-soft); border-color: color-mix(in srgb,var(--amber) 50%,transparent); }
.tag-cyan { color: var(--cyan-ink); background: var(--cyan-soft); border-color: color-mix(in srgb,var(--cyan) 50%,transparent); }
.tag-red { color: var(--red-ink); background: var(--red-soft); border-color: color-mix(in srgb,var(--red) 50%,transparent); }
.tag-violet { color: var(--violet-ink); background: var(--violet-soft); border-color: color-mix(in srgb,var(--violet) 50%,transparent); }

.btn { font-family: var(--sans); font-size: 13.5px; font-weight: 500; color: var(--text); background: var(--surface); border: 1px solid var(--text); border-radius: 3px; padding: 0.42em 0.9em; cursor: pointer; transition: background 0.15s; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: #d6eaff; border-color: #7fb3e6; color: #0b3a66; font-weight: 600; }
.btn.primary:hover { background: #c2dffd; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--text); border-radius: 3px; padding: 0; gap: 0; flex-wrap: wrap; overflow: hidden; }
.seg button { font-family: var(--mono); font-size: 12px; background: transparent; color: var(--text-body); border: none; border-right: 1px solid var(--border); padding: 0.45em 0.85em; cursor: pointer; transition: background 0.15s; }
.seg button:last-child { border-right: none; }
.seg button.on { background: var(--text); color: var(--surface); font-weight: 700; }
.seg button:hover:not(.on) { background: var(--surface2); }
.ctrl { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 7px 10px; margin-bottom: 4px; font-size: 13px; }
.ctrl label { color: var(--text-body); font-family: var(--sans); }
.ctrl output { font-family: var(--mono); color: var(--text); font-weight: 700; text-align: right; min-width: 3.5ch; }
.ctrl input[type=range] { grid-column: 1 / -1; width: 100%; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; background: var(--border2); outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--act); }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--act); }
input[type=checkbox] { accent-color: var(--act); width: 15px; height: 15px; vertical-align: middle; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-family: var(--sans); font-size: 13.5px; color: var(--text-body); cursor: pointer; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { font-family: var(--mono); font-size: 11px; color: var(--text-dim); letter-spacing: 0.02em; }

/* title + story */
.hero { padding-top: 90px; }
.hero h1 { font-size: 88px; margin: 16px 0 6px; }
.hero h1 .hl { display: block; font-size: 38px; letter-spacing: -0.01em; margin-top: 18px; color: var(--accent-ink); }
.hero h1::after { content: ""; display: block; width: 120px; height: 10px; background: var(--accent); margin-top: 32px; }
.hero .sub { color: var(--text-body); font-size: 21px; margin-top: 26px; max-width: 62ch; line-height: 1.45; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 30px; border-top: 2px solid var(--rule); }
.actcard { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; background: var(--surface); border: none; border-right: 1px solid var(--border); border-radius: 0; padding: 18px 22px 8px 0; margin-right: 22px; cursor: pointer; color: var(--text); font-family: inherit; transition: background 0.15s; position: relative; }
.actcard:last-child { border-right: none; margin-right: 0; }
.actcard::before { content: ""; display: block; width: 40px; height: 6px; background: var(--act); margin-bottom: 14px; }
.actcard:hover .at { color: var(--act-ink); }
.actcard .an { font-family: var(--mono); font-size: 12px; letter-spacing: 0.07em; color: var(--text-dim); }
.actcard .at { font-family: var(--sans); font-weight: 600; font-size: 26px; letter-spacing: -0.01em; margin: 6px 0 8px; transition: color 0.15s; }
.actcard .aq { font-size: 15px; color: var(--text-body); margin-bottom: 12px; line-height: 1.4; }
.actcard ol { padding-left: 1.2em; font-size: 13.5px; display: grid; gap: 4px; color: var(--text-body); }
.actcard ol li { font-size: 13.5px; }
.keys { margin-top: 70px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; gap: 22px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.kbd { display: inline-block; border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 3px; padding: 0.05em 0.45em; color: var(--text); background: var(--surface); margin-right: 4px; }

/* bars, workers, blocks */
.bars { display: grid; gap: 9px; }
.bar-row { display: grid; grid-template-columns: 8em 1fr 4.5em; gap: 10px; align-items: center; font-family: var(--mono); font-size: 12.5px; }
.bar-track { height: 20px; background: var(--surface2); overflow: hidden; display: flex; }
.bar-fill { height: 100%; transition: width 0.45s cubic-bezier(0.16,1,0.3,1); }
.bar-row .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.workers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.worker { background: var(--surface2); border: 1px solid var(--border); padding: 11px 12px; transition: all 0.3s; position: relative; min-width: 0; }
.worker.win { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.worker.win::after { content: "SELECTED"; position: absolute; top: -9px; right: 10px; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; background: var(--accent); color: #0b1a00; padding: 2px 7px; }
.worker.off { opacity: 0.55; background: var(--surface2); }
.worker.off::after { content: attr(data-off); position: absolute; top: -9px; right: 10px; font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; background: var(--red); color: #fff; padding: 2px 7px; }
.worker h3 { font-family: var(--mono); display: flex; justify-content: space-between; align-items: center; }
.worker .cost { font-family: var(--sans); font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.worker .breakdown { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
.blocks { display: flex; gap: 4px; }
.blk { width: 32px; height: 32px; display: grid; place-items: center; font-family: var(--mono); font-size: 10px; font-weight: 700; color: rgba(0,0,0,0.78); transition: all 0.3s; border: 2px solid transparent; }
.blk.miss { opacity: 0.22; } .blk.hit { border-color: var(--text); }

/* pipeline, lanes, explain */
.pipe { display: flex; align-items: stretch; width: 100%; }
.pipe-node { flex: 1; background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--nc, var(--border)); padding: 10px 6px; text-align: center; cursor: pointer; transition: all 0.25s; min-width: 0; }
.pipe-node .pn-t { font-family: var(--sans); font-weight: 600; font-size: 13.5px; }
.pipe-node .pn-s { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 3px; }
.pipe-node.lit { background: color-mix(in srgb, var(--nc, var(--accent)) 14%, var(--surface)); border-color: var(--nc, var(--accent)); }
.pipe-node.ext { border-style: dashed; border-top-style: solid; }
.pipe-arrow { width: 18px; display: grid; place-items: center; color: var(--text-dim); font-size: 13px; flex-shrink: 0; }
.explain { min-height: 4.6em; background: var(--act-soft); border-left: 6px solid var(--act); padding: 12px 18px; font-size: 16px; line-height: 1.5; color: var(--text); }
.explain .ex-t { font-family: var(--mono); font-weight: 700; color: var(--act-ink); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px; }
.lane { display: flex; align-items: center; gap: 6px; }
.node { font-family: var(--mono); font-size: 12px; padding: 0.55em 0.7em; border: 1px solid var(--border2); background: var(--surface); text-align: center; transition: all 0.3s; white-space: nowrap; }
.node.lit { border-color: var(--act); background: var(--act-soft); color: var(--act-ink); font-weight: 700; }
.node.done { border-color: var(--cyan); color: var(--cyan-ink); }
.wire { flex: 1; height: 2px; background: var(--border2); min-width: 10px; }
.wire.lit { background: var(--act); }
.formula { font-family: var(--mono); font-size: 14px; background: var(--surface2); border: 1px solid var(--border); padding: 9px 14px; line-height: 1.7; color: var(--text); }
.f-pre { color: var(--cyan-ink); font-weight: 700; } .f-cred { color: var(--accent-ink); font-weight: 700; } .f-dec { color: var(--amber-ink); font-weight: 700; }

/* DRR + decisions */
.queue { display: flex; gap: 4px; min-height: 28px; align-items: center; overflow: hidden; }
.qreq { font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 5px 6px; color: #0b1a00; flex-shrink: 0; }
.qreq.p { background: var(--accent); } .qreq.r { background: var(--cyan); color: #fff; }
.deficit { font-family: var(--mono); font-size: 12.5px; }
.meter { height: 8px; background: var(--surface2); overflow: hidden; }
.meter > div { height: 100%; transition: width 0.4s; }
.decision { font-family: var(--sans); font-weight: 600; letter-spacing: -0.01em; font-size: 26px; padding: 12px 14px; text-align: center; transition: all 0.3s; }
.decision.local { background: var(--accent-soft); color: var(--accent-ink); border: 1px solid color-mix(in srgb,var(--accent) 50%,transparent); border-top: 6px solid var(--accent); }
.decision.remote { background: var(--cyan-soft); color: var(--cyan-ink); border: 1px solid color-mix(in srgb,var(--cyan) 50%,transparent); border-top: 6px solid var(--cyan); }
.decision.error { background: var(--red-soft); color: var(--red-ink); border: 1px solid color-mix(in srgb,var(--red) 50%,transparent); border-top: 6px solid var(--red); }
.decision .why { display: block; font-size: 13.5px; font-weight: 400; color: var(--text-body); margin-top: 5px; line-height: 1.45; letter-spacing: 0; }
.check { font-family: var(--mono); font-size: 13px; display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--border); }
.check .ok { color: var(--accent-ink); font-weight: 700; } .check .no { color: var(--red-ink); font-weight: 700; }

/* chrome */
.overview { position: fixed; inset: 0; z-index: 200; background: rgba(255,255,255,0.98); display: none; padding: 4vh 4vw; overflow: auto; }
.overview.open { display: block; }
.overview h2 { margin-bottom: 1rem; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.ov-grid button { text-align: left; background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--act); padding: 0.8em; color: var(--text); cursor: pointer; font-family: inherit; font-size: 0.9rem; }
.ov-grid button:hover { background: var(--surface2); }
.ov-grid button.cur { outline: 2px solid var(--text); }
.ov-grid .n { font-family: var(--mono); color: var(--text-dim); font-size: 0.72rem; display: block; margin-bottom: 2px; }
.nav button { background: var(--surface); border: 1px solid var(--text-dim); border-radius: 3px; font: 13px var(--mono); padding: 4px 9px; cursor: pointer; color: var(--text); }
.progress { background: var(--accent); }
.page-num { font-size: 12px; letter-spacing: 0.06em; color: var(--text-dim); }
.page-num b { color: var(--text); font-weight: 600; }

/* ===== speaker notes ===== */
#notes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 150; display: none; max-height: 44vh; overflow: auto; background: rgba(17,17,17,0.96); color: #eee; font-family: var(--sans); padding: 16px 32px 64px; box-shadow: 0 -6px 24px rgba(0,0,0,.3); }
body.notes-open #notes { display: block; }
#notes .nt { font-family: var(--mono); font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; display: flex; align-items: center; }
#notes .nb { font-size: 16px; line-height: 1.55; max-width: 1200px; }
#notes ul { margin: 6px 0 0 20px; padding: 0; }
#notes li { color: #e6e6e6; font-size: 16px; line-height: 1.5; margin-bottom: 5px; }
#notes b { color: #b6e35a; }
#notes code { background: #2b2b2b; color: #e6f3c9; }
#notes .tag { vertical-align: 1px; }
.nav { z-index: 160; }

/* ===== slide 5: events → radix tree ===== */

/* ===== disagg + topology ===== */

.wr-ht2 { flex-direction: column; gap: 0; } .wr-ar span { color: inherit !important; font-size: 12px !important; }
.wr-ar.g { color: var(--accent-ink); } .wr-ar.v { color: var(--violet-ink); } .wr-ar.rev { flex-direction: column-reverse; }

.wr.walk .wr-ar.lit { box-shadow: none; transform: none; }
.pk-leg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin: 0 5px 0 12px; }
.pk-leg i.g, .pk-sq i.g, .kv-sq i.g { background: var(--accent); } .pk-leg i.a, .pk-sq i.a, .kv-sq i.a { background: var(--amber); } .pk-leg i.v, .pk-sq i.v { background: var(--violet); }
.pk { display: grid; gap: 12px; }
.pk-r { display: grid; grid-template-columns: 150px auto 30px minmax(150px, 1fr) 150px 90px; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; transition: box-shadow .25s; }
.pk-r.win { box-shadow: 0 0 0 2.5px var(--accent), var(--shadow); }
.pk-n { display: grid; } .pk-n b { font-size: 18px; } .pk-n span { font-family: var(--mono); font-size: 12px; color: var(--text-dim); text-transform: uppercase; }
.pk-sq { display: flex; gap: 4px; transition: opacity .25s; } .pk-sq i { width: 30px; height: 30px; border-radius: 6px; display: block; } .pk-sq.dim { opacity: .18; }

.kv { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.kv-grid { display: grid; grid-template-columns: 110px repeat(3, minmax(0, 1fr)); gap: 6px 8px; }

.deck { background: var(--bg); }
.slide { background: var(--slidebg); }
h1 { font-weight: 800; letter-spacing: -0.035em; }

.lede { color: var(--text-dim); }

.card, .worker, .k4-w, .k5-w, .k6-row, .actcard, .pipe-node, .k5-ev, .k4-prompt, table.t { border-radius: 14px; }

input[type=range] { border-radius: 4px; accent-color: var(--accent); }

table.t { overflow: hidden; border-top: 0; box-shadow: var(--shadow); }
.overview { background: color-mix(in srgb, var(--bg) 97%, transparent); }
.ov-grid button { border-radius: 12px; border-top-width: 4px; color: var(--text); }

  <h2 data-enter style="--i:1">A scorer in 12 lines, shipped in 4 steps</h2>
  <div class="split" data-enter style="--i:2">
    <div class="code"><span class="k">struct</span> <span class="t">LeastBusy</span>;
<span class="k">impl</span> <span class="t">WorkerScorer</span> <span class="k">for</span> <span class="t">LeastBusy</span> {
  <span class="k">fn</span> <span class="f">required_worker_inputs</span>(&amp;self) -&gt; WorkerInputs {
    WorkerInputs::<span class="n">LOAD</span> }          <span class="c">// or CACHE, PREFERRED_TAINT</span>
  <span class="k">fn</span> <span class="f">score</span>(&amp;<span class="k">mut</span> self, _c: &amp;WorkerSelectionContext&lt;'_&gt;,
           cands: WorkerCandidates&lt;'_&gt;, costs: &amp;<span class="k">mut</span> [f64])
           -&gt; Result&lt;(), WorkerSelectionPolicyError&gt; {
    <span class="k">for</span> (w, c) <span class="k">in</span> cands.iter().zip(costs) {
      *c = w.load().ok_or_else(||
             WorkerSelectionPolicyError::failed(<span class="s">"no load"</span>))?
           .active_requests() <span class="k">as</span> f64; }
    Ok(()) } }</div>
    <div class="stack">
      <div class="card c-violet"><h3>Ship it</h3><ol style="padding-left:1.2em;display:grid;gap:6px">
        <li><code>registry.register_worker_selection("least-busy", …)</code> in a catalog crate</li>
        <li>Add the catalog to <code>lib/bindings/python</code> as <code>dynamo-worker-selection-policy-catalog</code></li>
        <li><code>maturin develop --uv --features custom-policy</code></li>
        <li>YAML: <code>worker_selection.instances[].type: least-busy</code></li>
      </ol></div>
      <ul class="clean card">
        <li>Declare every input you read. Indexing only starts if some policy asks for <code>CACHE</code></li>
        <li>The factory runs once per partition (aggregated, prefill, decode, encode)</li>
        <li>Unknown types and duplicate names fail at startup, not at request time</li>
      </ul>
    </div>
  </div>
</section>`,

    <div class="card c-amber"><h3 class="hl-a">2 · Fault tolerance</h3><p>Requests <b>migrate</b> off dead workers. Every router replica is active and rebuilds its view from events after a restart. Sessions rebind when their worker disappears.</p></div>

/* ===== SPEAKER NOTES (toggle with N or the Notes button) ===== */
const NOTES = {
  'What the router does': 'Router inside the frontend: tokenized request in, one decision out. Two views (cache from KV events, load from live metrics), then admission, then pick. Workers publish events back to every router replica. Each later deep dive zooms into one of these boxes.',
  'How it picks a worker': 'The intuition behind the cost model. Cache alone creates hot-spots; load alone throws away cache. Adding them picks C. The deep dive adds queued prefill, decode load, tiered cache credit and the overlap_score_credit knob.',
  'Why KV-aware routing': 'Two sessions, four turns each, interleaved (8 requests, 70 blocks of prompt). Round-robin computes 63 blocks of prefill; KV-aware computes 28. Toggle while stepping; totals keep both.',
  'Compared with llm-d and SGLang': 'Be fair: all three are cache-aware. Dynamo differences: decision inside the frontend (no ext-proc callout), exact multi-tier cache view from events for vLLM/SGLang/TRT-LLM on every active replica, one cost with bookings, conditional disagg, admission classes with DRR. llm-d: EPP via ext-proc; approximate or precise (vLLM KV events) prefix scoring; default HA is leader election with warm standby (all-active optional, approximate prefix state per replica); strong flow control. SGLang router: standalone Rust gateway, radix tree fed by SGLang KV events, stateless replicas, P/D pairing, per-engine caps. Sources: llm-d.ai/docs/architecture/router/epp, llm-d.ai/docs/architecture/kv-management/prefix-cache-aware-routing, github.com/llm-d/llm-d-router/blob/main/config/charts/README.md, github.com/sgl-project/sglang/tree/main/sgl-router.',
  'Worker failure mid-request': 'Request migration: the frontend keeps every generated token, so when the worker dies it resends prompt + tokens; the router picks a healthy worker; the client sees one stream. Limit 0 = error to the client. See the Fault tolerance deck for drains and rollouts.',
  'Why admission control': 'Illustrative curve. Without admission, overload lands in engine queues: TTFT climbs for all, goodput collapses past capacity. With admission the router keeps workers at a safe level and decides: reject fast, hold, order, or a custom classifier. The next four slides are those four gates.',

'What the router does': `<b>Key point:</b> the frontend owns the request; the router decides where it goes.
<ul><li>The router keeps two views: a <b>cache view</b> built from KV events, and a <b>load view</b> from live worker metrics and its own request tracking.</li>
<li><b>Admission control</b> admits, holds or rejects. Then the router picks the worker with the <b>lowest cost</b> — here Worker C — and the frontend dispatches to it.</li>
<li>Workers send KV placement and load events back to the router, so the next request sees the updated state.</li></ul>`,

'Why the Dynamo Router': `<b>Three differences from other routers:</b>
<ul><li><b>Sees the real cache:</b> workers report exactly which KV blocks they hold. Other routers guess from the requests they have sent.</li>
<li><b>Never pauses:</b> every router replica is fully active and rebuilds its cache view from events. Active/standby designs have a 10 to 30 s failover gap.</li>
<li><b>No extra hop:</b> the router runs inside the frontend (client → router → worker). Gateway designs call out to a separate endpoint picker (client → proxy → EPP → worker).</li></ul>`,

'Four deployment methods': `<b>Key point:</b> one selection core, four ways to host it — and plugins work in all four.
<ul><li><b>Frontend:</b> built into <code>dynamo.frontend</code>. The simplest start.</li>
<li><b>Gateway API EPP:</b> plugs into a Kubernetes gateway as its endpoint picker.</li>
<li><b>Standalone EPP:</b> the same picker in front of vanilla worker pods, with no Dynamo frontend.</li>
<li><b>HTTP or Python service:</b> the router as its own process (next slide), callable from any stack.</li>
<li>The core: request classifier (admit, hold, reject), policy queue (orders waiting requests by class), worker selection (filter, score, pick), and active load (bookings per worker).</li></ul>`,

'What shipped': `<b>Router changes by release</b> (release notes and main, October 2026).
<ul><li><b>1.4.0 (Aug 14):</b> cache-salt tenant isolation; sessions stick across router replicas; sticky decode workers; conditional prefill/decode split (experimental).</li>
<li><b>1.5.0 (Sep 18):</b> pluggable scorers, pickers and filters; sticky-until-saturated routing policy; session affinity, strict or flexible; hints from the router to KVCR (experimental).</li>
<li><b>On main, next 1.6:</b> one selection core for all hosts; easier policy customization and management; queue order set per policy class; router decision trace records.</li></ul>`,

'From router to agent scheduler': `<b>Direction:</b> from placing one request at a time to an agent scheduler.
<ul><li><b>Dynamo approach:</b> signals from the agent harness, the gateway, and entitlements / service levels feed the router, which keeps adjusting its plan from worker feedback. Cache management is distributed (KVCR) and data movement is planned with placement.</li>
<li><b>Other approaches:</b> few signals in, a one-time pick, and each engine manages its own cache.</li>
<li>Toggle between the two views. This is direction, not shipped behavior; hints from the router to KVCR are experimental in 1.5.</li></ul>`,

'Plan early': `<b>Key point:</b> decide admission, placement and cache together, before the requests arrive.
<ul><li><b>Today:</b> the router places this request, then the next, using cache and load. t1 and t2 land on busy Worker A while B is idle.</li>
<li><b>Next:</b> the router builds a forward plan from signals, SLAs, limits, cache and load. For one agentic session (t1 to t4) with forecasted turns, it holds t2 for its SLA, frees up A, and has KVCR copy the KV to B so t3 and t4 run there.</li></ul>`,

'Service classes': `<b>Key point:</b> each class has a target, and the plan is checked and adjusted continuously.
<ul><li>Classes: <b>Priority</b> (tight target), <b>Standard</b> (looser target), <b>Batch</b> (best effort).</li>
<li><b>Plan:</b> admit, route, keep or pause each request. <b>Measure:</b> check every class against its target (A missing, B at risk, C fine). <b>Adjust:</b> change the plan until every class is on target.</li>
<li>Builds on today's policy classes and DRR from Act 3; target-driven adjustment is direction, not shipped.</li></ul>`,
'Title': `<b>Framing:</b> the router sits between the frontend's OpenAI-compatible HTTP layer and the engine workers (vLLM, SGLang, TRT-LLM). For every request it chooses a worker (and DP rank) so the request finishes as cheaply as possible, while protecting workers that are already full.
<ul>
<li>It runs in the frontend by default (<code>python -m dynamo.frontend --router-mode kv</code>), and can also run standalone or embedded from Python (Act 4).</li>
<li>Four acts, four questions: <b>where</b> should it run (performance), <b>what if</b> things are full or restart (fault tolerance), <b>whether</b> it runs now (admission control), and <b>how</b> to change the rules (customization).</li>
<li>The interactive widgets are small models of the router's logic, built to show behavior. They are not benchmarks.</li>
<li>Keys: ← → navigate, <b>N</b> notes, G all slides, F fullscreen.</li>
</ul>`,

'The story': `<b>Key point:</b> each act maps onto a group of stages in the request path (next slide).
<ul>
<li><b>Act 1, Performance:</b> the scoring inputs (radix-tree indexer for cache, slot tracker for load) and the default cost function, including disaggregated prefill/decode.</li>
<li><b>Act 2, Fault tolerance:</b> filtering before scoring, and how router state survives restarts and worker churn.</li>
<li><b>Act 3, Admission control:</b> what happens <i>before</i> a worker is chosen: classes, queues, fair sharing, and the classifier plugin.</li>
<li><b>Act 4, Customization:</b> the policy file and the Rust plugin points (filter, scorer, picker), plus using router parts outside the frontend.</li>
<li>Audience shortcut: performance tuners → Act 1; SRE / on-call → Act 2; multi-tenant platform owners → Act 3; framework integrators → Act 4.</li>
</ul>`,

'Anatomy of a routed request': `<b>Key point:</b> two independent inputs feed the decision. <b>Cache</b> comes from KV events (shared, eventually consistent). <b>Load</b> comes from the request lifecycle (local to each router replica).
<ul>
<li><b>Block hashing:</b> tokens are cut into fixed-size blocks (the KV block size must match the engine's). Each block hash covers its tokens <i>and</i> the parent block's hash, so equal hashes imply an identical full prefix. That's why matches are always prefixes and lookups are O(prompt blocks).</li>
<li><b>Order matters:</b> classifier → class queue → filters → scoring. Admission decisions are made before any worker is considered, and busy workers are removed before cache credit can make them look attractive.</li>
<li><b>Reservation:</b> once a worker is picked, the router immediately adds this request's prefill tokens and blocks to that worker's load. Concurrent requests see the reservation right away, before the engine reports anything. Without this, a burst of identical requests would all pile onto the same "best" worker.</li>
<li><b>Closing the loop:</b> as the worker stores or evicts blocks, its KV events update every router's indexer, so the next turn of the same conversation finds its prefix.</li>
<li>Dashed boxes (classifier, filters, scorer, picker) are plugin points covered in Acts 3 and 4.</li>
</ul>`,

'Why KV-aware routing': `<b>Key point:</b> multi-turn traffic resends the whole history, so most of every prompt is a prefix the cluster has already computed. What matters is whether the request lands where that prefix is cached.
<ul>
<li><b>Setup:</b> two sessions, four turns each, sent alternately (S1 turn 1, S2 turn 1, S1 turn 2, and so on). Session 1 adds 4 blocks per turn (64 tokens), so its turn t is a 4·t-block prompt. Session 2 adds 3 blocks per turn, so turn t is 3·t blocks. Three identical workers.</li>
<li><b>Round-robin</b> deals the 8 requests across W1, W2, W3 in order, so each session moves to a different worker every turn. Most turns recompute everything. S1 turn 4 lands back on W1 but only finds turn 1's 4 blocks, and S2 turn 4 lands on W2 and only finds turn 1's 3 blocks, stale partial copies. 63 of 70 blocks are computed.</li>
<li><b>KV-aware</b> sends every S1 turn to W1 and every S2 turn to W2, the workers holding each session's longest cached prefix. S2 turn 1 goes to W2 because W1 is busy with S1. Each turn computes only its new blocks (4 for S1, 3 for S2): 28 of 70.</li>
<li><b>Why it matters:</b> prefill is compute-bound and attention cost grows faster than linearly with context. Skipped prefill lowers TTFT directly and frees GPU time for decode. Round-robin also wastes KV memory by keeping partial copies of the same conversation on every worker.</li>
<li><b>Scale it up:</b> real clusters carry thousands of conversations, agent loops and shared system prompts. The saving grows with conversation length.</li>
<li><b>Prerequisite:</b> prefix caching must be enabled in the engine (vLLM automatic prefix caching, SGLang radix cache, TRT-LLM KV reuse). The router can only route to reuse that exists.</li>
<li><b>Bridge:</b> this slide raises two questions. How does the router know where each session's history is? (next slide: KV events.) What if W1 is busy? (slide 6: the cost function.) Turn it on with <code>--router-mode kv</code>; round-robin is the default.</li>
</ul>`,

'How the router sees the cache': `<b>Key point:</b> engines report every block they store or evict. The router turns that stream into one radix tree, where each node is a block hash tagged with the workers that hold it. One walk down the tree gives every worker's prefix overlap.
<ul>
<li><b>Chained hashes:</b> each block's hash covers its 16 tokens <i>and</i> the parent block's hash. So "S2" really means "S1 followed by S2", and matching is always a prefix match. Two workers holding S2 hold exactly the same prefix.</li>
<li><b>Steps 2–4, Stored:</b> the event carries the block hashes and the parent hash. The router inserts nodes that are new and adds the worker to nodes that already exist. That's why W2 joins S1/S2 (a shared system prompt) instead of creating duplicates.</li>
<li><b>Step 5, Removed:</b> eviction removes the worker from the node; a node with no owners is deleted. The router never has to poll workers.</li>
<li><b>Step 6, lookup:</b> walk the request's hashes from the root. A worker's overlap is the depth at which it drops out. The cost is O(request blocks), independent of how many blocks are cached cluster-wide.</li>
<li><b>Step 7, closing the loop:</b> after routing, the worker's own <code>Stored</code> event updates the tree for the next turn. Load (active prefill tokens, decode blocks) does <i>not</i> come from events; it comes from the router's request lifecycle.</li>
<li><b>Transport:</b> events go over the event plane (ZMQ by default). Every router replica consumes them and builds the same tree. Overlap is tracked per tier (GPU, host, disk; see preset ③ on the next slide).</li>
<li><b>Consistency:</b> the tree is eventually consistent. If a block is evicted just before routing, the worst case is a partial miss; the engine recomputes it, so correctness is never affected.</li>
<li><b>No events?</b> <code>--no-router-kv-events</code> predicts cache contents from the router's own decisions, expiring after <code>--router-ttl-secs</code> (default 120).</li>
</ul>`,

'How the router decides': `<b>Key point:</b> one formula, two terms, all in KV blocks. Cache hits become <b>credit</b> that cancels prefill; load adds to the cost. The worker with the lowest total wins.
<ul>
<li><b>Bridge:</b> the radix tree (last slide) supplies the overlap that becomes credit; the router's request tracking supplies load. Preset ② answers slide 4's "what if W1 is busy?".</li>
<li><b>Reading a row:</b> the 64 squares are this prompt's blocks. Green = already cached on that worker (credit); striped green = cached in host memory (0.75 credit each); outlined = must be computed. The bar is the cost: teal = prefill (striped part is prefill already queued on that worker), amber = decode load (light amber = this request's own 64 blocks). The dashed green box is what the cache saved.</li>
<li><b>① Cache wins:</b> W1 = (0 + 64 − 48) + (200 + 64) = 16 + 264 = <b>280</b>, vs. W2 308 and W3 294.</li>
<li><b>② Load beats cache:</b> W1 = (128 + 64 − 56) + (400 + 64) = 600, while idle W2 = 64 + 164 = <b>228</b>. Even at credit 3.0, W1 is 488. A hot cache can't rescue a buried worker.</li>
<li><b>③ Host tier counts:</b> 64 host blocks × 0.75 = 48 credit, so W1 = 16 + 164 = <b>180</b> beats W2's 32 GPU hits (216). TRT-LLM reports one merged view, so per-tier weights don't apply to it.</li>
<li><b>④ Your call:</b> at credit 1.0, W2 wins 358 vs. 368. At about 1.3, W1's 40 cached blocks are worth 52 and W1 wins. That's the tuning question: higher <code>overlap_score_credit</code> → more cache affinity → better TTFT; lower → more even decode load → better ITL. Prefill-heavy workloads (long prompts, short outputs) want more; decode-heavy ones want less.</li>
<li><b>Not shown on the slide:</b> <code>prefill_load_scale</code> multiplies the whole prefill term (1.0 here), and <code>router_temperature</code> &gt; 0 samples from a softmax over costs instead of always taking the minimum. That helps avoid herding when many near-identical requests arrive together.</li>
<li>All of these live in the policy YAML (slide 15) under <code>worker_selection</code>. <b>Bridge:</b> the next slide applies the same cost model to disaggregated serving.</li>
</ul>`,

'Disaggregated serving': `<b>Key point:</b> disaggregation adds a second routing hop. The prefill hop is KV-aware (the slide 6 cost). The decode hop balances load. Conditional disagg adds a shortcut: if the decode side already has most of the prompt, skip the prefill pool. <span class="tag tag-amber">experimental</span>
<ul>
<li><b>Why split at all:</b> prefill is compute-bound and decode is memory-bandwidth-bound. Separate pools scale and batch independently, and long prefills stop stalling token generation.</li>
<li><b>Auto-wiring:</b> when Prefill and Decode workers register under the same model name, the frontend builds the prefill router automatically.</li>
<li><b>Remote path (numbered 1–6 in the diagram):</b> the frontend tokenizes; the prefill router makes a KV-aware pick; the prefill worker computes the KV and returns NIXL metadata; the decode router picks by load only; the decode worker pulls the KV over NIXL and streams tokens.</li>
<li><b>Why the decode hop ignores cache:</b> the KV arrives by transfer, so the decode worker's own prefix cache doesn't reduce work. Overlap credit is 0 and <code>assume_kv_reuse</code> is false.</li>
<li><b>The cost of the split</b> is the transfer. KV bytes per token = 2 × layers × KV heads × head dim × bytes per element, about 320 KB/token for a Llama-3-70B-class model in FP16. So an 8k prompt moves about 2.7 GB.</li>
<li><b>Conditional disagg</b> (<code>--router-mode kv --router-conditional-disagg</code>): effective ISL = prompt − tokens cached on the decode worker. The demo uses <b>isl_or_load</b>: local if effective ISL &lt; <code>eff_isl_threshold</code> and effective/prompt &lt; <code>eff_isl_ratio_threshold</code>, <b>or</b> the prefill pool is over <code>prefill_busy_threshold</code>. Other policies: <b>isl_bounding</b> (ISL checks only) and <b>prefill_load</b> (load only). The load policies fail at startup without <code>prefill_busy_threshold</code>.</li>
<li><b>Scenarios:</b> ① new 8k prompt → remote, the split pays off. ② follow-up turn with 7.5k cached → 512 tokens computed locally, no 2.7 GB transfer. ③ prefill pool saturated → local as backpressure relief, even though the ISL checks fail.</li>
<li><b>Trade-off:</b> local prefill runs inside the decode worker's batches and can spike ITL for other requests. Choose thresholds from measurements. It needs KV events from both pools (vLLM, TRT-LLM); SGLang isn't supported yet.</li>
<li><b>Bridge:</b> whenever the remote path is taken, the transfer cost depends on the link, which is the next slide.</li>
</ul>`,


'Fast KV transfer links': `<b>Key point:</b> the remote path ends in a KV transfer, and a transfer inside an NVLink domain is much cheaper than one across the RDMA network. Topology-aware routing steers the decode pick toward the prefill worker's domain. <span class="tag tag-amber">experimental</span>
<ul>
<li><b>Setup:</b> workers publish a <code>kv_transfer_domain</code>, typically an NVLink domain such as one NVL72 rack. The prefill worker is picked first (KV-aware). The decode pick then considers the domain.</li>
<li><b>not set:</b> the decode pick is load-only, so D3 in rack B wins (load 90) and the KV crosses racks.</li>
<li><b>preferred:</b> same-domain decode costs are multiplied by exp(−tanh(w)), bounded between 1 and e⁻¹ ≈ 0.37. At the default w = 0.85 the factor is about 0.50, so D1 costs 60 and beats D3's 90. Below about w = 0.3, D3's lower load wins again. A much busier same-domain worker can still lose, so load is never ignored.</li>
<li><b>required:</b> a hard filter. Decode workers outside the domain are excluded, and the request fails if none remain. Use it only when every domain has decode capacity.</li>
<li>Load costs in the diagram are illustrative. How much the link matters depends on KV size per token and fabric bandwidth.</li>
<li><b>Bridge to Act 2:</b> Act 1 always found a cheapest worker. Next: what if even the cheapest one is already full?</li>
</ul>`,

'Overload protection': `<b>Key point:</b> busy workers are removed <i>before</i> scoring, so a large cache credit can never route a request onto a saturated worker.
<ul>
<li><b>Thresholds:</b> <code>--active-decode-blocks-threshold</code> is the fraction of KV capacity in use. <code>--active-prefill-tokens-threshold</code> (absolute) and <code>-frac</code> (× max batched tokens) bound queued prefill work. A worker is busy if <b>any</b> configured threshold is exceeded.</li>
<li><b>Off by default:</b> the router never refuses, and overload shows up as engine-side queueing: TTFT climbs with no clear signal. Setting thresholds turns that into an explicit, fast <b>529</b> that gateways and clients can retry elsewhere or back off on.</li>
<li><b>Pins:</b> a request pinned to one worker (e.g. a hard session binding or explicit target) has no fallback. If that worker is busy you get <code>PinnedWorkerOverloaded</code>.</li>
<li><b>All busy:</b> <code>AllEligibleWorkersOverloaded</code> → 529, unless policy classes are configured, in which case the request queues (Act 3).</li>
<li><b>Operations:</b> tune live with <code>POST /busy_threshold</code>; change the status code with <code>DYN_HTTP_OVERLOAD_STATUS_CODE</code> (e.g. 429 for clients that only understand that).</li>
<li>Starting point: decode-blocks threshold around 0.85–0.95, then adjust based on how often you see 529s versus TTFT tail latency.</li>
</ul>`,

'Restarts and replicas': `<b>Key point:</b> router state comes in two kinds. The <b>cache view</b> can be rebuilt from events. The <b>load view</b> is ephemeral and local to each replica.
<ul>
<li><b>Gap detection:</b> each worker's KV events carry a monotonically increasing <code>event_id</code>. When a router sees a gap (or starts up), it asks that worker to replay what it missed.</li>
<li><b>Replay path:</b> the worker's <code>LocalKvIndexer</code> keeps a ring buffer of recent events and finds the missing range by binary search. If the gap is older than the buffer, the worker sends a <b>TreeDump</b>, a full snapshot of its radix tree. The default buffer holds the 1024 most recent events; the widget does not show a buffer size.</li>
<li><b>Replicas:</b> by default every replica consumes every event and builds its own tree, so they converge independently. That costs N× event fan-out. To share one tree instead, run <code>--serve-indexer</code> on anchor replicas and <code>--use-remote-indexer</code> on the rest.</li>
<li><b>Load sync:</b> without <code>--router-replica-sync</code>, each replica only sees its own in-flight requests and undercounts load from the others. A small temperature helps here too.</li>
<li><b>Leak protection:</b> requests with no progress (for example, a client that vanished without a clean free) are reaped after <code>DYN_ROUTER_ACTIVE_REQUEST_EXPIRY_SECS</code> (300 s), so load accounting can't drift forever.</li>
<li>In disaggregated serving, a prefill failure is returned to the client. There's no silent fallback to local prefill.</li>
</ul>`,

'Sessions when workers change': `<b>Key point:</b> session affinity is an explicit binding for clients that know a conversation's identity. It's stronger than prefix matching, which depends on the cache still being there.
<ul>
<li>Enable it with <code>--router-session-affinity-ttl-secs N</code>; clients send <code>X-Dynamo-Session-ID</code>. Typical users: agent frameworks and multi-turn chat backends.</li>
<li><b>Hard (default):</b> the request goes to the bound worker even if another is cheaper. Busy thresholds still apply, so a hard-bound session can get a 529.</li>
<li><b>Soft:</b> the binding is passed to the policy as a hint. If another worker is much cheaper, the policy may choose it, and the session rebinds.</li>
<li><b>Worker removed:</b> in both modes the stale binding is dropped, normal selection runs once, and the session rebinds to the new pick.</li>
<li>Bindings commit only after a <b>successful dispatch</b>, so a failed send never binds a session to a dead worker.</li>
<li>The TTL is an idle timer, and in-flight requests keep it alive. Replica sync is best effort and a router restart clears all bindings, so use ingress-level stickiness if you need strict guarantees.</li>
</ul>`,

'Classes and queues': `<b>Key point:</b> a request's queue is determined by two things: who sent it (the family, from a header) and how much real work it brings (the uncached-ISL bucket).
<ul>
<li><b>Family:</b> <code>x-dynamo-meta-policy-class</code>, or set by a classifier plugin (slide 14).</li>
<li><b>Uncached ISL:</b> raw prompt length minus the best cached prefix found by the indexer. It measures the prefill work the request will actually cause. A 12k prompt with 9k cached is a "medium" job, not a "long" one.</li>
<li><b>When it queues:</b> only if the class has a busy threshold set <b>and</b> every eligible worker is busy. Otherwise it goes straight to scoring.</li>
<li><b>Within a class:</b> <code>fcfs</code>, or <code>wspt</code> (weighted shortest processing time), which runs cheaper requests first. WSPT minimizes mean completion time but can delay large requests; deadlines (<code>set_due_at</code>) bound that delay.</li>
<li><b>Limits:</b> per-worker queue caps on requests, raw tokens and cached tokens. Exceeding them rejects with 529, so the queue can't grow without bound.</li>
<li>Bucket floors 0 / 2k / 8k are illustrative; you set <code>uncached_isl_buckets</code>.</li>
</ul>`,

'Fair sharing with DRR': `<b>Key point:</b> Deficit Round Robin (Shreedhar &amp; Varghese, 1995) is a classic O(1) fair-queueing algorithm. Here the cost of a request is its uncached tokens instead of packet bytes.
<ul>
<li><b>Each round:</b> a non-empty class adds its <code>quantum</code> to its deficit, then dispatches from the head while deficit ≥ head cost, subtracting each cost. Leftover credit carries to the next round.</li>
<li><b>Share:</b> over time each class's share of dispatched <b>tokens</b> (not requests) is proportional to its quantum. With 512 : 128, premium gets about 80% of uncached-token capacity whenever both classes are backlogged.</li>
<li><b>Work-conserving:</b> if premium is empty, regular can use all the capacity. Quanta only matter under contention.</li>
<li><b>Reset on empty:</b> a class that drains loses its leftover deficit, so it can't build up credit while idle and then burst.</li>
<li><b>Sizing:</b> make the quantum at least the typical head cost. Otherwise a class needs several rounds to send one request, which adds latency without changing its share.</li>
<li>No flag is needed: defining <code>policy_classes</code> with a <code>quantum</code> enables it.</li>
</ul>`,

'Admission control plugins': `<b>Key point:</b> a <code>RequestClassifier</code> is your own gate that runs before routing. It sees each request and can admit it (optionally tagging it), defer it, or reject it with a typed error. <span class="tag tag-amber">experimental</span>
<ul>
<li><b>Async:</b> <code>classify</code> returns a future, so it can call out to a rate limiter, quota service or tenant database without blocking the router.</li>
<li><b>Errors map to HTTP:</b> <code>ErrorClass::CapacityExhausted</code> → 529 (or 429 via <code>DYN_HTTP_OVERLOAD_STATUS_CODE</code>); <code>ErrorClass::RateLimited</code> → 429.</li>
<li><b>Tagging on admit:</b> <code>set_policy_class</code> picks the queue (slide 12), <code>set_due_at</code> sets a deadline used for ordering and expiry, and <code>set_worker_selection_target</code> steers selection.</li>
<li><b>Lifecycle events</b> (Sent → Responding → Completed | Aborted) let a plugin keep accurate accounting, for example refunding a token bucket when a request aborts early.</li>
<li><b>Example code:</b> the deadline is ingress time + budget. If it has already passed, reject with CapacityExhausted; otherwise admit with <code>set_due_at(deadline)</code>. Configure it in the policy YAML under <code>request_classifier</code>.</li>
<li>Supported only with embedded aggregated or decode routing. The built-in ThunderAgent classifier uses the same API.</li>
</ul>`,

'One policy file': `<b>Key point:</b> <code>--router-policy-config policy.yaml</code> collects everything from Acts 1–3 in one versionable file.
<ul>
<li><b>router:</b> shared behavior: KV events, active-block tracking, KV-reuse assumption, and tier weights.</li>
<li><b>policy_classes:</b> queue families, cache buckets, queue policy, quantum and busy thresholds, plus the <code>request_classifier</code> plugin.</li>
<li><b>worker_selection:</b> named policy instances with parameters, assigned per stage (<code>aggregated</code>, <code>prefill</code>, <code>decode</code>). Prefill and decode can use different policies, which matches the disaggregated hops in Act 1.</li>
<li><b>Built-in types:</b> <code>dynamo-default-cost-fn</code> (the Act 1 formula); <code>dynamo-two-tier-cost-fn</code> (balance load first, use cache only to break near-ties); <code>thunderagent</code>; <code>default</code>, a reserved alias for the built-in, useful as the control arm of an A/B test.</li>
<li><b>Precedence</b> runs from most to least specific: stage flag → stage env → <code>DYN_ROUTER_WORKER_SELECTION_POLICY</code> → YAML → built-in.</li>
<li><b>Migration:</b> the individual <code>--router-*</code> tuning flags are deprecated and removed in v1.7. Move them into this file now.</li>
</ul>`,

'Write your own routing policy': `<b>Key point:</b> Dynamo owns the safety-critical ends of the pipeline (eligibility and reservation). You own the middle.
<ul>
<li><b>Eligibility (Dynamo):</b> pins, DP ranks, taints and busy thresholds. Your plugins never see workers that shouldn't receive traffic.</li>
<li><b>WorkerFilter:</b> removes candidates (e.g. by hardware generation, tenant isolation or a custom health signal).</li>
<li><b>WorkerScorer:</b> writes one cost per candidate. Multiple scorers are <b>summed</b>, so you can add one term to the default cost instead of replacing it.</li>
<li><b>WorkerPicker:</b> returns a row index into the candidate list. Dynamo validates it and reserves the slot, so a buggy picker can't route to an ineligible worker.</li>
<li><b>Widget:</b> default costs W1 180, W2 230, W3 205 → W1 wins. Adding least-busy (+20 per active request) gives 360 / 270 / 305 → W2. With the filter on, W1 (9 active) is removed first.</li>
<li>These run on the hot path for every request: keep them pure and fast, with no blocking I/O. Do network calls in a classifier (async) instead.</li>
</ul>`,

'Ship a custom policy': `<b>Key point:</b> a policy is a Rust type registered under a name, compiled into the Python bindings, and selected by name in YAML.
<ul>
<li><code>required_worker_inputs</code> declares what the policy reads (<code>LOAD</code>, <code>CACHE</code>, <code>PREFERRED_TAINT</code>). Dynamo computes only declared inputs; in particular the radix-tree indexer runs only if some policy asks for <code>CACHE</code>.</li>
<li><code>score</code> gets the candidates and a mutable cost slice of the same length. The example writes active requests as the cost and returns a typed error if load data is missing.</li>
<li><b>Ship steps:</b> register in a catalog crate → add the catalog to <code>lib/bindings/python</code> → build with <code>maturin develop --uv --features custom-policy</code> → reference <code>type: least-busy</code> in <code>worker_selection.instances</code>.</li>
<li><b>Per-partition instances:</b> the factory runs once each for aggregated, prefill, decode and encode, so per-stage state isn't shared by accident.</li>
<li><b>Fail fast:</b> unknown types and duplicate names fail at startup, not on the first request.</li>
</ul>`,

'Use the router outside the frontend': `<b>Key point:</b> the same router is available as a Python object, as a standalone process, or in pieces (indexer only, load tracking only).
<ul>
<li><b>route + generate:</b> <code>KvRouter.generate</code> picks, reserves, dispatches and streams in one call. Use it when you want Dynamo routing without the HTTP frontend.</li>
<li><b>pick only:</b> <code>best_worker</code> with a <code>request_id</code> reserves the slot. You dispatch yourself and must report <code>mark_prefill_complete</code> and <code>free</code>, otherwise load accounting leaks until the 300 s expiry. Without <code>request_id</code> it's a read-only query.</li>
<li><b>inspect:</b> <code>get_potential_loads</code> and <code>get_overlap_scores</code> return exactly what the scorer would see. Useful for debugging routing decisions or building your own scheduler (e.g. in Ray).</li>
<li>Use one <code>KvRouter</code> per <code>DistributedRuntime</code>.</li>
<li><b>Standalone services:</b> <code>dynamo.router</code> (full router), <code>select_service</code> :8092 (selection + reservation over HTTP), <code>indexer</code> :8090 (radix tree only; can ingest ZMQ from bare engines), <code>slot_tracker</code> :8091 (load only). They bind 0.0.0.0 with no auth, so put them behind a network policy.</li>
<li><b>Across datacenters</b> <span class="tag tag-amber">experimental</span>: the DC KV Relay publishes Cuckoo-filter summaries instead of raw events. A filter can return false positives but not false negatives, so a match means "possibly cached". A false positive costs a cache miss, never a wrong answer.</li>
</ul>`,

'Recap': `<b>Close:</b> one sentence per act, then Q&amp;A.
<ul>
<li><b>Performance:</b> cost = prefill after cache credit + decode load; disaggregate, and skip the remote hop when the decode worker already has the prompt.</li>
<li><b>Fault tolerance:</b> filter busy workers and fail fast; the cache view is rebuilt from events; sessions rebind when workers change.</li>
<li><b>Admission control:</b> classes by family × uncached size, DRR in uncached tokens, and a classifier plugin for admit / defer / reject.</li>
<li><b>Customization:</b> one policy YAML, Rust filter / scorer / picker plugins, and the router usable from Python or as standalone services.</li>

    $('pcLane').innerHTML = '<div class="node">' + fam + '</div><div class="wire lit"></div><div class="node">uncached ' + fmt(u) + '</div><div class="wire lit"></div><div class="node">bucket ' + b[1] + '</div><div class="wire lit"></div><div class="node lit">→ queue</div>';
    $('pcOut').innerHTML = 'queue ' + fam + '-' + b[1] + '<span class="why">' + fmt(u) + ' of ' + fmt(raw) + ' tokens uncached → ' + b[1] + ' bucket</span>';
  }
  seg('pcFam', d => { fam = d.f; r(); }); bind(['pcRaw', 'pcCache'], r); r();
})();

/* ===== DRR ===== */
(function () {
  let st, round;
  const seed = n => { const a = []; let s = 7; for (let i = 0; i < n; i++) { s = (s * 9301 + 49297) % 233280; a.push(100 + Math.round(s / 233280 * 500)); } return a; };
  const reset = () => { st = { P: { q: seed(40), d: 0, n: 0, t: 0 }, R: { q: seed(40).reverse(), d: 0, n: 0, t: 0 } }; round = 0; r(); };
  function step() { round++; [['P', +$('drrQPq').value], ['R', +$('drrQRq').value]].forEach(([k, q]) => { const c = st[k]; if (!c.q.length) { c.d = 0; return; } c.d += q; while (c.q.length && c.d >= c.q[0]) { const x = c.q.shift(); c.d -= x; c.n++; c.t += x; } if (!c.q.length) c.d = 0; }); r(); }
  function r() {
    $('drrQPo').textContent = $('drrQPq').value; $('drrQRo').textContent = $('drrQRq').value;
    const q = (a, cl) => a.slice(0, 13).map(c => '<span class="qreq ' + cl + '">' + c + '</span>').join('') + (a.length > 13 ? '<span class="hint">+' + (a.length - 13) + '</span>' : '');
    $('drrQP').innerHTML = q(st.P.q, 'p'); $('drrQR').innerHTML = q(st.R.q, 'r');
    $('drrDefP').innerHTML = 'deficit <b class="hl">' + st.P.d + '</b> · head ' + (st.P.q[0] || '—'); $('drrDefR').innerHTML = 'deficit <b class="hl-c">' + st.R.d + '</b> · head ' + (st.R.q[0] || '—');
    $('drrMP').style.width = st.P.n / 40 * 100 + '%'; $('drrMR').style.width = st.R.n / 40 * 100 + '%';
    const T = st.P.t + st.R.t || 1;
    $('drrShare').innerHTML = [['premium', st.P, 'var(--accent)'], ['regular', st.R, 'var(--cyan)']].map(([l, c, col]) => '<div class="bar-row" style="grid-template-columns:5.5em 1fr 6.5em"><span>' + l + '</span><div class="bar-track" style="height:15px"><div class="bar-fill" style="width:' + c.t / T * 100 + '%;background:' + col + '"></div></div><span class="v">' + Math.round(c.t / T * 100) + '% · ' + c.n + '</span></div>').join('');
    $('drrRound').textContent = 'round ' + round;
    $('drrOut').innerHTML = round ? Math.round(st.P.t / T * 100) + ' / ' + Math.round(st.R.t / T * 100) + '<span class="why">premium / regular share of uncached tokens · ' + st.P.n + ' vs ' + st.R.n + ' requests</span>' : 'Step a round<span class="why">shares appear as classes dispatch</span>';
  }
  $('drrStep').onclick = step; $('drrReset').onclick = reset;
  $('drrRun').onclick = () => { let n = 0; const t = setInterval(() => { step(); if (++n >= 20) clearInterval(t); }, 110); };
  bind(['drrQPq', 'drrQRq'], r); reset();
})();

/* ===== admission ===== */
(function () {
  function r() {
    const B = +$('acB').value, W = +$('acW').value, rate = $('acRate').checked; $('acBO').textContent = B; $('acWO').textContent = W; const o = $('acOut');
    let out;
    if (rate) { out = 'reject'; o.className = 'decision error'; o.innerHTML = 'REJECT · 429<span class="why">tenant over its rate limit</span>'; }
    else if (W >= B) { out = 'reject'; o.className = 'decision error'; o.innerHTML = 'REJECT · 529<span class="why">budget ran out while waiting</span>'; }
    else { out = 'admit'; o.className = 'decision local'; o.innerHTML = 'ADMIT<span class="why">due in ' + (B - W) + ' ms</span>'; }
    $('acFlow').querySelectorAll('[data-o]').forEach(e => e.classList.toggle('on', e.dataset.o === out));
    const M = 6000; $('acBW').style.width = (W / M * 100) + '%'; $('acBW').className = W >= B ? 'over' : ''; $('acBB').style.left = (B / M * 100) + '%';
    $('acBT').textContent = W + ' / ' + B + ' ms';
  }
  bind(['acB', 'acW', 'acRate'], r); r();
})();

/* ===== yaml ===== */
(function () {
  const Y = [
    ['<span class="t">router</span>:\n  use_kv_events: <span class="n">true</span>\n  router_track_active_blocks: <span class="n">true</span>\n  router_assume_kv_reuse: <span class="n">true</span>\n  host_cache_hit_weight: <span class="n">0.75</span>\n  disk_cache_hit_weight: <span class="n">0.25</span>', 'Shared router behavior: Act 1 and Act 2 settings that used to be scattered <code>--router-*</code> flags.'],
    ['<span class="t">policy_classes</span>:\n  - name: premium\n    policy_family: premium\n    cache_bucket: all\n    queue_policy: fcfs\n    quantum: <span class="n">512</span>\n    prefill_busy_threshold: <span class="n">1536</span>\n<span class="t">request_classifier</span>: {type: acme-queue-budget}', 'Act 3: the queues, how they share capacity, and the admission plugin.'],
    ['<span class="t">worker_selection</span>:\n  aggregated: tuned        <span class="c"># or prefill: / decode:</span>\n  instances:\n    - name: tuned\n      type: dynamo-default-cost-fn\n      parameters:\n        overlap_score_credit: <span class="n">1.0</span>\n        prefill_load_scale: <span class="n">1.0</span>\n        router_temperature: <span class="n">0.0</span>', 'The cost model from Act 1 with its knobs, assigned per stage. Custom plugin types also go here.'],
  ];
  const r = i => { $('yamlCode').innerHTML = Y[i][0]; $('yamlExplain').innerHTML = '<div class="ex-t">policy.yaml</div>' + Y[i][1]; };
  seg('yamlSeg', d => r(+d.y)); r(0);
})();

/* ===== custom pipeline ===== */
(function () {
  const S = [['Eligibility', 'Dynamo', 0], ['WorkerFilter', 'your plugin', 1], ['WorkerScorer', 'yours, summed', 1], ['WorkerPicker', 'your plugin', 1], ['Reserve', 'Dynamo', 0]];
  const p = $('csPipe');
  S.forEach((s, i) => { if (i) { const a = document.createElement('div'); a.className = 'pipe-arrow'; a.textContent = '▸'; p.appendChild(a); } const n = document.createElement('div'); n.className = 'pipe-node' + (s[2] ? ' ext' : ''); n.style.setProperty('--nc', s[2] ? 'var(--violet)' : 'var(--border)'); n.innerHTML = '<div class="pn-t">' + s[0] + '</div><div class="pn-s">' + s[1] + '</div>'; p.appendChild(n); });
  const W = [{ b: 180, a: 9 }, { b: 230, a: 2 }, { b: 205, a: 5 }];
  function r() {
    const f = $('csFilter').checked, s = $('csScorer').checked, nodes = p.querySelectorAll('.pipe-node'); nodes[1].classList.toggle('lit', f); nodes[2].classList.toggle('lit', s);
    const res = W.map(w => ({ keep: !f || w.a <= 6, cost: w.b + (s ? w.a * 20 : 0), w })), mn = Math.min(...res.filter(x => x.keep).map(x => x.cost));
    $('csWorkers').innerHTML = res.map((x, i) => '<div class="worker' + (!x.keep ? ' off' : '') + (x.keep && x.cost === mn ? ' win' : '') + '" data-off="FILTERED"><h3>W' + (i + 1) + ' <span class="cost">' + x.cost + '</span></h3><div class="breakdown">default ' + x.w.b + (s ? ' + least-busy ' + x.w.a * 20 : '') + ' · ' + x.w.a + ' active requests</div></div>').join('');
  }
  bind(['csFilter', 'csScorer'], r); r();
})();



fitAll();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
show(Math.max(0, (parseInt(location.hash.slice(1), 10) || 1) - 1), false);
</script>
<script>
function setTheme(d){document.documentElement.classList.toggle('dark',d);var b=document.getElementById('themeBtn');if(b)b.textContent=d?'Light':'Dark';try{localStorage.setItem('router-theme',d?'dark':'light')}catch(e){}}
function toggleTheme(){setTheme(!document.documentElement.classList.contains('dark'))}
(function(){var t=null;try{t=localStorage.getItem('router-theme')}catch(e){}setTheme(t==='dark');})();
document.addEventListener('keydown',function(e){if(e.target.matches&&e.target.matches('input[type=text], input[type=number], textarea, select'))return;if(e.key==='t'||e.key==='T')toggleTheme();});
/* new slides: view toggles + service-class stepper */
(function(){
  function tog(seg,a,b){var el=document.getElementById(seg);if(!el)return;el.querySelectorAll('button').forEach(function(x){x.addEventListener('click',function(){el.querySelectorAll('button').forEach(function(y){y.classList.toggle('on',y===x)});var d=x.dataset.v==='1';document.getElementById(a).style.display=d?'none':'block';document.getElementById(b).style.display=d?'block':'none';});});}
  tog('schSeg','schO','schD');tog('plSeg','plO','plD');
  var box=document.getElementById('scBox'),ex=document.getElementById('scEx');if(!box)return;
  var T=['<div class="ex-t">Plan</div>Admit, route, keep or pause each request so every class can meet its target.','<div class="ex-t">Measure</div>Check every class against its target: Worker A misses, B is at risk, C is fine.','<div class="ex-t">Adjust</div>Change the plan — move or pause work — until every class is on target. Then measure again.'];
  function draw(p){box.dataset.p=p;ex.innerHTML=T[p];}
  document.getElementById('scStep').onclick=function(){draw((+box.dataset.p+1)%3)};document.getElementById('scReset').onclick=function(){draw(0)};draw(0);
})();
