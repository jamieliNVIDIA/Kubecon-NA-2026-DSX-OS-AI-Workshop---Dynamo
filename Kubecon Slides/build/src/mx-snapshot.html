<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVIDIA Dynamo · ModelExpress + Snapshot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Engine: fixed 16:9 stage (1920×1080) scaled to fit the window ===== */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
.deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;border-radius:2px}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:60px 96px 84px;opacity:0;pointer-events:none;transition:opacity .5s ease,transform .5s ease;transform:translateX(40px);overflow:hidden}
.slide.active{opacity:1;pointer-events:auto;transform:translateX(0)}
.slide:not(.active) *{pointer-events:none}
.slide.active *{pointer-events:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.2s!important}}
[data-enter]{opacity:0;transform:translateY(20px)}
.slide.active [data-enter]{animation:_enter .5s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0)*.12s)}
@keyframes _enter{to{opacity:1;transform:translateY(0)}}
.nav{position:fixed;bottom:18px;right:24px;display:flex;gap:8px;z-index:100}
.nav button{width:40px;height:40px;border-radius:9px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:all .2s}
.progress{position:fixed;bottom:0;left:0;height:3px;transition:width .4s ease;z-index:100}
.page-num{position:fixed;bottom:28px;left:24px;font-size:13px;font-family:var(--mono);z-index:100}

/* ===== Design system (dark tokens; light overrides at the bottom) ===== */
:root{
  --bg:#07090a;--surface:#11171a;--surface2:#172025;--line:rgba(255,255,255,.10);
  --text:#e8eef0;--dim:#8f9ca3;--accent:#76b900;
  --me:#76b900;--snap:#3ec7e0;--stor:#f5a623;--warn:#ffd166;--bad:#ff5a5f;--kv:#7aa2ff;--wt:#e6c37a;--pu:#b48cff;
  --ink:#0a0d0b;--well:#0d1316;--chipbg:#121a1e;--reqc:#ffffff;--tile:#172024;--tileb:#222d31;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.slide{background:radial-gradient(ellipse at 10% 0%,rgba(118,185,0,.10),transparent 45%),radial-gradient(ellipse at 95% 100%,rgba(62,199,224,.08),transparent 45%),linear-gradient(180deg,#080b0c,#06080a)}
.slide.center{justify-content:center}
.slide.sec-me{background:radial-gradient(ellipse at 25% 45%,rgba(118,185,0,.22),transparent 55%),linear-gradient(180deg,#080b0c,#06080a)}
.slide.sec-snap{background:radial-gradient(ellipse at 25% 45%,rgba(62,199,224,.20),transparent 55%),linear-gradient(180deg,#080b0c,#06080a)}
.slide.sec-both{background:radial-gradient(ellipse at 15% 35%,rgba(118,185,0,.18),transparent 50%),radial-gradient(ellipse at 45% 70%,rgba(62,199,224,.16),transparent 50%),linear-gradient(180deg,#080b0c,#06080a)}
h1{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:800;letter-spacing:-.035em;font-size:100px;line-height:1.02}
h2{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:700;letter-spacing:-.025em;font-size:50px;line-height:1.12;margin-bottom:26px}
h3{font-size:28px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:12px}
p,li{font-size:23px;line-height:1.5;color:#c8d2d6}
b,strong{color:var(--text)}
small{font-size:19px;color:var(--dim);display:block}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;font-size:20px;color:var(--accent);margin-bottom:10px}
.eyebrow.snap{color:var(--snap)}
.lead{font-size:34px;color:var(--dim);max-width:1150px;line-height:1.45}
.ic{font-family:var(--mono);font-size:.86em;background:#1b252a;border:1px solid var(--line);border-radius:6px;padding:.05em .35em;color:#d9f2a8}
.c-me{color:var(--me)}.c-snap{color:var(--snap)}.c-stor{color:var(--stor)}.c-bad{color:var(--bad)}.c-dim{color:var(--dim)}.c-wt{color:var(--wt)}.c-pu{color:var(--pu)}
.fill{flex:1;min-height:0}
.card{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:18px;padding:26px 30px;box-shadow:0 2px 4px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.22)}
.card.me{border-top:4px solid var(--me)}.card.snap{border-top:4px solid var(--snap)}.card.stor{border-top:4px solid var(--stor)}.card.wt{border-top:4px solid var(--wt)}
.card.good{border-left:5px solid var(--me)}.card.bad{border-left:5px solid var(--bad)}.card.warn{border-left:5px solid var(--warn)}
.two{display:grid;gap:36px;grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:20px;min-height:0}
.tag{display:inline-block;font-family:var(--mono);font-size:19px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);margin:4px 6px 4px 0}
.tag.me{border-color:rgba(118,185,0,.5);color:#bfe57a}.tag.snap{border-color:rgba(62,199,224,.5);color:#9fe6f3}.tag.warn{border-color:rgba(255,209,102,.5);color:var(--warn)}.tag.bad{border-color:rgba(255,90,95,.5);color:#ff9a9d}
/* hero + sections */
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:center;flex:1}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px}
.pill{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:16px;padding:22px 26px}
.pill b{display:block;font-family:var(--mono);font-size:22px;margin-bottom:6px}
.pill span{font-size:21px;color:var(--dim)}
.pill.me{border-color:rgba(118,185,0,.5)}.pill.snap{border-color:rgba(62,199,224,.5)}.pill.both{border-color:rgba(255,255,255,.28)}
.foot{margin-top:36px;font-size:19px;color:var(--dim);font-family:var(--mono)}
.secnum{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;font-size:260px;font-weight:800;line-height:.85;opacity:.16;letter-spacing:-.05em}
.sec-me h1{color:var(--me)}.sec-snap h1{color:var(--snap)}
.sec-both h1 .a{color:var(--me)}.sec-both h1 .b{color:var(--snap)}
/* svg diagram vocabulary (theme-aware) */
svg{display:block}
.dg{width:100%;height:100%}
.s-card{fill:var(--surface);stroke:var(--line);stroke-width:2}
.s-well{fill:var(--well);stroke:var(--line);stroke-width:1.5}
.s-row{fill:var(--chipbg);stroke:var(--line);stroke-width:1.5}
.st-me{stroke:var(--me)}.st-snap{stroke:var(--snap)}.st-stor{stroke:var(--stor)}.st-wt{stroke:var(--wt)}.st-pu{stroke:var(--pu)}.st-kv{stroke:var(--kv)}.st-bad{stroke:var(--bad)}.st-dim{stroke:var(--dim)}.st-txt{stroke:var(--text)}
.f-me{fill:var(--me)}.f-snap{fill:var(--snap)}.f-stor{fill:var(--stor)}.f-wt{fill:var(--wt)}.f-pu{fill:var(--pu)}.f-kv{fill:var(--kv)}.f-bad{fill:var(--bad)}.f-dim{fill:var(--dim)}.f-txt{fill:var(--text)}.f-none{fill:none}
.t-h{fill:var(--text);font:700 30px Inter,sans-serif}
.t-b{fill:var(--text);font:600 24px Inter,sans-serif}
.t-d{fill:var(--dim);font:500 22px Inter,sans-serif}
.t-s{fill:var(--dim);font:500 20px Inter,sans-serif}
.t-ink{fill:var(--ink);font:700 22px Inter,sans-serif}
.t-mono{font-family:var(--mono)!important}
.t-me{fill:var(--me)}.t-snap{fill:var(--snap)}.t-stor{fill:var(--stor)}.t-wt{fill:var(--wt)}.t-pu{fill:var(--pu)}.t-kv{fill:var(--kv)}.t-bad{fill:var(--bad)}
.ln{fill:none;stroke-width:3.5}
.ln.thin{stroke-width:2.5}
.ln.anim{stroke-dasharray:12 9;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-42}}
.badge-c{stroke:none}
/* demo shell */
.demo{position:relative;background:rgba(8,12,14,.9);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:24px 28px;box-shadow:0 0 0 1px rgba(118,185,0,.06),0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:16px;min-height:0}
.demo-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.demo-h b{font-size:27px}
.demo-tag{font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:var(--accent);border:1px solid rgba(118,185,0,.5);border-radius:999px;padding:5px 12px;white-space:nowrap}
.ctl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:20px;color:var(--dim)}
.ctl label{display:flex;align-items:center;gap:10px}
.ctl .grow{flex:1;min-width:300px}.ctl .grow input{flex:1}
select,.btn{background:#162025;color:var(--text);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 18px;font-size:20px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#081004;font-weight:700}
.btn.on{background:rgba(118,185,0,.18);border-color:var(--accent);color:#d7f59c}
.btn.snapon.on{background:rgba(62,199,224,.16);border-color:var(--snap);color:#bff0f8}
.btn.warnb{border-color:rgba(255,90,95,.5);color:#ffb3b5}
input[type=range]{accent-color:var(--accent);height:24px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.hint{font-size:20px;color:var(--dim);line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpis div{background:var(--chipbg);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center}
.kpis b{display:block;font-family:var(--mono);font-size:42px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpis span{font-size:19px;color:var(--dim);margin-top:4px}
.lg{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:19px;color:var(--dim)}
.lg i{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:-2px;margin-right:7px}
.k-cuda{background:var(--kv)}.k-pull{background:#7f8a83}.k-stor{background:var(--stor)}.k-h2d{background:var(--wt)}.k-warm{background:var(--warn)}.k-reg{background:#c7d0ca}.k-rdma{background:var(--me)}.k-snap{background:var(--snap)}.k-pod{background:#5b6a60}
.hbar{display:flex;height:110px;background:var(--well);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:6px;gap:4px}
.hbar .sg{height:100%;border-radius:9px;display:flex;align-items:center;padding:0 10px;overflow:hidden;transition:width .45s ease}
.hbar .sg span{font-size:19px;font-weight:700;color:var(--ink);white-space:nowrap}
/* slide 2 pipeline */
.pipe{display:flex;flex-direction:column;gap:0}
.pstep{display:grid;grid-template-columns:58px 1fr auto;gap:16px;align-items:center;position:relative;padding:8px 0}
.pstep .pi{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink);font-weight:800;position:relative;z-index:1}
.pstep:not(:last-child)::after{content:"";position:absolute;left:28px;top:64px;height:26px;width:3px;background:var(--line)}
.pstep b{font-size:25px;display:block}.pstep small{font-size:19px}
.pstep em{font-style:normal;font-family:var(--mono);font-size:21px;color:var(--dim);background:var(--chipbg);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
/* tiles */
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.nd{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--well);display:flex;flex-direction:column}
.nd .nl{font-size:17px;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;font-family:var(--mono)}
.nd.dead{border-color:var(--bad);background:repeating-linear-gradient(45deg,rgba(255,90,95,.09) 0 8px,transparent 8px 16px)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiles.t2{grid-template-columns:repeat(2,1fr);gap:10px}
.tl{position:relative;aspect-ratio:1;border-radius:8px;background:var(--tile);border:1px solid var(--tileb);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;font-family:var(--mono)}
.tiles.t2 .tl{font-size:24px;border-radius:12px}
.tl .pg{position:absolute;left:0;bottom:0;height:5px;background:rgba(255,255,255,.9)}
.tl.dead{background:rgba(255,90,95,.25);border-color:rgba(255,90,95,.5)}
.tl.pull{background:#7f8a83}.tl.dl{background:var(--stor)}.tl.h2d{background:var(--wt)}.tl.warm{background:var(--warn)}.tl.reg{background:#c7d0ca}
.tl.p2p{background:var(--me)}.tl.rst{background:var(--snap)}.tl.wait{background:var(--tile);color:var(--dim);border-style:dashed;border-color:var(--dim)}.tl.ckpt{background:var(--pu)}
.tl.serve{background:#2f5b00;color:#cdf08a;border-color:var(--me)}
canvas.fl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none!important}
.srcrow{display:flex;gap:12px}
.src{flex:1;text-align:center;font-size:20px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--chipbg)}
.src.stor{border-color:rgba(245,166,35,.6)}.src.me{border-color:rgba(118,185,0,.6)}.src.snap{border-color:rgba(62,199,224,.6)}
.src.live{border-color:var(--me);background:rgba(118,185,0,.12)}
.src.off{opacity:.25}
.results{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.results div{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--chipbg);font-size:21px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
.results b{font-family:var(--mono);font-size:26px}
/* snapshot lifecycle */
.stepbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sb{background:var(--chipbg);border:1px solid var(--line);border-radius:999px;color:var(--dim);padding:10px 20px;font-size:20px;cursor:pointer;font-family:inherit}
.sb.on{border-color:var(--snap);color:var(--text);background:rgba(62,199,224,.14)}
.life{display:grid;grid-template-columns:1fr 150px 1fr 150px 1fr;gap:14px;align-items:center}
.lnode{border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--well)}
.lnode h4{font-size:24px;margin-bottom:10px;display:flex;justify-content:space-between;color:var(--text)}
.lnode h4 span{color:var(--dim);font-weight:500;font-size:19px}
.mlabel{font-size:18px;color:var(--dim);margin:10px 0 6px;font-family:var(--mono)}
.mem{display:flex;height:58px;border:1px solid var(--line);border-radius:10px;background:var(--chipbg);padding:4px;gap:4px;overflow:hidden}
.ms{height:100%;border-radius:7px;display:flex;align-items:center;padding:0 8px;overflow:hidden;animation:pop .45s ease}
.ms span{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{opacity:0;transform:scaleX(.6)}to{opacity:1;transform:none}}
.ms-w{background:var(--wt)}.ms-s{background:var(--snap)}.ms-kv{background:var(--kv)}
.ms-kvr{background:transparent;border:2px dashed var(--kv)}.ms-kvr span{color:var(--kv)}
.ms-cri{background:var(--snap)}.ms-big{background:linear-gradient(90deg,var(--snap),var(--wt))}.ms-gms{background:var(--wt)}
.lstatus{margin-top:12px;font-size:20px;font-weight:700;min-height:1.4em}
.arrow{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:20px;color:var(--dim);text-align:center}
.arrow .ln2{width:100%;height:5px;border-radius:3px;background:var(--line)}
.arrow.on .ln2{background:repeating-linear-gradient(90deg,var(--snap) 0 14px,transparent 14px 22px);background-size:44px 5px;animation:mv .7s linear infinite}
.arrow.on{color:var(--text);font-weight:700}
@keyframes mv{to{background-position:44px 0}}
.lexp{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}
.lexp .card{display:flex;flex-direction:column;justify-content:center}
.chips{display:flex;flex-direction:column;gap:12px}
.chips div{background:var(--chipbg);border:1px solid var(--line);border-radius:12px;padding:10px 16px;flex:1;display:flex;flex-direction:column;justify-content:center}
.chips b{font-family:var(--mono);font-size:32px}.chips span{display:block;font-size:19px;color:var(--dim)}
/* chart */
.bars{display:flex;flex-direction:column;justify-content:space-evenly}
.bars .row{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:center}
.bars .lab{font-size:22px;color:var(--dim);text-align:right}
.bars .tr{height:60px;background:var(--well);border-radius:10px;position:relative;overflow:hidden}
.bars .fill{height:100%;border-radius:10px;transition:width .7s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-family:var(--mono);font-size:22px;font-weight:800;color:#061014;min-width:100px}
.f0{background:#5a6a72}.f1{background:#4fa6b8}.f2{background:var(--snap)}.f3{background:repeating-linear-gradient(45deg,#2b4950 0 8px,#20363b 8px 16px);color:#bfe9f2!important}.f4{background:linear-gradient(90deg,var(--snap),var(--me))}
/* arch svg */
.node{fill:var(--well);stroke:var(--line);stroke-width:1.5}
.box{fill:var(--surface2);stroke-width:1.5}
.t1{fill:var(--text);font-size:17px;font-weight:700;font-family:Inter,sans-serif}
.t2{fill:var(--dim);font-size:14px;font-family:Inter,sans-serif}
.t3{fill:var(--dim);font-size:13px;font-family:Inter,sans-serif}
.bl{fill:#0a0d0b;font-size:13px;font-weight:700;font-family:Inter,sans-serif}
.st{font-size:16px;font-weight:800;font-family:Inter,sans-serif}
.chip{fill:var(--bg);stroke:var(--line)}
.barbg{fill:var(--chipbg)}
.barf{transform-box:fill-box;transform-origin:left center;transition:transform 1.6s ease}
.agent{fill:rgba(180,140,255,.08);stroke:rgba(180,140,255,.5)}
.nic{fill:rgba(118,185,0,.06);stroke:rgba(118,185,0,.45)}
.wk{fill:var(--surface);stroke-width:2;transition:all .4s}
.wk.empty{stroke:var(--dim);stroke-dasharray:5 5;fill:transparent;opacity:.6}
.wk.load{stroke:var(--stor)}.wk.ckpt{stroke:var(--pu)}.wk.rst{stroke:var(--snap)}.wk.serve{stroke:var(--me);fill:rgba(118,185,0,.07)}.wk.fail{stroke:var(--bad)}
.xmark{opacity:0;transition:opacity .4s}.xmark.on{opacity:1}
.flow{opacity:0;transition:opacity .4s}.flow.on{opacity:1}
.flow path{fill:none;stroke-width:3;stroke-dasharray:9 7;animation:dash .9s linear infinite}
.flow text{font-size:15px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:4px;font-family:Inter,sans-serif}
#f-rA path,#f-rB path,#f-rC path{stroke:var(--reqc)}#f-rA text,#f-rB text,#f-rC text{fill:var(--reqc)}
.archdesc{display:flex;flex-direction:column;justify-content:center}
.archdesc h3{font-size:32px;margin-bottom:14px}
.archdesc p,.archdesc li{font-size:24px}
.archdesc ul{padding-left:24px}.archdesc li{margin:10px 0}
/* race */
.sl{display:flex;flex-direction:column;gap:6px}
.sl label{display:flex;justify-content:space-between;font-size:21px;color:var(--dim)}.sl label b{color:var(--text);font-family:var(--mono)}
.sl input{width:100%}
.lanes{display:flex;flex-direction:column;justify-content:space-evenly}
.lane-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lane-h h4{font-size:26px}
.lane-h .tm{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:800;font-size:28px}
.lane-sub{font-size:20px;color:var(--dim);margin:2px 0 8px}
.track{position:relative;height:58px;background:var(--well);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.segs{position:absolute;inset:0}
.seg{position:absolute;top:5px;bottom:5px;border-radius:8px;font-size:18px;color:var(--ink);font-weight:700;padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;border-right:1px solid rgba(0,0,0,.3)}
.seg.r0{bottom:auto;height:calc(50% - 7px)}.seg.r1{top:auto;height:calc(50% - 7px)}

.lanes2{display:grid;grid-template-columns:150px 1fr 60px 1fr 60px 1fr;grid-template-rows:1fr 1fr;gap:24px 0;align-items:stretch}
.lanehead{display:flex;flex-direction:column;justify-content:center;font-family:var(--mono);font-weight:800;font-size:22px}

.bignum{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.03em;font-weight:800;font-size:64px;line-height:1.05;margin:2px 0 8px}

.ckc{border-radius:8px;margin:16px 0}
.ckp,.ckv,.ckr{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:6px}

.ckv.warn b,.ckr.warn b{color:var(--stor)}.ckv.keep b{color:var(--snap)}.ckv.drop b{color:var(--bad)}.ckr.me b{color:var(--me)}

function isInteractiveTarget(node) { const el = node instanceof Element ? node : null; return !!el && !!el.closest('input, textarea, select, option, [contenteditable="true"], [contenteditable=""], [role="textbox"]'); }

function stepB(dt){
  const T=B.tiles,live=B.warm?[{live:true,el:$('bLive')}]:[];
  const sources=[...live,...T.filter(t=>t.done)],load=new Map(sources.map(s=>[s,0]));
  const need=T.filter(t=>!t.done).sort((a,b)=>(b.via==='storage')-(a.via==='storage')||a.i-b.i);

    let best=null,bl=1e9;for(const s of sources){const l=load.get(s);if(l<A.fanout&&l<bl){bl=l;best=s}}
    if(best){t.via='peer';t.src=best;load.set(best,bl+1)}else if(ns<1){t.via='storage';t.src=null;ns++}else{t.via='wait';t.src=null}
  }
  const sr=ns?Math.min(BB.s,BB.agg/ns):0;
  for(const t of need){const r=t.via==='storage'?sr:t.via==='peer'?BB.r/load.get(t.src):0;const d=Math.min(t.bytes,r*dt);t.bytes-=d;if(t.via==='storage')B.stor+=d;if(t.bytes<=1e-6){t.done=true}}

    if(this.snapshotReady)return[ph('Restore process (CRIU + CUDA)',{fixed:5.6,k:'rst'}),ph('Wake: weights via ModelExpress',{bytes:m.W,weights:1,k:'wake'}),ph('Register',{fixed:SA.R,k:'reg'})];
    const a=[ph('Image pull',{fixed:pull,pull:1,k:'pull'}),ph('Weights via ModelExpress',{bytes:m.W,weights:1,k:'p2p'}),ph('Warmup + CUDA graphs',{fixed:SA.C,k:'warm'})];

  spawn(){const used=new Set(this.workers.map(w=>w.g));

  failNode(i){const n=this.nodes[i];if(n.failed)return;n.failed=true;n.repairAt=SIM.t+150;const v=this.workers.filter(w=>w.node===i);v.forEach(w=>this.remove(w));this.log(`✖ node-${i} failed, lost ${v.length} replica${v.length===1?'':'s'}`,'bad')}

  render(){const byG=new Map(this.workers.map(w=>[w.g,w]));

    q('.s3').textContent=this.unmet.toFixed(1);q('.s3').style.color=this.unmet>0.05?'var(--bad)':'var(--me)';
    q('.s4').textContent=this.mode==='base'?'n/a':this.snapshotReady?'ready':'building';
    this.logEl.innerHTML=this.events.map(e=>`<div class="${e.c}">[${e.t.toFixed(0).padStart(4)}s] ${e.m}</div>`).join('');
    const lines=[];for(const w of this.workers){if(w.state==='serving')continue;const p=w.phases[w.pi],t=this.tiles[w.g];

  drawChart(){const cv=this.chart,r={width:cv.clientWidth,height:cv.clientHeight},dpr=(window.devicePixelRatio||1)*1.5;
    if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}

    c.beginPath();c.moveTo(X(hs[0].t),Y(0));hs.forEach(h=>c.lineTo(X(h.t),Y(h.s+h.st)));c.lineTo(X(hs[hs.length-1].t),Y(0));c.fillStyle='rgba(143,155,147,.25)';c.fill();

const SPEAKER_NOTES=["<h4>1 · Title: ModelExpress + Snapshot</h4><p><strong>Key message:</strong> New inference replicas can serve in seconds instead of minutes. ModelExpress moves the weights, Snapshot skips engine startup, and together they cut time to serving by an order of magnitude.</p>\n<p><strong>Talk track</strong>\n- \"Every time we add a replica, for autoscaling, a rollout or after a node failure, it holds GPUs for minutes before it serves a single token.\"\n- Point at the chart: one new Qwen3-Next-80B replica (148 GiB) on a B200 takes <strong>180–192 s</strong> from a cold start. With Snapshot + ModelExpress it serves in <strong>14 s</strong>.\n- Agenda: Part 1 ModelExpress, Part 2 Snapshot, Part 3 the two together, including scaling and fault tolerance.</p>\n<p><strong>Numbers:</strong> 192 s = 1st replica, weights from NFS. 180 s = 2nd replica, weights P2P. 14 s = 2nd replica with Snapshot + ModelExpress. Source: internal benchmark, 1× B200, vLLM 0.27.1, Snapshot v0.1.0.</p>", "<h4>2 · The problem: two startup costs</h4><p><strong>Key message:</strong> Startup has two costs. <strong>Engine initialization</strong> is the biggest per replica and is repeated on every one. <strong>Weight reads</strong> grow with every replica you add.</p>\n<p><strong>Talk track</strong>\n- Left bar, one DeepSeek-V4-Pro replica (806 GiB, 8× B200, NFS, default loader):\n  - <strong>152 s</strong> to load weights\n  - then <strong>~12 min</strong> of JIT compile, autotuning and CUDA-graph capture\n  - <strong>14 min 43 s</strong> to serving in total\n- 83% of that time is compile work, and it's <strong>identical on every replica</strong>.\n- The two cards underneath map each cost to its fix: repeated init → Snapshot; weight reads → ModelExpress.</p>\n<p><strong>Demo (slider)</strong>\n- 1–4 replicas: loading is 17% of startup, so init dominates.\n- <strong>10 replicas:</strong> loading rises to 33%. That's 7.9 TiB read from NFS, 18.3 min to serving, and ~24 idle GPU-hours.\n- ~20 replicas: weight reads cost as much as compile. At 32 they're 62% of startup.\n- Point out that the dominant cost depends on scale and storage speed.</p>\n<p><strong>Numbers &amp; sources</strong>\n- The 1-replica numbers are measured (internal).\n- N replicas is a model: NFS ≈ 22 GiB/s split evenly. It isn't measured.\n- \"10 replicas ≈ 8 TiB of identical reads\" comes from the NVIDIA ModelExpress blog.</p>\n<p><strong>Likely questions</strong>\n- <em>\"Why not buy faster storage?\"</em> It only helps the weight part, compile is still repeated, and storage stays shared across replicas.\n- <em>\"Is this only DeepSeek?\"</em> No. Azure ran Kimi-K2.5 (591 GB) cold from Hugging Face: 29 min to API-ready, of which ~26.5 min was loading weights.</p>", "<h4>3 · Part 1: ModelExpress</h4><p><strong>Key message:</strong> Get weights from GPUs that already have them. Storage is read once per cluster, not once per replica.</p>\n<p><strong>Talk track</strong>\n- ModelExpress (MX) is Dynamo's weight-distribution service.\n- The tree shows the idea: storage is read <strong>once</strong> to seed one GPU. Every GPU that finishes loading becomes a source, so bandwidth grows as you scale: 1 → 4 → 16.\n- Transfers are GPU → GPU over NIXL/RDMA.\n- It's native in vLLM ≥ 0.23 and SGLang ≥ 0.5.13, and works with Dynamo and llm-d.</p>", "<h4>4 · How a worker gets its weights</h4><p><strong>Key message:</strong> A worker asks \"who has these weights?\". The bytes then move GPU → GPU from a peer, or stream from storage if there's no peer yet.</p>\n<p><strong>Talk track (follow the numbers)</strong>\n1. <strong>① ask:</strong> a new vLLM worker starts with <code>--load-format mx</code> (plugin <code>modelexpress</code>) and asks the ModelExpress server.\n   - The server only holds <strong>metadata</strong> and never touches the weights.\n   - Compatibility is checked with an <code>mx_source_id</code>, derived from the model plus the runtime settings that determine tensor layout.\n2. <strong>YES → ② NIXL/RDMA:</strong> a live peer GPU sends the tensors straight into the new GPU's memory. Supported networks include InfiniBand, RoCE, NVLink and EFA.\n3. <strong>NO → ② stream:</strong>\n   - ModelStreamer streams safetensors from <code>s3://</code>, <code>gs://</code>, <code>az://</code> or a PVC directly into GPU memory, never landing on disk.\n   - Local files can go disk → GPU through GPUDirect Storage.\n4. <strong>③ publish:</strong> once loaded, the worker registers itself as a source, so the pool keeps growing.</p>\n<p><strong>Fallbacks</strong>\n- No peer → storage.\n- No RDMA or shared storage → stream over gRPC (<code>MODEL_EXPRESS_NO_SHARED_STORAGE=1</code>).\n- MX tries paths in this order: P2P RDMA → ModelStreamer → GDS → default loader.</p>\n<p><strong>Numbers (public README, DeepSeek-V4-Pro, 8× B200, weight load only)</strong></p>\n<table>\n<thead>\n<tr>\n<th>Path</th>\n<th>Time</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Hugging Face cold pull</td>\n<td>8 m 53 s</td>\n</tr>\n<tr>\n<td>ModelStreamer from S3</td>\n<td>3 m 16 s</td>\n</tr>\n<tr>\n<td>Local disk</td>\n<td>1 m 10 s</td>\n</tr>\n<tr>\n<td><strong>P2P</strong></td>\n<td><strong>11 s (48×)</strong></td>\n</tr>\n</tbody>\n</table>", "<h4>5 · Fan-out demo</h4><p><strong>Key message:</strong> With storage only, N replicas mean N× the reads sharing one bandwidth. With ModelExpress, one seed reads storage and peers feed peers. When scaling out next to a live replica, storage isn't touched at all.</p>\n<p><strong>Demo</strong>\n1. Click <strong>Storage only → Launch</strong>. 16 replicas of Qwen3-Next-80B (148 GiB) load from NFS (22 GiB/s shared, ~5.2 GiB/s per pod). Note the time and the <strong>~2,368 GiB</strong> read.\n2. Click <strong>ModelExpress → Launch</strong>. One seed loads from NFS (~28 s), then the green P2P lines take over, with up to 4 pulls per source NIC. Storage read: <strong>148 GiB</strong>.\n3. Tick <strong>\"1 replica already serving\" → Launch</strong>. Everything comes from peers and <strong>0 GiB</strong> is read from storage.</p>\n<p><strong>Caveat:</strong> the rates come from internal 80B runs (NFS load ≈ 28.5 s, P2P ≈ 8.4 s per replica). The topology and the 4-pulls-per-source limit are a simplified model, not a benchmark.</p>", "<h4>6 · ModelExpress scope</h4><p><strong>Key message:</strong> P2P makes weights fast, but on its own it saves only ~6%, because engine initialization dominates.</p>\n<p><strong>Talk track</strong>\n- Measured on Qwen3-Next-80B, 1× B200, no snapshot:\n  - 1st replica (weights from NFS via MX): <strong>192 s</strong>\n  - 2nd replica (weights P2P): <strong>180 s</strong>\n- Only 12 s is saved.\n- <strong>Solved:</strong> N reads become 1, GPU→GPU over RDMA, storage → GPU directly.\n- <strong>Remains:</strong> engine init on every replica, the image pull on new nodes, and registration.\n- <strong>Nuance (public blog):</strong> MX can also copy <strong>JIT kernel caches</strong> (Triton, DeepGEMM, TileLang, FlashInfer) between replicas. That took DeepSeek-V4-Pro from 8 min to 1 min 44 s. CUDA-graph capture and the rest of engine startup still run.\n- Transition: \"What if the new replica didn't initialize at all?\" → Snapshot.</p>", "<h4>7 · Part 2: Snapshot</h4><p><strong>Key message:</strong> Checkpoint a fully warmed-up worker once, GPU state included, and restore it on any compatible node in seconds.</p>\n<p><strong>Talk track</strong>\n- Dynamo Snapshot is checkpoint/restore for GPU inference workers on Kubernetes.\n- It's built on <strong>CRIU</strong> (Linux process checkpointing) and NVIDIA's <strong>cuda-checkpoint</strong> (GPU state).\n- Status: experimental.</p>", "<h4>8 · How Snapshot works on Kubernetes</h4><p><strong>Key message:</strong> Checkpoint on one node, restore on any node. A per-node agent does all the work from the host.</p>\n<p><strong>Talk track (follow the numbers)</strong>\n1. <strong>① Engine init:</strong> the worker pod starts normally: loads weights, compiles kernels, captures CUDA graphs.\n2. <strong>② ready-for-checkpoint:</strong> <em>before</em> joining the Dynamo runtime, the worker writes a signal file (used as its readiness probe) and waits in a polling loop.\n3. <strong>③ snapshot-agent</strong> (a privileged DaemonSet, installed with Helm, on every node) runs:\n   - <strong>cuda-checkpoint</strong>, which copies GPU state into host memory\n   - <strong>CRIU</strong>, which dumps the process tree to files, plus the container's overlay filesystem\n   - It then <strong>writes</strong> the image to shared storage (PVC/NFS).\n4. <strong>④ read:</strong> on Node B, the agent reads the image and starts a lightweight <strong>placeholder pod</strong>.\n5. <strong>⑤ restore:</strong> the agent restores the overlay filesystem, the CRIU process and the CUDA state into that pod.\n6. <strong>⑥ restore-complete → register:</strong> the worker resumes <strong>at the exact instruction</strong> it paused on, sees the signal, connects to the control plane and registers. The router starts sending traffic.</p>\n<p><strong>Why it's designed this way</strong>\n- <strong>Clean image:</strong> checkpointing before joining the cluster means no TCP or RDMA connections are captured, since those can't survive a move to a new pod IP.\n- <strong>Portable:</strong> the image lives in shared storage, not on the node.\n- <strong>Non-invasive:</strong> no runc changes, and no reliance on Kubernetes checkpoint feature gates.</p>\n<p><strong>Likely questions</strong>\n- <em>\"Can it restore on any GPU?\"</em> Only on compatible nodes (same GPU type and driver stack).\n- <em>\"Driver requirements?\"</em> For the best performance on large models the Snapshot team recommends a newer user-mode driver (r615). Check with them for your cluster.</p>", "<h4>9 · What Snapshot saves (on its own)</h4><p><strong>Key message:</strong> Snapshot keeps the expensive part, the warm engine. Without changes, though, the weights fill the checkpoint.</p>\n<p><strong>Talk track (row by row)</strong>\n- <strong>Compiled engine</strong> (CUDA context, kernels, CUDA graphs): <strong>kept</strong>, restored as-is, no recompiling. This is the big win.\n- <strong>KV cache</strong> (~25 GiB): <strong>dropped</strong>. Its memory is freed through CUDA virtual memory management, but the <em>virtual address</em> is kept, so captured CUDA graphs stay valid. It's re-allocated at wake.\n- <strong>Model weights</strong> (148 GiB): <strong>kept</strong>. With vLLM sleep level 1 they're copied to host RAM and saved with the process.</p>\n<p><strong>Numbers (Qwen3-Next-80B, 2nd replica, internal)</strong>\n- Checkpoint: <strong>160 GiB</strong>, ~93% of it weights.\n- Restore: <strong>30.5 s</strong> (CRIU 14.9 s + CUDA 12.6 s + wake 3.0 s), vs 180 s cold, which is <strong>5.9×</strong>.</p>\n<p><strong>Point to make:</strong> every restore reads the full 160 GiB from the shared store. That's the same storage fan-out problem as slide 2, just moved.</p>\n<p><strong>Footnote:</strong> NVIDIA's CRIU optimizations (parallel reads + parallel restore of large buffers) make restore up to 7.9× faster than upstream CRIU (gpt-oss-120b, public blog). They're pending upstream.</p>\n<p><strong>Transition:</strong> \"What if we drop the weights from the checkpoint too, and let ModelExpress bring them back?\"</p>", "<h4>10 · Part 3: Together</h4><p><strong>Key message:</strong> Drop the weights from the checkpoint. On wake, ModelExpress brings them back GPU → GPU from a live replica.</p>\n<p><strong>Talk track</strong>\n- The process comes from the snapshot store (~6 s).\n- The weights come from a peer GPU (~8 s).\n- Result: <strong>14 s vs 180 s</strong> for an 80B model.</p>", "<h4>11 · Step-by-step demo (Snapshot + ModelExpress)</h4><p><strong>Key message:</strong> Restore the small engine image, then wake and pull the weights from a peer.</p>\n<p><strong>Demo:</strong> keep <strong>\"Weights: via MX (sleep L2)\"</strong> selected and click through the six steps. Then flip the toggle to sleep L1 to show the contrast.</p>\n<ol>\n<li><strong>Init:</strong> same as a cold start, done <strong>once</strong>.</li>\n<li><strong>Sleep (level 2):</strong> vLLM drops the weights and the KV cache. Only the engine state remains.</li>\n<li><strong>cuda-checkpoint:</strong> GPU state is copied into host memory, with no weights to copy.</li>\n<li><strong>CRIU dump:</strong> only the engine is written, <strong>9.4 GiB</strong> (vs 160 GiB at level 1).</li>\n<li><strong>Restore on Node B:</strong> CRIU 3.5 s + CUDA restore 2.1 s. No recompiling.</li>\n<li><strong>Wake:</strong> the KV cache is re-allocated, and ModelExpress loads the weights <strong>P2P in 8.4 s</strong> (26.8 s from NFS if no peer exists). Total <strong>≈ 14 s</strong>.</li>\n</ol>\n<p>The chips show <strong>9.4 GiB</strong> dump, <strong>14.0 s</strong> restore and <strong>0 s</strong> engine init.</p>", "<h4>12 · Measured: 180 s → 14 s</h4><p><strong>Key message:</strong> Combined, a new replica is serving <strong>12.9× faster</strong> than a cold start.</p>\n<p><strong>Demo:</strong> click <strong>Run race</strong>, then switch between <strong>1st (no peer)</strong> and <strong>2nd (peer live)</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Path</th>\n<th>2nd replica</th>\n<th>1st replica</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cold start, no snapshot</td>\n<td>180.4 s</td>\n<td>192.2 s</td>\n</tr>\n<tr>\n<td>Snapshot, weights in dump (sleep L1, 160 GiB)</td>\n<td>30.5 s (5.9×)</td>\n<td>33.4 s</td>\n</tr>\n<tr>\n<td><strong>Snapshot + ModelExpress</strong> (sleep L2, 9.4 GiB)</td>\n<td><strong>14.0 s (12.9×)</strong></td>\n<td>31.7 s (weights from NFS)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Point to make:</strong> the very first replica gains little from ModelExpress, because there's no peer yet. The big win comes once any replica is serving, which is exactly the scale-out and recovery case. A \"hybrid\" strategy (first replica from a full dump, later replicas via P2P) is planned.</p>\n<p><strong>Setup:</strong> 1× B200 per replica, NFS ≈ 22 GiB/s, Snapshot v0.1.0, vLLM 0.27.1.</p>\n<p><strong>Likely question:</strong> <em>\"What about much bigger models?\"</em> A multi-GPU DeepSeek-V4-Pro Snapshot + MX benchmark is in progress (NScale cluster).</p>", "<h4>13 · In the data center: seed → checkpoint → serve → scale → recover</h4><p><strong>Key message:</strong> The same fast path covers the first deployment, scale-out and failure recovery.</p>\n<p><strong>Talk track (use Next or Auto-play)</strong>\n1. <strong>① Seed:</strong> the first replica loads weights from NFS via MX and registers as a source. This is the only full storage read.\n2. <strong>② Checkpoint:</strong> once per model × engine config × GPU type (for example in CI). Sleep level 2 → a 9.4 GiB image in shared storage.\n3. <strong>③ Serve:</strong> the seed serves traffic and is also the weight source.\n4. <strong>④ Scale out:</strong> the process is restored from the snapshot (~6 s) and the weights are pulled from Node A over RDMA (8.4 s): <strong>14 s</strong>.\n5. <strong>⑤ Node A fails:</strong>\n   - The router moves traffic to B.\n   - Node C restores from the shared snapshot and pulls weights from <strong>B</strong>.\n   - Capacity is back in seconds.\n6. <strong>⑥ Why both:</strong> MX alone 180 s · Snapshot alone 31 s · together <strong>14 s</strong>.</p>\n<p><strong>Point to make:</strong> there's no single point of failure. The snapshot is in shared storage, any live replica can be a weight source, and storage remains the fallback.</p>", "<h4>14 · Simulator: spike it, break it</h4><p><strong>Key message:</strong> At cluster scale, faster startup means smaller capacity gaps during spikes and failures, and fewer GPU-seconds wasted starting up.</p>\n<p><strong>Demo</strong>\n1. Let the initial deployment run. Average time to serving is about <strong>~210 s</strong> for the baseline vs <strong>~50 s</strong> for MX + Snapshot. The first replica seeds from NFS, so the combined side isn't instant at deploy.\n2. Click <strong>Traffic spike</strong>. The baseline capacity gap lasts about <strong>~4 min</strong>; MX + Snapshot closes it in <strong>~20 s</strong>.\n3. Click <strong>Fail a node</strong>. The baseline takes <strong>~3 min</strong> to recover vs <strong>~15 s</strong>.\n4. Optional: untick <strong>Snapshot pre-built</strong> and <strong>Reset</strong> to show the very first rollout, where the checkpoint is created.</p>\n<p><strong>Model:</strong>\n- 2 clusters × 4 nodes × 8 GPUs, one replica per GPU.\n- The planner targets ⌈demand × 1.1⌉.\n- Baseline: cold start ≈ 192 s with NFS contention.\n- Combined: process restore 5.6 s + weights P2P (≤ 4 pulls per source), or from NFS when there's no peer.\n- Calibrated to the 80B measurements. Results are directional, not a benchmark.</p>", "<h4>15 · Adoption path</h4><p><strong>Key message:</strong> Two short lanes: deploy ModelExpress, deploy Snapshot, then measure.</p>\n<p><strong>ModelExpress lane</strong>\n1. Deploy the MX server and set <code>dynamo-operator.modelExpressURL</code>. The operator injects <code>MODEL_EXPRESS_URL</code> into worker pods.\n2. Workers use <code>--load-format mx</code> (<code>VLLM_PLUGINS=modelexpress</code>). Seed from object storage with <code>MX_MODEL_URI=s3://…</code>.\n3. Provide an RDMA/NVLink fabric for NIXL. Without it, use the gRPC fallback.</p>\n<p><strong>Snapshot lane</strong>\n4. <code>helm install</code> the snapshot-agent DaemonSet on GPU nodes, and provide fast shared storage for images.\n5. Build checkpoints once per model × engine config × GPU type, using <strong>sleep level 2</strong> so the weights aren't in the image. CI is a good place.\n6. Measure time to serving, the capacity gap during spikes and node loss, and storage bytes per rollout.</p>\n<p><strong>Status box</strong>\n- Snapshot is experimental: single node, single- and multi-GPU.\n- Snapshot + MX has been tested internally on single-GPU vLLM.\n- Roadmap: multi-node, and GMS parallel weight restore. TensorRT-LLM support is also in progress.</p>", "<h4>16 · Takeaways</h4><p><strong>Key message:</strong> Cold start is two problems. Solve both and every startup path gets fast.</p>\n<ul>\n<li><strong>ModelExpress, 1×:</strong> one storage read per cluster. Weights flow GPU → GPU from whoever already has them.</li>\n<li><strong>Snapshot, 0 s:</strong> engine warmup on restore. Init runs once, and every later replica resumes warm.</li>\n<li><strong>Together, 14 s:</strong> to serving for an 80B model, vs 180 s. One fast path for cold start, scale-out and recovery.</li>\n<li><strong>Close:</strong> suggest trying it on your models. Bigger-model results (DeepSeek-V4-Pro, multi-GPU) are coming.</li>\n</ul>\n<p><strong>Sources</strong>\n- <a href=\"https://developer.nvidia.com/blog/nvidia-dynamo-snapshot-fast-startup-for-inference-workloads-on-kubernetes/\">NVIDIA Dynamo Snapshot blog</a>\n- <a href=\"https://developer.nvidia.com/blog/modelexpress-distributing-model-artifacts-at-the-speed-of-light/\">ModelExpress blog</a>\n- <a href=\"https://github.com/ai-dynamo/modelexpress#benchmarks\">ModelExpress README benchmarks</a>\n- <a href=\"https://docs.nvidia.com/dynamo/v1.3.0/kubernetes-deployment/model-loading/model-express.md\">Dynamo docs: ModelExpress</a>\n- <a href=\"https://docs.nvidia.com/dynamo/latest/kubernetes-deployment/deployment-guide/snapshot.md\">Dynamo docs: Snapshot</a></p>"];

(function(){
  const root=document.documentElement,btn=$('themeBtn');
  let t='light';try{t=localStorage.getItem('dynamo-deck-theme')||'light'}catch(_){}
  const apply=v=>{root.classList.toggle('light',v==='light');btn.textContent=v==='light'?'☾ Dark':'☀ Light';try{localStorage.setItem('dynamo-deck-theme',v)}catch(_){}};
  apply(t);
  btn.onclick=()=>apply(root.classList.contains('light')?'dark':'light');
  document.addEventListener('keydown',e=>{if((e.key==='t'||e.key==='T')&&!isInteractiveTarget(e.target))btn.click()});
})();
