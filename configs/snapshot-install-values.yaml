global:
  snapshot:
    install: true
dynamo-operator:
  checkpoint:
    enabled: true
snapshot:
  storage:
    pvc:
      create: false
      name: snapshot-artifacts
  daemonset:
    nodeSelector:
      kubernetes.io/hostname: kubecon-nke-site-cp-0124
      nvidia.com/gpu.present: 'true'
    resources:
      requests:
        cpu: '2'
        memory: 1Gi
      limits:
        cpu: '4'
        memory: 16Gi
  image:
    operator:
      repository: ghcr.io/ai-dynamo/snapshot/operator
      tag: v0.1.0@sha256:67aeb508f5b396c1615d3d782d10930cd74749333d739fa44c1643eea69b1722
    agent:
      repository: ghcr.io/ai-dynamo/snapshot/agent
      tag: v0.1.0@sha256:973e93dfd2388f3bcba6099de8c4c806262690d23077fd1042b87391bcdd80ff
