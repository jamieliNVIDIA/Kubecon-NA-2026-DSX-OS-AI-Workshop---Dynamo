dcgmExporter:
  annotations: {}
  config:
    create: true
    data: '# Clocks,,

      DCGM_FI_DEV_SM_CLOCK,     gauge, SM clock frequency (in MHz).

      DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).


      # Temperature,,

      DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).

      DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).


      # Power,,

      DCGM_FI_DEV_POWER_USAGE,  gauge, Power draw (in W).

      DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since
      boot (in mJ).


      # PCIe,,

      DCGM_FI_PROF_PCIE_TX_BYTES,  counter, Total number of bytes transmitted through
      PCIe TX (in KB) via NVML.

      DCGM_FI_PROF_PCIE_RX_BYTES,  counter, Total number of bytes received through
      PCIe RX (in KB) via NVML.

      DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries.


      # Utilization (the sample period varies depending on the product),,

      DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).

      DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).

      DCGM_FI_DEV_ENC_UTIL,      gauge, Encoder utilization (in %).

      DCGM_FI_DEV_DEC_UTIL,      gauge, Decoder utilization (in %).


      # Errors and violations,,

      DCGM_FI_DEV_XID_ERRORS,            gauge, Value of the last XID error encountered.

      DCGM_FI_DEV_POWER_VIOLATION,       counter, Throttling duration due to power
      constraints (in us).

      DCGM_FI_DEV_THERMAL_VIOLATION,     counter, Throttling duration due to thermal
      constraints (in us).

      DCGM_FI_DEV_SYNC_BOOST_VIOLATION,  counter, Throttling duration due to sync-boost
      constraints (in us).

      DCGM_FI_DEV_BOARD_LIMIT_VIOLATION, counter, Throttling duration due to board
      limit constraints (in us).

      DCGM_FI_DEV_LOW_UTIL_VIOLATION,    counter, Throttling duration due to low utilization
      (in us).

      DCGM_FI_DEV_RELIABILITY_VIOLATION, counter, Throttling duration due to reliability
      constraints (in us).


      # Memory usage,,

      DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).

      DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).


      # Retired pages,,

      DCGM_FI_DEV_RETIRED_SBE,     counter, Total number of retired pages due to single-bit
      errors.

      DCGM_FI_DEV_RETIRED_DBE,     counter, Total number of retired pages due to double-bit
      errors.

      DCGM_FI_DEV_RETIRED_PENDING, counter, Total number of pages pending retirement.


      # NVLink,,

      DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, counter, Total number of NVLink bandwidth
      counters for all lanes

      DCGM_FI_PROF_NVLINK_TX_BYTES,       counter, The rate of data transmitted over
      NVLink not including protocol headers in bytes per second.

      DCGM_FI_PROF_NVLINK_RX_BYTES,       counter, The rate of data received over
      NVLink not including protocol headers in bytes per second.


      # Add DCP metrics,,

      DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge, Ratio of time the graphics engine is
      active (in %).

      DCGM_FI_PROF_SM_ACTIVE,          gauge, The ratio of cycles an SM has at least
      1 warp assigned (in %).

      DCGM_FI_PROF_SM_OCCUPANCY,       gauge, The ratio of number of warps resident
      on an SM (in %).

      DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe
      is active (in %).

      DCGM_FI_PROF_DRAM_ACTIVE,        gauge, Ratio of cycles the device memory interface
      is active sending or receiving data (in %).

      DCGM_FI_PROF_PCIE_TX_BYTES,      counter, The number of bytes of active pcie
      tx data including both header and payload.

      DCGM_FI_PROF_PCIE_RX_BYTES,      counter, The number of bytes of active pcie
      rx data including both header and payload.


      # BCP Additional metrics

      DCGM_FI_DEV_GPU_NVLINK_ERRORS,      gauge, Identifies a GPU NVLink error type
      returned by DCGM_FI_DEV_GPU_NVLINK_ERRORS.


      # Added RunAI Additional metrics https://docs.run.ai/latest/developer/metrics/metrics-api/#advanced-metrics

      ## NVLink

      DCGM_FI_DEV_NVLINK_BANDWIDTH_L0, counter, The number of bytes of active NVLink
      rx or tx data including both header and payload.

      ## VGPU License status

      DCGM_FI_DEV_VGPU_LICENSE_STATUS, gauge, vGPU License status

      ## Remapped rows

      DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for
      uncorrectable errors

      DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for
      correctable errors

      DCGM_FI_DEV_ROW_REMAP_FAILURE, gauge, Whether remapping of rows has failed

      ## Static configuration information. These appear as labels on the other metrics

      DCGM_FI_DRIVER_VERSION, label, Driver Version

      ## Profiling metrics

      DCGM_FI_PROF_PIPE_FP64_ACTIVE, gauge, Ratio of cycles the fp64 pipes are active
      (in %).

      DCGM_FI_PROF_PIPE_FP32_ACTIVE, gauge, Ratio of cycles the fp32 pipes are active
      (in %).

      DCGM_FI_PROF_PIPE_FP16_ACTIVE, gauge, Ratio of cycles the fp16 pipes are active
      (in %).

      '
    name: dcgm-exporter
  enablePodLabels: false
  enablePodUID: false
  enabled: true
  env: []
  hostNetwork: false
  hostPID: false
  image: dcgm-exporter
