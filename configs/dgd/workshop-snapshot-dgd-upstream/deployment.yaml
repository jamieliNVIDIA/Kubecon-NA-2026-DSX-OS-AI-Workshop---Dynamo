apiVersion: v1
kind: List
items:
- apiVersion: resource.k8s.io/v1
  kind: ResourceClaimTemplate
  metadata:
    name: ft-snapshot-snapshot-gpus
    namespace: dynamo-ft-20261104t221053z
    labels:
      app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
      feature-test-run: dynamo-ft-20261104t221053z
  spec:
    spec:
      devices:
        requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            count: 2
            selectors:
            - cel:
                expression: device.driver == "gpu.nvidia.com" && has(device.attributes["gpu.nvidia.com"].uuid)
                  && device.attributes["gpu.nvidia.com"].uuid in ["GPU-ce4aaec3-4fd1-f047-a303-80986bc29110",
                  "GPU-75461e0d-6588-94c9-2517-dca859f5c68b"]
- apiVersion: nvidia.com/v1beta1
  kind: DynamoGraphDeployment
  metadata:
    name: ft-snapshot
    namespace: dynamo-ft-20261104t221053z
    labels:
      app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
      feature-test-run: dynamo-ft-20261104t221053z
    annotations:
      nvidia.com/enable-grove: 'false'
  spec:
    backendFramework: vllm
    components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
          - name: main
            image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
            imagePullPolicy: IfNotPresent
            command:
            - python3
            - -m
            - dynamo.frontend
            args:
            - --router-mode
            - round-robin
            - --trust-remote-code
            env:
            - name: HF_HOME
              value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
            - name: HF_HUB_OFFLINE
              value: '1'
            - name: HF_HUB_DISABLE_XET
              value: '1'
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
            - name: TRITON_CACHE_DIR
              value: /tmp/triton
            - name: NCCL_IB_DISABLE
              value: '1'
            - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
              value: '180'
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            resources:
              requests:
                cpu: '1'
                memory: 4Gi
              limits:
                memory: 8Gi
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              periodSeconds: 10
              timeoutSeconds: 60
              failureThreshold: 60
            volumeMounts:
            - name: cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
          volumes:
          - name: cache
            persistentVolumeClaim:
              claimName: feature-cache
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          imagePullSecrets:
          - name: common-runtime-pull
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: kubecon-nke-site-cp-0124
        metadata:
          labels:
            app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
            feature-test-run: dynamo-ft-20261104t221053z
      runtimeVersionOverride: 1.6.0
    - name: VllmSnapshotWorker
      type: worker
      replicas: 1
      sharedMemorySize: 16Gi
      podTemplate:
        spec:
          tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: 'true'
            effect: NoSchedule
          volumes:
          - name: cache
            persistentVolumeClaim:
              claimName: feature-cache
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          - name: snapshot-runtime
            configMap:
              name: snapshot-dgd-upstream-kv-v1
          containers:
          - name: main
            image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
            imagePullPolicy: IfNotPresent
            workingDir: /workspace/
            command:
            - python3
            - -m
            - dynamo.vllm
            args:
            - --model
            - nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
            - --revision
            - 8a115b9d966adce8c059a7bcf47f49a1e57957d8
            - --served-model-name
            - nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
            - --trust-remote-code
            - --tensor-parallel-size
            - '2'
            - --max-model-len
            - '8192'
            - --max-num-seqs
            - '4'
            - --max-num-batched-tokens
            - '8192'
            - --gpu-memory-utilization
            - '0.65'
            - --enable-prefix-caching
            - --block-size
            - '64'
            - --mamba-backend
            - flashinfer
            - --mamba-ssm-cache-dtype
            - float16
            - --mamba-cache-mode
            - align
            - --reasoning-parser
            - nemotron_v3
            - --disaggregation-mode
            - agg
            - --language-model-only
            env:
            - name: HF_HOME
              value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
            - name: HF_HUB_OFFLINE
              value: '1'
            - name: HF_HUB_DISABLE_XET
              value: '1'
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
            - name: TRITON_CACHE_DIR
              value: /tmp/triton
            - name: NCCL_IB_DISABLE
              value: '1'
            - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
              value: '180'
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            - name: NCCL_RAS_ENABLE
              value: '0'
            - name: TORCH_NCCL_ENABLE_MONITORING
              value: '0'
            - name: TORCH_NCCL_DUMP_ON_TIMEOUT
              value: '0'
            - name: VLLM_NO_USAGE_STATS
              value: '1'
            resources:
              requests:
                cpu: '8'
                memory: 256Gi
              limits:
                memory: 512Gi
              claims:
              - name: gpu-main
            securityContext:
              runAsUser: 0
              capabilities:
                add:
                - IPC_LOCK
                - SYS_RESOURCE
            startupProbe:
              httpGet:
                path: /live
                port: 9090
              periodSeconds: 30
              timeoutSeconds: 20
              failureThreshold: 120
            volumeMounts:
            - name: cache
              mountPath: /model-cache
            - name: shm
              mountPath: /dev/shm
            - name: snapshot-runtime
              mountPath: /usr/local/lib/python3.12/dist-packages/dynamo/vllm/snapshot.py
              subPath: snapshot.py
              readOnly: true
          imagePullSecrets:
          - name: common-runtime-pull
          runtimeClassName: nvidia
          nodeSelector:
            kubernetes.io/hostname: kubecon-nke-site-cp-0124
          securityContext:
            seccompProfile:
              type: Localhost
              localhostProfile: profiles/block-iouring.json
          resourceClaims:
          - name: gpu-main
            resourceClaimTemplateName: ft-snapshot-snapshot-gpus
        metadata:
          labels:
            app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
            feature-test-run: dynamo-ft-20261104t221053z
          annotations:
            nvidia.com/snapshot-multi-gpu: enabled
      runtimeVersionOverride: 1.6.0
      experimental:
        checkpoint:
          enabled: true
          startupPolicy: WaitForCheckpoint
          deletionPolicy: Retain
          job:
            podTemplate:
              spec:
                containers:
                - name: capture-keepalive
                  image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
                  command:
                  - /bin/sh
                  - -c
                  - trap 'exit 0' TERM INT; while [ ! -f /tmp/finish-source ]; do
                    sleep 2 & wait "$!"; done
                  env:
                  - name: NVIDIA_VISIBLE_DEVICES
                    value: void
                  - name: SNAPSHOT_JOB_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.labels['nvidia.com/snapshot-job']
                  resources:
                    requests:
                      cpu: 25m
                      memory: 16Mi
                    limits:
                      memory: 64Mi
