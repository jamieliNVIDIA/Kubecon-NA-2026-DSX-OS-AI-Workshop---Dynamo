        nodeSelector:
          kubernetes.io/hostname: kubecon-nke-site-cp-0124
      metadata:
        labels:
          app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
          feature-test-run: dynamo-ft-20261014t205730z
        annotations:
          workshop.nvidia.com/shadow-gms-compat-sha256: 8f75223bc5856a4cca206d416607d2807d985857b3d181938d9c1529c3d8f422
    replicas: 1
    type: worker
    runtimeVersionOverride: 1.6.0
    sharedMemorySize: 16Gi
  backendFramework: vllm
