            readOnly: true
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm-cache
          - name: TRITON_CACHE_DIR
            value: /tmp/triton-cache
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: PYTHONHASHSEED
            value: '0'
