apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ft-sidecar
  namespace: dynamo-ft-20261013t182006z
  labels:
    app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
    feature-test-run: dynamo-ft-20261013t182006z
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --trust-remote-code
          resources:
            requests:
              cpu: '1'
              memory: 4Gi
            limits:
              memory: 8Gi
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          - name: NVIDIA_VISIBLE_DEVICES
            value: void
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
          - name: dshm
            mountPath: /dev/shm
        imagePullSecrets:
        - name: common-runtime-pull
        activeDeadlineSeconds: 2700
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
    runtimeVersionOverride: 1.6.0
  - name: worker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        initContainers:
        - name: runtime
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          command:
          - dynamo-vllm-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:50051
          restartPolicy: Always
          resources:
            requests:
              cpu: '1'
              memory: 1Gi
            limits:
              memory: 4Gi
          securityContext:
            runAsUser: 0
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
          env:
          - name: DYN_NAMESPACE
            value: dynamo-ft-20261013t182006z-ft-sidecar
          - name: DYN_DISCOVERY_BACKEND
            value: kubernetes
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_SYSTEM_PORT
            value: '9090'
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NVIDIA_VISIBLE_DEVICES
            value: void
        containers:
        - name: main
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          startupProbe:
            grpc:
              port: 50051
              service: ''
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            grpc:
              port: 50051
              service: ''
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            grpc:
              port: 50051
              service: ''
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: '4'
              memory: 64Gi
              nvidia.com/gpu: '1'
            limits:
              memory: 128Gi
              nvidia.com/gpu: '1'
          command:
          - bash
          - -ec
          args:
          - exec "$(python3 -c 'import os,vllm; print(os.path.join(os.path.dirname(vllm.__file__),
            "vllm-rs"))')" "$@"
          - engine
          - serve
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --revision
          - bee7596271d1495f6992ae224aefde4410e816b8
          - --served-model-name
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --host
          - 0.0.0.0
          - --grpc-port
          - '50051'
          - --trust-remote-code
          - --tensor-parallel-size
          - '1'
          - --max-model-len
          - '4096'
          - --max-num-seqs
          - '8'
          - --gpu-memory-utilization
          - '0.65'
          - --mamba-backend
          - flashinfer
          - --mamba-ssm-cache-dtype
          - float16
          - --mamba-cache-mode
          - align
          - --reasoning-parser
          - nemotron_v3
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
          - name: dshm
            mountPath: /dev/shm
        imagePullSecrets:
        - name: common-runtime-pull
        activeDeadlineSeconds: 2700
        nodeSelector:
          kubernetes.io/hostname: kubecon-nke-site-cp-0942
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
    runtimeVersionOverride: 1.6.0
    sharedMemorySize: 16Gi
  backendFramework: vllm
