apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ft-kvcr
  namespace: dynamo-ft-20261013t182006z
  labels:
    app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
    feature-test-run: dynamo-ft-20261013t182006z
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --router-mode
          - kv
          - --trust-remote-code
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: NVIDIA_VISIBLE_DEVICES
            value: void
          - name: TEST_RUN
            value: 20261013t023201z-features
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
            value: '1'
          - name: VLLM_LOGGING_LEVEL
            value: DEBUG
          - name: NIXL_LOG_LEVEL
            value: INFO
          - name: FI_PROVIDER
            value: efa
          - name: FI_EFA_USE_DEVICE_RDMA
            value: '1'
          - name: FI_EFA_FORK_SAFE
            value: '1'
          - name: FI_EFA_ENABLE_SHM_TRANSFER
            value: '0'
          - name: FI_HMEM_CUDA_USE_DMABUF
            value: '1'
          resources:
            requests:
              cpu: '1'
              memory: 4Gi
            limits:
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 60
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
          - name: dshm
            mountPath: /dev/shm
          - name: kvcr
            mountPath: /kvcr
            readOnly: true
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: kvcr
          configMap:
            name: kvcr-runtime
        imagePullSecrets:
        - name: common-runtime-pull
        activeDeadlineSeconds: 3600
    runtimeVersionOverride: 1.6.0
  - name: agg
    type: worker
    replicas: 2
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-H100-80GB-HBM3
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  feature-test-role: kvcr
              topologyKey: kubernetes.io/hostname
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: kvcr
          configMap:
            name: kvcr-runtime
        - name: efa
          configMap:
            name: efa-userspace
        containers:
        - name: main
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/
          command:
          - bash
          - /efa/entrypoint.sh
          args:
          - python3
          - /kvcr/worker.py
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: TEST_RUN
            value: 20261013t023201z-features
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: VLLM_KV_EVENTS_USE_INT_BLOCK_HASHES
            value: '1'
          - name: VLLM_LOGGING_LEVEL
            value: DEBUG
          - name: NIXL_LOG_LEVEL
            value: INFO
          - name: FI_PROVIDER
            value: efa
          - name: FI_EFA_USE_DEVICE_RDMA
            value: '1'
          - name: FI_EFA_FORK_SAFE
            value: '1'
          - name: FI_EFA_ENABLE_SHM_TRANSFER
            value: '0'
          - name: FI_HMEM_CUDA_USE_DMABUF
            value: '1'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '180'
          resources:
            requests:
              cpu: '4'
              memory: 64Gi
              nvidia.com/gpu: '1'
              vpc.amazonaws.com/efa: '4'
            limits:
              memory: 128Gi
              nvidia.com/gpu: '1'
              vpc.amazonaws.com/efa: '4'
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 120
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
          - name: dshm
            mountPath: /dev/shm
          - name: kvcr
            mountPath: /kvcr
            readOnly: true
          - name: efa
            mountPath: /efa
            readOnly: true
        imagePullSecrets:
        - name: common-runtime-pull
        activeDeadlineSeconds: 3600
      metadata:
        labels:
          feature-test-role: kvcr
    runtimeVersionOverride: 1.6.0
