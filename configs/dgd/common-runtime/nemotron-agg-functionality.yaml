apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ft-agg
  namespace: dynamo-ft-20261013t182006z
  labels:
    app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
    feature-test-run: dynamo-ft-20261013t182006z
spec:
  backendFramework: vllm
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          imagePullPolicy: IfNotPresent
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --router-mode
          - kv
          - --kv-cache-block-size
          - '64'
          - --trust-remote-code
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: NVIDIA_VISIBLE_DEVICES
            value: void
          resources:
            requests:
              cpu: '1'
              memory: 4Gi
            limits:
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 60
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
          - name: dshm
            mountPath: /dev/shm
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        imagePullSecrets:
        - name: common-runtime-pull
        activeDeadlineSeconds: 3600
    runtimeVersionOverride: 1.6.0
  - name: agg
    type: worker
    replicas: 2
    sharedMemorySize: 16Gi
    podTemplate:
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-H100-80GB-HBM3
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  feature-test-role: agg
              topologyKey: kubernetes.io/hostname
        tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: 'true'
          effect: NoSchedule
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        containers:
        - name: main
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
          - --model
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --revision
          - bee7596271d1495f6992ae224aefde4410e816b8
          - --served-model-name
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --trust-remote-code
          - --tensor-parallel-size
          - '1'
          - --max-model-len
          - '4096'
          - --max-num-seqs
          - '8'
          - --max-num-batched-tokens
          - '8192'
          - --gpu-memory-utilization
          - '0.65'
          - --enable-prefix-caching
          - --block-size
          - '64'
          - --mamba-backend
          - flashinfer
          - --mamba-ssm-cache-dtype
          - float16
          - --mamba-cache-mode
          - align
          - --reasoning-parser
          - nemotron_v3
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
          - --disaggregation-mode
          - agg
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013t023201z-features/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '180'
          resources:
            requests:
              cpu: '4'
              memory: 64Gi
              nvidia.com/gpu: '1'
            limits:
              memory: 128Gi
              nvidia.com/gpu: '1'
          securityContext:
            runAsUser: 0
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
          startupProbe:
            httpGet:
              path: /live
              port: 9090
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 120
          volumeMounts:
          - name: shared-model-cache
            mountPath: /model-cache
          - name: dshm
            mountPath: /dev/shm
        imagePullSecrets:
        - name: common-runtime-pull
        activeDeadlineSeconds: 3600
      metadata:
        labels:
          feature-test-role: agg
    runtimeVersionOverride: 1.6.0
