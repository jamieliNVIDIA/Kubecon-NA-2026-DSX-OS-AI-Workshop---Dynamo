apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  annotations:
    nvidia.com/current-worker-hash-v2: e67d129f
    nvidia.com/dynamo-operator-origin-version: 1.5.1
    nvidia.com/workload-provider: grove
  labels:
    app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
    feature-test-run: dynamo-ft-r610-d906a5f1-sidecar
  name: ft-sidecar
  namespace: dynamo-ft-r610-d906a5f1-sidecar
spec:
  backendFramework: vllm
  components:
  - minAvailable: 1
    name: Frontend
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
          feature-test-run: dynamo-ft-r610-d906a5f1-sidecar
      spec:
        activeDeadlineSeconds: 2700
        containers:
        - args:
          - --trust-remote-code
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          - name: NVIDIA_VISIBLE_DEVICES
            value: void
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          name: main
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: '1'
              memory: 4Gi
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
            runAsUser: 0
          volumeMounts:
          - mountPath: /model-cache
            name: shared-model-cache
          - mountPath: /dev/shm
            name: dshm
        imagePullSecrets:
        - name: common-runtime-pull
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dshm
    replicas: 1
    runtimeVersionOverride: 1.6.0
    type: frontend
  - minAvailable: 1
    name: worker
    podTemplate:
      metadata:
        labels:
          app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
          feature-test-run: dynamo-ft-r610-d906a5f1-sidecar
      spec:
        activeDeadlineSeconds: 2700
        containers:
        - args:
          - exec "$(python3 -c 'import os,vllm; print(os.path.join(os.path.dirname(vllm.__file__),
            "vllm-rs"))')" "$@"
          - engine
          - serve
          - nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
          - --host
          - 0.0.0.0
          - --grpc-port
          - '50051'
          - --revision
          - 8a115b9d966adce8c059a7bcf47f49a1e57957d8
          - --served-model-name
          - nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
          - --trust-remote-code
          - --tensor-parallel-size
          - '2'
          - --max-model-len
          - '8192'
          - --max-num-seqs
          - '4'
          - --max-num-batched-tokens
          - '8192'
          - --gpu-memory-utilization
          - '0.85'
          - --enable-prefix-caching
          - --block-size
          - '64'
          - --mamba-backend
          - flashinfer
          - --mamba-ssm-cache-dtype
          - float16
          - --mamba-cache-mode
          - align
          - --reasoning-parser
          - nemotron_v3
          - --limit-mm-per-prompt
          - '{"image":1,"video":0}'
          - --engine-ready-timeout-secs
          - '1800'
          command:
          - bash
          - -ec
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: PYTHONHASHSEED
            value: '0'
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          livenessProbe:
            failureThreshold: 6
            grpc:
              port: 50051
              service: ''
            periodSeconds: 10
            timeoutSeconds: 5
          name: main
          readinessProbe:
            failureThreshold: 3
            grpc:
              port: 50051
              service: ''
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            claims:
            - name: gpu-main
            limits:
              memory: 256Gi
            requests:
              cpu: '8'
              memory: 128Gi
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RESOURCE
            runAsUser: 0
          startupProbe:
            failureThreshold: 360
            grpc:
              port: 50051
              service: ''
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
          - mountPath: /model-cache
            name: shared-model-cache
          - mountPath: /dev/shm
            name: dshm
        imagePullSecrets:
        - name: common-runtime-pull
        initContainers:
        - args:
          - --grpc-endpoint
          - 127.0.0.1:50051
          command:
          - dynamo-vllm-sidecar
          env:
          - name: DYN_NAMESPACE
            value: dynamo-ft-r610-d906a5f1-sidecar-ft-sidecar
          - name: DYN_DISCOVERY_BACKEND
            value: kubernetes
          - name: DYN_REQUEST_PLANE
            value: tcp
          - name: DYN_EVENT_PLANE
            value: zmq
          - name: DYN_SYSTEM_PORT
            value: '9090'
          - name: HF_HOME
            value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NVIDIA_VISIBLE_DEVICES
            value: void
          image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
          name: runtime
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: '1'
              memory: 1Gi
          restartPolicy: Always
          securityContext:
            runAsUser: 0
          volumeMounts:
          - mountPath: /model-cache
            name: shared-model-cache
        nodeSelector:
          kubernetes.io/hostname: kubecon-nke-site-cp-0942
        resourceClaims:
        - name: gpu-main
          resourceClaimTemplateName: ft-sidecar-worker-main-gpus
        volumes:
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: feature-cache
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dshm
    replicas: 1
    runtimeVersionOverride: 1.6.0
    sharedMemorySize: 16Gi
    type: worker
