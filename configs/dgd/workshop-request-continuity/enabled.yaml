apiVersion: v1
kind: List
items:
- apiVersion: resource.k8s.io/v1
  kind: ResourceClaimTemplate
  metadata:
    name: demo-continuity-enabled-gpus
    namespace: dynamo-ft-continuity-example
  spec:
    spec:
      devices:
        requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            count: 2
- apiVersion: nvidia.com/v1beta1
  kind: DynamoGraphDeployment
  metadata:
    name: demo-continuity-enabled
    namespace: dynamo-ft-continuity-example
  spec:
    backendFramework: vllm
    components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
          - name: main
            image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
            command:
            - python3
            - -m
            - dynamo.frontend
            args:
            - --router-mode
            - round-robin
            - --trust-remote-code
            env:
            - name: HF_HOME
              value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
            - name: HF_HUB_OFFLINE
              value: '1'
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: DYN_MIGRATION_LIMIT
              value: '3'
            - name: DYN_HTTP_BACKEND_STREAM_TIMEOUT_SECS
              value: '30'
            resources:
              requests:
                cpu: '1'
                memory: 4Gi
              limits:
                memory: 8Gi
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              periodSeconds: 10
              timeoutSeconds: 60
              failureThreshold: 60
            volumeMounts:
            - name: shared-model-cache
              mountPath: /model-cache
          volumes:
          - name: shared-model-cache
            persistentVolumeClaim:
              claimName: feature-cache
          imagePullSecrets:
          - name: common-runtime-pull
        metadata:
          labels:
            feature-test-run: dynamo-ft-continuity-example
            workshop-demo: continuity
            workshop-arm: enabled
            workshop-role: frontend
      runtimeVersionOverride: 1.6.0
    - name: agg
      type: worker
      replicas: 2
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                    - NVIDIA-H100-80GB-HBM3
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    workshop-demo: continuity
                    workshop-arm: enabled
                    workshop-role: worker
          tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: 'true'
            effect: NoSchedule
          volumes:
          - name: shared-model-cache
            persistentVolumeClaim:
              claimName: feature-cache
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 16Gi
          containers:
          - name: main
            image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
            command:
            - python3
            - -m
            - dynamo.vllm
            args:
            - --model
            - nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
            - --revision
            - 8a115b9d966adce8c059a7bcf47f49a1e57957d8
            - --trust-remote-code
            - --tensor-parallel-size
            - '2'
            - --max-num-seqs
            - '4'
            - --gpu-memory-utilization
            - '0.85'
            - --limit-mm-per-prompt
            - '{"image":1,"video":0}'
            - --reasoning-parser
            - nemotron_v3
            - --enforce-eager
            - --language-model-only
            env:
            - name: HF_HOME
              value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
            - name: HF_HUB_OFFLINE
              value: '1'
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
              value: '180'
            resources:
              requests:
                cpu: '8'
                memory: 128Gi
              limits:
                memory: 256Gi
              claims:
              - name: gpu-main
            securityContext:
              runAsUser: 0
              capabilities:
                add:
                - IPC_LOCK
                - SYS_RESOURCE
            startupProbe:
              httpGet:
                path: /live
                port: 9090
              periodSeconds: 30
              timeoutSeconds: 20
              failureThreshold: 120
            volumeMounts:
            - name: shared-model-cache
              mountPath: /model-cache
            - name: dshm
              mountPath: /dev/shm
          imagePullSecrets:
          - name: common-runtime-pull
          resourceClaims:
          - name: gpu-main
            resourceClaimTemplateName: demo-continuity-enabled-gpus
        metadata:
          labels:
            feature-test-run: dynamo-ft-continuity-example
            workshop-demo: continuity
            workshop-arm: enabled
            workshop-role: worker
      runtimeVersionOverride: 1.6.0
