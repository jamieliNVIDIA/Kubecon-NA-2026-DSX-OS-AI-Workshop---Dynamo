    backendFramework: vllm
    components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
          - name: main
            image: nvcr.io/nvidian/dynamo-dev/nealv@sha256:e98d074e84e584a93967aa2f53e2c1092cea631034b1b9277c8753f8c3ba307d
            command:
            - python3
            - /guard-runtime/runtime.py
            - frontend
            args: []
            env:
            - name: HF_HOME
              value: /model-cache/feature-tests/20261015-super-vl-tp2/hf
            - name: HF_HUB_OFFLINE
              value: '1'
            - name: HF_MODULES_CACHE
              value: /tmp/hf_modules
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
            - name: KVCR_DYNAMO_NAMESPACE
              value: dynamo-ft-r610-2035846e-kvcrguard-guard
            - name: CONTAINER_NAME
              value: main
            - name: DYN_MIGRATION_LIMIT
              value: '0'
            resources:
              requests:
                cpu: '1'
                memory: 4Gi
              limits:
                memory: 8Gi
            startupProbe:
              httpGet:
                path: /health
                port: 8000
              periodSeconds: 10
              timeoutSeconds: 60
              failureThreshold: 60
            volumeMounts:
            - name: shared-model-cache
              mountPath: /model-cache
            - name: guard-runtime
              mountPath: /guard-runtime
              readOnly: true
          volumes:
          - name: shared-model-cache
            persistentVolumeClaim:
              claimName: feature-cache
          - name: guard-runtime
            configMap:
              name: kvcr-guard-runtime-24f56786caaa
          imagePullSecrets:
          - name: common-runtime-pull
          nodeSelector:
            kubernetes.io/hostname: kubecon-nke-site-cp-0124
          terminationGracePeriodSeconds: 45
        metadata:
          labels:
            feature-test-run: dynamo-ft-r610-2035846e-kvcrguard
            workshop-kvcr-guard: 'true'
            workshop-role: frontend
      runtimeVersionOverride: 1.6.0
    - name: engine-a
