    name: ft-kvcr-guard-a-gpus
    namespace: dynamo-ft-r610-2035846e-kvcrguard
    labels:
      app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
      feature-test-run: dynamo-ft-r610-2035846e-kvcrguard
  spec:
    spec:
      devices:
        requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            count: 2
