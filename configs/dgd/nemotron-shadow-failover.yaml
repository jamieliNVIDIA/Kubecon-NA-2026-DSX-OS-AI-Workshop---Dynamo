apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  annotations:
    nvidia.com/dynamo-kube-discovery-mode: container
  name: ft-shadow
  namespace: dynamo-ft-20261013t055731z
  labels:
    app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
    feature-test-run: dynamo-ft-20261013t055731z
spec:
  components:
  - name: Frontend
    podTemplate:
      spec:
        containers:
        - image: nvcr.io/nvidia/ai-dynamo/vllm-runtime@sha256:2b224a823d52a198ec0eeb0e3e4f5cf26cd8a7fc2e9812ee16204b6b1e974870
          name: main
          volumeMounts:
          - name: cache
            mountPath: /model-cache
            readOnly: true
          - name: dshm
            mountPath: /dev/shm
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013-shadow-preflight/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm-cache
          - name: TRITON_CACHE_DIR
            value: /tmp/triton-cache
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: PYTHONHASHSEED
            value: '0'
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
          - --router-mode
          - round-robin
          - --trust-remote-code
          resources:
            requests:
              cpu: '1'
              memory: 4Gi
            limits:
              memory: 8Gi
        volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        activeDeadlineSeconds: 3600
      metadata:
        labels:
          app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
          feature-test-run: dynamo-ft-20261013t055731z
    replicas: 1
    type: frontend
    runtimeVersionOverride: 1.5.1
  - experimental:
      gpuMemoryService: {}
      failover: {}
    name: VllmWorker
    podTemplate:
      spec:
        containers:
        - args:
          - --model
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --revision
          - bee7596271d1495f6992ae224aefde4410e816b8
          - --served-model-name
          - nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
          - --trust-remote-code
          - --tensor-parallel-size
          - '1'
          - --max-model-len
          - '4096'
          - --max-num-seqs
          - '8'
          - --max-num-batched-tokens
          - '8192'
          - --gpu-memory-utilization
          - '0.65'
          - --enable-prefix-caching
          - --block-size
          - '64'
          - --mamba-backend
          - flashinfer
          - --mamba-ssm-cache-dtype
          - float16
          - --mamba-cache-mode
          - align
          - --reasoning-parser
          - nemotron_v3
          - --disaggregation-mode
          - agg
          - --load-format
          - gms
          - --enable-sleep-mode
          command:
          - python3
          - -m
          - dynamo.vllm
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime@sha256:2b224a823d52a198ec0eeb0e3e4f5cf26cd8a7fc2e9812ee16204b6b1e974870
          name: main
          resources:
            requests:
              cpu: '4'
              memory: 64Gi
              nvidia.com/gpu: '1'
            limits:
              memory: 128Gi
              nvidia.com/gpu: '1'
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
          - name: cache
            mountPath: /model-cache
            readOnly: true
          - name: dshm
            mountPath: /dev/shm
          env:
          - name: HF_HOME
            value: /model-cache/feature-tests/20261013-shadow-preflight/hf
          - name: HF_HUB_OFFLINE
            value: '1'
          - name: HF_MODULES_CACHE
            value: /tmp/hf_modules
          - name: VLLM_CACHE_ROOT
            value: /tmp/vllm-cache
          - name: TRITON_CACHE_DIR
            value: /tmp/triton-cache
          - name: NCCL_IB_DISABLE
            value: '1'
          - name: PYTHONHASHSEED
            value: '0'
          - name: DYN_HEALTH_CHECK_REQUEST_TIMEOUT
            value: '180'
        volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: feature-cache
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        activeDeadlineSeconds: 3600
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-H100-80GB-HBM3
      metadata:
        labels:
          app.kubernetes.io/managed-by: kubecon-dynamo-feature-tests
          feature-test-run: dynamo-ft-20261013t055731z
    replicas: 1
    type: worker
    runtimeVersionOverride: 1.5.1
    sharedMemorySize: 16Gi
  backendFramework: vllm
